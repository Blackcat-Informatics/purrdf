[package]
name = "purrdf-cli"
description = "PurRDF command-line interface: the `purrdf` convert/query/update/reason pipeline over the native codecs, pack container, SPARQL engine, and entailment closures"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords = ["rdf", "rdf-12", "sparql", "cli", "command-line"]
categories = ["command-line-utilities"]
publish = false

[lints]
workspace = true

[[bin]]
name = "purrdf"
path = "src/main.rs"

[dependencies]
# The native RDF text/statement codec surface: `classify`, `parse_dataset`,
# `serialize_dataset_to_format`, and `NativeRdfFormat`. This is the format
# authority the CLI's `--from`/`--to` routing resolves against.
purrdf-rdf = { workspace = true }
# The oxigraph-free kernel: the frozen `RdfDataset`/`DatasetView` model, the
# pack container (`PackBuilder`/`PackView`/`verify_pack`/`dataset_from_view`),
# the loss ledger, and the `SparqlResult` model.
purrdf-core = { workspace = true }
# The native SPARQL engine driving the `query` subcommand over any `DatasetView`.
purrdf-sparql-eval = { workspace = true }
# The W3C SPARQL-Results serializers (JSON/XML/CSV/TSV) for SELECT/ASK results.
purrdf-sparql-results = { workspace = true }
# The entailment regimes driving the `reason` subcommand's closure materialization.
purrdf-entail = { workspace = true }
# The umbrella's ENTAILMENT-AWARE QUERY lane: `query_with_entailment` is the one
# entry point that runs the combined approach (query-directed OWL-Direct answering
# over a restricted chase) and filters its witnesses. `query --entailment` calls it
# rather than reimplementing "materialize, then evaluate", because the lane that
# open-codes those two steps silently skips the combined approach — which is how
# `--entailment owl-direct` came to answer `[]` for a query whose certain answer the
# library already computed. Depending on the umbrella (rather than on
# `purrdf-sparql-eval` plus `purrdf-entail` and re-deriving the orchestration) is
# what makes the CLI a CONSUMER of the published surface instead of a second
# implementation of it.
purrdf = { workspace = true }
# The ONE rendered form of a `ReasoningReport`. `--report` writes exactly what the
# Python, WASM and C-ABI hosts read, because it is the same function rather than a
# second renderer described as equivalent; `regime_name` is the same regime
# vocabulary `--regime`/`--entailment` accept.
purrdf-validate = { workspace = true }
# Zero-copy memory-mapped reads of on-disk pack files: a pack source is mmap'd
# and handed to `PackView::from_bytes` with no materialization. Native-only —
# this crate is never built for wasm32 (it is absent from the `make wasm`
# `-p` allowlist), so mmap's absence there is a non-issue.
memmap2 = { workspace = true }
# Command-tree argument parsing (`Parser`/`Subcommand`/`ValueEnum`).
clap = { workspace = true }
# `--provenance-namespace`'s `query_hash`: a content hash of the query text, computed
# from data this host already has in hand (see `query::build_query_provenance`).
sha2 = { workspace = true }

[dev-dependencies]
# Isolated temp files/dirs for the integration tests that drive the built binary.
tempfile = { workspace = true }
# Parse the machine-readable runtime ledger in projection CLI integration tests.
serde_json = { workspace = true }
