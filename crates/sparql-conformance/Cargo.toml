[package]
name = "purrdf-sparql-conformance"
description = "Native W3C SPARQL 1.1 conformance harness: discovers mf: test manifests, runs the native purrdf-sparql-eval engine, and diffs against expected SPARQL Results (SRX/SRJ) / canonical N-Quads. Federated SERVICE tests resolve through an in-memory RemoteQuerySource (no network)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# The engine under test + its algebra front-end.
purrdf-sparql-eval = { workspace = true }
purrdf-sparql-algebra = { workspace = true }
# Native Turtle/TriG/N-Quads loader (parse_dataset) + RDFC-1.0 canonicalization,
# both native.
purrdf = { workspace = true }
purrdf-core = { workspace = true }
# The one extension-to-media-type table the data-file loaders filter.
purrdf-gts = { workspace = true }
# The SEP-0009 composite value space: the lexical-space grader the divergence
# scan reads (`tests/cdt_lexical_divergence.rs`).
purrdf-cdt = { workspace = true }
# Hand-rolled SPARQL Results readers for the expected SRX/SRJ files.
purrdf-sparql-results = { workspace = true }
# Native RDFS/OWL-RL entailment closure for `sd:entailmentRegime` tests.
purrdf-entail = { workspace = true }
# The W3C vocabulary IRIs the manifests and the RIF and OWL 2 harnesses read.
purrdf-iri = { workspace = true }
# The workspace root a manifest's sentinel-space file IRIs resolve against
# (`src/manifest.rs`), and the libtest-compatible runner the `harness = false`
# `sparql_conformance` target hands its discovered manifests to. This crate is
# unpublished, so a normal edge to the unpublished test support is allowed.
purrdf-testkit = { workspace = true }
# The community SHACL runner: the dated-profile engine and shared validate doors
# under test, and the unpublished kit that owns report and outcome grading.
purrdf-conformance-kit = { workspace = true }
purrdf-shapes = { workspace = true }
purrdf-validate = { workspace = true }
purrdf-lex = { workspace = true }

[dev-dependencies]
# Runs the deep-structure tests on a stack of a stated size: a fresh thread
# natively, the running stack under a fresh floor on wasm32.
purrdf-stack = { workspace = true }
# FNV-1a, the fixed digest the governor-corpus and evaluator-trace sweeps pin
# their partial rows by.
purrdf-hash = { workspace = true }

[[test]]
name = "sparql_conformance"
harness = false

# PURRDF-owned native regression corpus. This deliberately avoids the historical
# ontology query corpus and does not load generated/dist/purrdf.gts; the broad
# W3C / extension coverage stays in the manifest-driven `sparql_conformance` test.
[[test]]
name = "corpus_conformance"
harness = true

# The community SHACL corpus under every applicable dated profile.
[[test]]
name = "community_conformance"
harness = true
