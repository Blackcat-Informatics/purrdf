[package]
name = "purrdf-bench"
description = "Benchmark tooling: the deterministic, shardable scale-corpus generator whose mixed IRI classes keep a capacity claim honest, and the home of the comparison-workload drivers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords = ["rdf", "benchmark", "corpus"]
categories = ["development-tools::testing"]
publish = false

[lints]
workspace = true

[[bin]]
name = "bench-corpus"
path = "src/main.rs"

[dev-dependencies]
# Test-only round-trip validation: every generated row must satisfy the
# project's own strict N-Quads reader. The generator itself has zero
# dependencies — pure arithmetic and formatting.
purrdf-rdf = { workspace = true }
