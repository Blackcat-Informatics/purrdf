[package]
name = "purrdf-bench"
description = "Benchmark tooling: deterministic scale and native university corpus generation and verification"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords = ["rdf", "benchmark", "corpus"]
categories = ["development-tools::testing"]
publish = false

[lints]
workspace = true

[[bin]]
name = "bench-corpus"
path = "src/main.rs"

[[bin]]
name = "lubm-corpus"
path = "src/lubm_main.rs"

[[bin]]
name = "lubm-check"
path = "src/lubm_check_main.rs"

[dependencies]
# The generator's SplitMix64 stream is `purrdf_hash::mix`, the zero-dependency
# root every crate may reach. W3C terms come from their shared vocabulary home.
# Actual graph and query-result acceptance uses the existing RDF/model and
# SPARQL Results homes rather than a private scanner or result parser.
purrdf-hash = { workspace = true }
purrdf-iri = { workspace = true }
purrdf-xsd = { workspace = true }
purrdf-lex = { workspace = true }
purrdf-rdf = { workspace = true }
purrdf-sparql-results = { workspace = true }

[dev-dependencies]
# Test-only: parse the --manifest JSON contract in the CLI integration tests.
purrdf-lex = { workspace = true }
# Test-only: the base16 reader and writer the percent-escape checks spell octets with.
purrdf-hash = { workspace = true }
# Test-only: the workspace root the make-driven tests run `make` from.
purrdf-testkit = { workspace = true }
