[package]
name = "purrdf-bench"
description = "Benchmark tooling: the deterministic, shardable scale-corpus generator whose mixed IRI classes keep a capacity claim honest"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords = ["rdf", "benchmark", "corpus"]
categories = ["development-tools::testing"]
publish = false

[lints]
workspace = true

[[bin]]
name = "bench-corpus"
path = "src/main.rs"

[[bin]]
name = "lubm-corpus"
path = "src/lubm_main.rs"

[dependencies]
# The generator's SplitMix64 stream is `purrdf_hash::mix`, the zero-dependency
# root every crate may reach. The W3C terms the corpus writes (`rdf:reifies`,
# the XSD datatype namespace) come from the workspace's one spelling of each;
# none of these crates takes a third-party dependency. Everything else is pure
# arithmetic and formatting.
purrdf-hash = { workspace = true }
purrdf-iri = { workspace = true }
purrdf-xsd = { workspace = true }
purrdf-lex = { workspace = true }

[dev-dependencies]
# Test-only round-trip validation: every generated row must satisfy the
# project's own strict N-Quads reader.
purrdf-rdf = { workspace = true }
# Test-only: parse the --manifest JSON contract in the CLI integration tests.
purrdf-lex = { workspace = true }
# Test-only: the base16 reader and writer the percent-escape checks spell octets with.
purrdf-hash = { workspace = true }
# Test-only: the workspace root the make-driven tests run `make` from.
purrdf-testkit = { workspace = true }
