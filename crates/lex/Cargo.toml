[package]
name = "purrdf-lex"
description = "Native lexical foundations for PurRDF's grammars, over the zero-dependency purrdf-hash root: the exact Turtle/SPARQL/XML/ECMA-262 character-class terminals and escape decoders, chunked byte-class scanners and needle searches that lower to packed compares, the RFC 8259 JSON string escaper and decoder, the JSON reader, value and deterministic writer, the YAML 1.2 reader and emitter, the RFC 8949 CBOR codec, RFC 6901 JSON Pointer tokens, RFC 3986 percent-encoding, and Unicode normalization (NFC, NFD, NFKC, NFKD) as streaming stages"
version.workspace = true
edition.workspace = true
repository.workspace = true
license = "(MIT OR Apache-2.0 OR MulanPSL-2.0) AND Unicode-3.0"
homepage.workspace = true
documentation = "https://docs.rs/purrdf-lex"
rust-version.workspace = true
keywords = ["lexer", "grammar", "unicode", "normalization", "rdf"]
categories = ["parser-implementations", "encoding", "text-processing"]

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[lib]
# rlib-only, one runtime dependency: the lexical layer directly above the
# `purrdf-hash` root in layers.toml, held to that by `make rdf-core-hygiene`.
# Portable Rust over caller-supplied bytes — no `unsafe`, no threads, no
# filesystem, no clock, no entropy — so it is wasm32-clean on every target.
crate-type = ["rlib"]
path = "src/lib.rs"
name = "purrdf_lex"

[dependencies]
# The one hex-digit reader (`hex::nibble`, `hex::parse_u32`) every escape and
# percent-encoding decoder here reads its digits with: the zero-dependency root.
purrdf-hash = { workspace = true }

[dev-dependencies]
# The SplitMix64 stream the scanner and escaper equivalence tests draw their
# fixed-seed inputs from, and the native benchmark harness. Path-only and
# unpublished, so it is stripped from the packaged manifest.
purrdf-testkit = { workspace = true }

[[bench]]
name = "scan"
harness = false

[[test]]
name = "frozen_vectors"
harness = false
