[package]
name = "purrdf-lex"
description = "Native, zero-dependency lexical foundations for PurRDF's grammars: the exact Turtle/SPARQL/XML character-class terminals, chunked byte-class scanners that lower to packed compares, and the RFC 8259 JSON string escaper"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/purrdf-lex"
rust-version.workspace = true
keywords = ["lexer", "grammar", "simd", "json", "rdf"]
categories = ["parser-implementations", "encoding", "text-processing"]

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[lib]
# rlib-only, ZERO runtime dependencies: the lexical layer directly above the
# `purrdf-hash` root in layers.toml, held to that by `make rdf-core-hygiene`.
# Portable Rust over caller-supplied bytes — no `unsafe`, no threads, no
# filesystem, no clock, no entropy — so it is wasm32-clean on every target.
crate-type = ["rlib"]
path = "src/lib.rs"
name = "purrdf_lex"

[dev-dependencies]
# The SplitMix64 stream the scanner and escaper equivalence tests draw their
# fixed-seed inputs from, and the native benchmark harness. Path-only and
# unpublished, so it is stripped from the packaged manifest.
purrdf-testkit = { workspace = true }

[[bench]]
name = "scan"
harness = false
