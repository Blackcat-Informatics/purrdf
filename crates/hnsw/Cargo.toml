[package]
name = "purrdf-hnsw"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Deterministic HNSW approximate nearest neighbor index for PurRDF"
keywords = ["hnsw", "ann", "vector", "search", "deterministic"]
categories = ["algorithms", "data-structures"]

[dependencies]
purrdf-core = { workspace = true }
purrdf-sparql-eval = { workspace = true }
# The XSD value space, for the relation's canonical `xsd:double` distances and its
# `xsd:integer` neighbour count. A zero-dependency foundation crate, wasm-clean, and the
# same value space the exact kNN relation formats through — so the approximate and exact
# surfaces emit byte-identical distance literals.
purrdf-xsd = { workspace = true }
rayon = { workspace = true }

[dev-dependencies]
# The conformance gate emits a machine-checkable receipt, and a receipt is JSON because
# its whole purpose is to be read by something other than the process that wrote it. The
# crate's runtime surface is untouched: a dev-dependency never reaches the wasm32 `--lib`
# build, and the receipt schema (not serde) is what fixes the record's shape.
serde_json = { workspace = true }
# The shared `harness = false` runner the two cross-target targets below run on,
# natively and on wasm32-unknown-unknown alike. Path-only and unpublished, so it is
# stripped from the packaged manifest; wasm32-clean, so it needs no target gate.
purrdf-testkit = { workspace = true }

[lints]
workspace = true

# The test that builds, records, decodes, verifies and searches a reassociated index
# ON wasm32-unknown-unknown rather than merely compiling for it. The reassociated image
# records the wasm dispatch path (`wasm-simd128` or `wasm-scalar`) and the build shape,
# and refuses the other path; a claim about wasm32 is evidence only when it executes
# there. `harness = false` on the shared runner, so `make wasm-test` runs the same named
# cases in Node through scripts/wasm-test-runner.sh that `cargo test` runs natively.
[[test]]
name = "wasm_reassociated"
harness = false

# The cross-target determinism proof: the same named cases run natively and on
# wasm32-unknown-unknown (baseline and +simd128) in Node through
# scripts/wasm-test-runner.sh, and `make hnsw-determinism` compares the digest each
# one reports.
[[test]]
name = "determinism"
harness = false

# Both benches are one-shot, report-only measurement harnesses rather than criterion
# statistical targets, and deliberately so. The build-cost harness measures a build that
# takes minutes to tens of minutes at the top scales; criterion's whole method is to
# repeat a closure until the sampling distribution settles, which for a 10^6-row build
# would mean hours per point and a measurement of the machine's thermal state rather than
# the code. A harness that times one build per scale and prints it is the honest
# instrument for this quantity. The recall harness needs p50/p99 percentiles, an
# exact-rank distribution and visited-work counts — none of which are criterion's output.
[[bench]]
name = "build"
harness = false

[[bench]]
# Sweeps every corpus twice -- the `Exact` index (`HnswIndex::build`) and the
# `Reassociated` one (`HnswIndex::build_reassociated`) -- each graded against the same
# exact oracle and printed side by side, never divided into each other.
name = "recall"
harness = false
