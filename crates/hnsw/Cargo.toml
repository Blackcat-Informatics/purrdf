[package]
name = "purrdf-hnsw"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Deterministic HNSW approximate nearest neighbor index for PurRDF"
keywords = ["hnsw", "ann", "vector", "search", "deterministic"]
categories = ["algorithms", "data-structures"]

[dependencies]
purrdf-core = { workspace = true }
purrdf-sparql-eval = { workspace = true }
# The XSD value space, for the relation's canonical `xsd:double` distances and its
# `xsd:integer` neighbour count. A zero-dependency foundation crate, wasm-clean, and the
# same value space the exact kNN relation formats through — so the approximate and exact
# surfaces emit byte-identical distance literals.
purrdf-xsd = { workspace = true }
rayon = { workspace = true }
# The workspace root: the relation's space-generation hash domain is a registered
# `purrdf_hash::Domain` (the tests also read `purrdf_hash::dispatch::REQUIRE_SIMD_PATHS`,
# the name of the variable the path-requirement test reports under).
purrdf-hash = { workspace = true }
# The lexical foundations: the error conversions are declared through its one
# `From`-into-a-variant spelling, and the conformance gate's machine-checkable receipt
# (a test) is JSON written through its writer.
purrdf-lex = { workspace = true }

[dev-dependencies]
purrdf-alloc-probe = { workspace = true }
# The shared `harness = false` runner for the native corpus and focused WASM
# path-admission cases. Path-only and unpublished, so it is stripped from the
# packaged manifest; wasm32-clean, so it needs no target gate.
purrdf-testkit = { workspace = true }

[lints]
workspace = true

# Complete native reassociated-index behavior. `make wasm-test` selects the
# actual WASM build shape, arithmetic-path identity and foreign-path refusal.
[[test]]
name = "wasm_reassociated"
harness = false

# Complete native determinism corpus, including the worker-count sweep.
# WASM dispatch and path admission are selected separately by `make wasm-test`.
[[test]]
name = "determinism"
harness = false

# Both benches are one-shot, report-only measurement harnesses rather than sampled
# statistical targets, and deliberately so. The build-cost harness measures a build that
# takes minutes to tens of minutes at the top scales; a sampling harness's whole method is to
# repeat a closure until the sampling distribution settles, which for a 10^6-row build
# would mean hours per point and a measurement of the machine's thermal state rather than
# the code. A harness that times one build per scale and prints it is the honest
# instrument for this quantity. The recall harness needs p50/p99 percentiles, an
# exact-rank distribution and visited-work counts — none of which is a sampling harness's output.
[[bench]]
name = "build"
harness = false

[[bench]]
# Sweeps every corpus twice -- the `Exact` index (`HnswIndex::build`) and the
# `Reassociated` one (`build::<Reassociated>`) -- each graded against the same
# exact oracle and printed side by side, never divided into each other.
name = "recall"
harness = false
