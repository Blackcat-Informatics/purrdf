[package]
name = "purrdf-jsonschema"
description = "Native JSON Schema validation for PurRDF: drafts 2020-12, 2019-09 and 07, every vocabulary, dynamic and recursive references, unevaluated keywords, standard output formats"
version.workspace = true
edition.workspace = true
repository.workspace = true
license = "(MIT OR Apache-2.0 OR MulanPSL-2.0) AND Unicode-3.0"
homepage.workspace = true
documentation = "https://docs.rs/purrdf-jsonschema"
rust-version.workspace = true
keywords = ["json-schema", "validation", "json", "wasm", "rdf"]
categories = ["encoding", "parser-implementations"]
# The vendored JSON-Schema-Test-Suite and meta-schemas are test data under
# their own licences, never part of the published crate (which carries no
# meta-schema: callers register them). The suite targets read nothing else,
# so they stay with their data.
exclude = [
  "tests/suite/**",
  "tests/metaschemas/**",
  "tests/suite.rs",
  "tests/suite_draft2019_09.rs",
  "tests/suite_draft7.rs",
  "tests/suite_runner/**",
]

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[lib]
# rlib-only leaf: the JSON value model, the regex engine
# the ECMA-262 `pattern` translation targets, and the workspace's one RFC 3986
# reference resolver. No threads, no filesystem, no clock: wasm32-clean.
crate-type = ["rlib"]
path = "src/lib.rs"
name = "purrdf_jsonschema"

[dependencies]
# The engine every translated ECMA-262 `pattern` runs on.
regex = { workspace = true }
# `$id`/`$ref`/`$dynamicRef` resolution: the workspace's single RFC 3986 §5
# resolver, never a second one.
purrdf-iri = { workspace = true }
# The fixed-key hasher that buckets `uniqueItems` candidates.
purrdf-hash = { workspace = true }
# The RFC 3339 grammar behind the `date-time`, `date` and `time` formats, and
# the exact value of a JSON number that equality, ordering and `multipleOf`
# compute on.
purrdf-xsd = { workspace = true }
# Schemas and instances are `purrdf_lex::json::Value`s, whose numbers keep the
# lexeme the document wrote; the ECMA-262 `WhiteSpace` and `LineTerminator`
# terminals `\s` and `.` are spelled with; and the Unicode version the property
# tables assert.
purrdf-lex = { workspace = true }

[dev-dependencies]
# Runs the deep-structure tests on a stack of a stated size: a fresh thread
# natively, the running stack under a fresh floor on wasm32.
purrdf-stack = { workspace = true }
# The `harness = false` suite runner and the frozen differential vectors.
# Path-only and unpublished, so it is stripped from the packaged manifest.
purrdf-testkit = { workspace = true }

[[bench]]
name = "validate"
harness = false

# The official JSON-Schema-Test-Suite, one libtest case per suite test: one
# target per draft, so each is its own conformance row.
[[test]]
name = "suite"
path = "tests/suite.rs"
harness = false

[[test]]
name = "suite_draft2019_09"
path = "tests/suite_draft2019_09.rs"
harness = false

[[test]]
name = "suite_draft7"
path = "tests/suite_draft7.rs"
harness = false
