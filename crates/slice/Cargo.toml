[package]
name = "purrdf-slice"
description = "PurRDF native slice catalog: manifest-based discovery, typed artifact inventory, content-addressed IDs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/purrdf-slice"
rust-version.workspace = true
keywords = ["rdf", "linked-data", "manifest", "slice", "provenance"]
categories = ["data-structures"]

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[lib]
crate-type = ["rlib"]
path = "src/lib.rs"

[dependencies]
# The slice catalog/emitters/linters parse via the native
# `gts` text codecs (`parse_dataset`) into the `RdfDataset` IR and query it directly.
purrdf-rdf = { workspace = true }
# The ring-fenced kernel, named directly (not through the `purrdf` umbrella) for
# `graph::tarjan_scc`: the workspace's ONE strongly-connected-components
# implementation, which the link-unit linker runs over slice dependency edges.
# It is a generic index-graph algorithm with no RDF surface, so it does not
# belong on the umbrella's re-export list; a direct edge also states the real
# dependency instead of laundering it. Already upstream of this crate in the
# publish order, so the release lane is unchanged.
purrdf-core = { workspace = true }
# The one extension-to-media-type table (`purrdf_gts::files::media_type_for_path`),
# behind the catalog's artifact media types and the RDF query loader's syntax
# routing. Already upstream of this crate through `purrdf-rdf`.
purrdf-gts = { workspace = true }
# Native SPARQL parser — competency/verify queries are PARSED
# (RFC §10), never text-searched, to extract referenced term IRIs.
# RDF-1.2 quoted triple terms are first-class.
purrdf-sparql-algebra = { workspace = true }
# The IRI value space. `BaseIri` validates the RFC-8089 `file://` retrieval IRI this
# crate derives for every on-disk document it parses (RFC-3986 5.1.3) — the one
# implementation of that step in the workspace, since `purrdf-slice` is the only
# library crate here that opens files. Zero-dependency foundation crate.
purrdf-iri = { workspace = true }
# The RDF 1.2 term syntax and literal escaper the analysis-graph Turtle writer
# spells its literals and IRIs with.
purrdf-lex = { workspace = true }
# Default features (std) re-enabled; the workspace-level entry is
# default-features = false for the wasm-clean eval path.
sha2 = { workspace = true, default-features = true }
# Lowercase hex rendering of those SHA-256 digests.
purrdf-hash = { workspace = true }
# The prefix-consistency lint scans authored `.ttl` / `.rq` sources for `@prefix` /
# `PREFIX` declarations with a regex, to police registry-prefix shadowing. External
# published crate (already in the workspace lockfile, used by purrdf-validate/purrdf-shapes),
# so the S0.9 layering gate is unaffected.
regex = { workspace = true }
rayon = { workspace = true }

[dev-dependencies]
# Temporary slice trees under the target directory, for the tests and the bench.
purrdf-testkit = { workspace = true }

[[bench]]
name = "ownership"
harness = false
