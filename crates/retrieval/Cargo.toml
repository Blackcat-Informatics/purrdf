[package]
name = "purrdf-retrieval"
description = "Composition layer over the ranked property-function producers: pure-data retrieval plans with a canonical, domain-separated BLAKE3 identity, driven by caller-supplied producers, strata and weights with no fabricated default vocabulary."
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/purrdf-retrieval"
rust-version.workspace = true
readme = "README.md"
keywords = ["rdf", "sparql", "retrieval", "search", "ranking"]
categories = ["database-implementations", "data-structures"]

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[lib]
# rlib-only and wasm32-unknown-unknown-clean: the crate is a pure composition
# layer over the SPARQL evaluator's property-function seam. It holds no store,
# opens no file and reads no clock.
crate-type = ["rlib"]
path = "src/lib.rs"
name = "purrdf_retrieval"

[dependencies]
# The RDF 1.2 IR: caller-supplied IRIs are validated with the kernel's parser,
# and terms are carried without ever naming a dataset-local `TermId`.
purrdf-core.workspace = true
# The property-function seam: `RegistryId` is the instance identity a plan
# records, and the producer-capability declarations are consumed from here.
purrdf-sparql-eval.workspace = true
# The SPARQL front end the evaluator above parses with, used at exactly one seam: a
# caller-supplied query text. `StratumUnit::new` reads it through this parser, so a
# text that is not a query (or not a `SELECT`) is refused at construction, the two
# clauses the wrapping `SELECT` has no place for — the prologue and the dataset
# clause — are found and moved onto the wrapper that bounds it, and a text declaring
# an exclusion basis is checked for the one-call shape its lookup is derived from.
# That lookup is written as algebra from the prepared call and serialised by this
# crate's writer. Nothing else in this crate looks at SPARQL as anything but a string.
purrdf-sparql-algebra.workspace = true
# The exact base-10 fixed-point type (`Fixed`) stratum weights are expressed in,
# so a plan never carries a float where exactness is the whole point.
purrdf-text.workspace = true
# Fixed-output-length hashing for the plan identity. Deterministic and keyless,
# so the same canonical bytes yield the same digest on every target.
blake3.workspace = true
# The workspace's fixed-key, seed-free hasher, for the fusion engine's
# emitted-candidate lookup table. Fixed-key rather than `RandomState` because
# this crate must build and behave identically on `wasm32-unknown-unknown`,
# where there is no random source to seed one from. The table is consulted and
# never iterated, so no hash order can reach an answer — see the determinism
# argument on `FusionStream`'s `emitted` field.
ahash.workspace = true
# Serialization of the plan as a plain document. `derive` builds the impls.
serde.workspace = true
# Error types carry structured context; `derive` builds the impls.
thiserror.workspace = true

[dev-dependencies]
# The workspace's shared counting allocator, for `tests/fusion_frontier_alloc.rs`.
# Path-only and unpublished, so it is stripped from the packaged manifest;
# std-only and dependency-free, so it is wasm32-clean and needs no target gate.
purrdf-alloc-probe = { workspace = true }
# Colored line-diffs on assert_eq! failure (repo convention).
pretty_assertions.workspace = true
# A document format for the serde round-trip test.
serde_json.workspace = true
# The timed benches (`benches/on_demand_read.rs`). Report-only.
criterion = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
# The wasm32 test harness, for `tests/wasm_determinism.rs` — the one test in this
# crate that must EXECUTE on wasm32-unknown-unknown rather than merely compile
# for it. A fused score is a sum of truncated reciprocals and the whole ordering
# claim rests on those being the same value everywhere; "the same answer on every
# target" is a claim no number of runs on ONE target can check. Run by
# `make wasm-test`.
wasm-bindgen-test = { workspace = true }

# Peak-allocation evidence for the fused frontier, in its own process so the
# tracking allocator's atomics skew no timed measurement. Report-only: it prints
# `peak_allocated_bytes` and `rss_delta_kb` and asserts nothing, because this
# machine is not quiet and a threshold would be a flaky gate. The bound itself is
# enforced by `tests/fusion_frontier_alloc.rs`, which compares two runs.
[[bench]]
name = "fusion_frontier_alloc"
harness = false

# The fused read taken on demand against the same read materialised, over the three
# shapes that decide what reading a row per pull is worth. Report-only: the
# deterministic counterparts are asserted in `tests/multimodal_read_bound.rs`.
[[bench]]
name = "on_demand_read"
harness = false
