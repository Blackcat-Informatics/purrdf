[package]
name = "purrdf-entail"
description = "PurRDF native entailment: wasm-clean forward-materialization RDFS + OWL-RL closure over the RdfDataset IR"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/purrdf-entail"
rust-version.workspace = true
readme = "README.md"
keywords = ["rdf", "rdfs", "owl", "entailment", "reasoning"]
categories = ["algorithms", "data-structures"]

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[lib]
crate-type = ["rlib"]
path = "src/lib.rs"

[dependencies]
# The frozen RDF 1.2 IR (RdfDataset / builder / TermValue). The reasoner indexes
# purrdf terms directly and emits a derived dataset — no external reasoner, no
# string round-trip. purrdf-core is wasm32-unknown-unknown-clean, keeping this
# crate wasm-clean (MAXIMAL PORTABILITY).
purrdf-core = { workspace = true }
# The DL-clause IR, the contract hash and the budget report. The reasoning report
# names the calculus a closure was minted under with purrdf-datalog's own
# `contract_hash`, so a consumer can refuse a cached verdict from another calculus
# instead of comparing two prose claims. wasm32-unknown-unknown-clean, so this
# crate stays in the workspace wasm gate.
purrdf-datalog = { workspace = true }
# The XSD value space. OWL 2 Profiles §4.3 Table 8 quantifies over "the data value of a
# literal", which is arithmetic over values rather than a join over triples, so the chase
# decides it with the repository's own zero-dependency, wasm-clean kernel crate instead of
# comparing lexical forms and calling it datatype reasoning. purrdf-xsd is already a
# transitive dependency of every artifact that ships this crate, so the edge costs
# essentially nothing, and it stays wasm32-unknown-unknown-clean.
purrdf-xsd = { workspace = true }
roxmltree = { workspace = true }
# Fixed-key store-once interners and RIF posting-list indexes.
ahash = { workspace = true }
hashbrown = { workspace = true }

[dev-dependencies]
# Report-only chase microbenchmark; `make bench` lane, excluded from `make check`.
criterion = { workspace = true }

[[bench]]
# Forward-materialization chase latency over a synthetic subclass hierarchy at two
# depths — a regression watch on the semi-naive fixpoint. Report-only.
name = "chase"
harness = false
