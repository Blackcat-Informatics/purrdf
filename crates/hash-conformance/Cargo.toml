[package]
name = "purrdf-hash-conformance"
description = "The frozen-vector conformance suites of purrdf-hash: digest differentials, BLAKE3 streaming boundaries, base16 rendering and the fixed-key table hasher's self-vectors and quality, replayed natively and on wasm32-unknown-unknown, plus the digest and base16 throughput bench and the table hasher's latency bench"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[lib]
path = "src/lib.rs"
# The library holds no benchmarks, and `cargo bench -p purrdf-hash-conformance
# -- <harness options>` hands every option to each bench target it runs: kept
# out of the bench run, the library's libtest never sees `--save-baseline`.
bench = false

[dependencies]
# The crate under test. It has zero runtime dependencies and uses none of the
# test support below, which is why its vector suites live here: testkit itself
# depends on it, and a dev-dependency back onto testkit would close a cycle.
purrdf-hash = { workspace = true }
# The frozen vector format, the deterministic input stream the vectors are
# drawn from, the libtest-compatible `harness = false` runner every target
# below runs on, natively and on wasm32-unknown-unknown alike, and the bench
# harness both benches run on.
purrdf-testkit = { workspace = true }

# Digest throughput at 64 B, 1 KiB and 1 MiB per algorithm and per path the
# host runs, base16 encoding throughput per path, and BLAKE3 one-shot and
# streaming throughput per backend. Report-only.
[[bench]]
name = "digests"
harness = false

[[bench]]
name = "hasher"
harness = false

# The frozen-vector replay of MD5, SHA-1, SHA-3 and CRC-32 over every path the
# host runs. Every target below runs on purrdf_testkit's `harness = false`
# runner, so the same named cases run natively under `cargo test` and on
# wasm32-unknown-unknown in Node under scripts/wasm-test-runner.sh
# (`make wasm-test`).
[[test]]
name = "digest_differential"
harness = false

# Base16 rendering: RFC 4648 vectors and every encoding path against the
# portable one, so `make wasm-test` executes the wasm32 `simd128` kernel as
# well as the portable path.
[[test]]
name = "hex"
harness = false

# The portable table hasher's frozen answers, which wasm32 computes from 32-bit
# halves, and its statistical quality, measured natively.
[[test]]
name = "fixed_hasher"
harness = false

# Streaming tree boundaries replay the same frozen answers on native and wasm.
[[test]]
name = "blake3"
harness = false

# SplitMix64's three streams and FNV-1a over structured corpora: frozen
# answers replayed natively and on wasm32, where the 64-bit multiplies are
# built from 32-bit halves.
[[test]]
name = "splitmix_fnv"
harness = false
