[package]
name = "purrdf-xsd"
description = "Native XSD value space, with no third-party dependency, (parse, value-space equality/ordering, canonical lexical mapping, SPARQL numeric promotion) for the RDF 1.2 query stack — replaces oxsdatatypes"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/purrdf-xsd"
rust-version.workspace = true
keywords = ["xsd", "rdf", "rdf-12", "value-space", "sparql"]
categories = ["parser-implementations", "data-structures"]

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[lib]
# rlib-only foundation whose one runtime dependency is the zero-dependency root
# `purrdf-hash` (layers.toml). It must stay wasm-clean and must not pull any
# oxigraph-family crate (it replaces `oxsdatatypes`). It does NOT depend on
# `purrdf-core` — the dependency points the other way, later.
crate-type = ["rlib"]
path = "src/lib.rs"
name = "purrdf_xsd"

[dependencies]
# The SplitMix64 stream `ieee::reference` draws its deterministic samples from.
purrdf-hash = { workspace = true }

[dev-dependencies]
# Round-trip / canonicalization property tests (lexical -> value -> canonical)
# on the shared property harness. Path-only and unpublished, so it is stripped
# from the packaged manifest.
purrdf-testkit = { workspace = true }

[[bench]]
name = "lexical"
harness = false
