[package]
name = "purrdf-xsd"
description = "Native XSD value space (parse, value-space equality/ordering, canonical lexical mapping, SPARQL numeric promotion) for the RDF 1.2 query stack"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/purrdf-xsd"
rust-version.workspace = true
keywords = ["xsd", "rdf", "rdf-12", "value-space", "sparql"]
categories = ["parser-implementations", "data-structures"]

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[lib]
# rlib-only, and a foundation: its runtime dependencies are the zero-dependency
# root `purrdf-hash` and the lexical layer `purrdf-lex` directly above it. It must
# stay wasm-clean. It does NOT depend on
# `purrdf-core` — the dependency points the other way.
crate-type = ["rlib"]
path = "src/lib.rs"
name = "purrdf_xsd"

[dependencies]
# The base16 codec behind `xsd:hexBinary` (the either-case reader and the
# uppercase canonical writer), and the SplitMix64 stream `ieee::reference`
# draws its deterministic samples from.
purrdf-hash = { workspace = true }
# The byte-run membership test (`scan::in_runs`) the whitespace facets' chunked
# prechecks classify each byte with.
purrdf-lex = { workspace = true }

[dev-dependencies]
# Round-trip / canonicalization property tests (lexical -> value -> canonical)
# on the shared property harness. Path-only and unpublished, so it is stripped
# from the packaged manifest.
purrdf-testkit = { workspace = true }
purrdf-alloc-probe = { workspace = true }

[[bench]]
name = "lexical"
harness = false

[[bench]]
name = "numerical"
harness = false

[[test]]
name = "certified_numerical"
harness = false
