[package]
name = "purrdf-json"
description = "Lossless ordered JSON to RDF 1.2: queryable occurrences over a verified verbatim byte cover"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
homepage.workspace = true
rust-version.workspace = true
documentation = "https://docs.rs/purrdf-json"
keywords = ["json", "rdf", "linked-data", "lossless", "ordered"]
categories = ["encoding", "parser-implementations"]

[lints]
workspace = true

[dependencies]
purrdf-core.workspace = true
# The workspace root: the profile and document identity preimages open under
# registered `purrdf_hash::Domain` constants.
purrdf-hash.workspace = true
# The one JSON string-escape decoder and RFC 6901 token escape every PurRDF JSON
# reader shares.
purrdf-lex.workspace = true

[dev-dependencies]
# The workspace's shared counting allocator, for the `ordered_json_alloc` bench
# probe. Path-only and unpublished, so it is stripped from the packaged manifest;
# std-only and dependency-free, so it is wasm32-clean and needs no target gate.
purrdf-alloc-probe.workspace = true
purrdf-rdf.workspace = true
purrdf-sparql-eval.workspace = true
# The shared test support, and the `harness = false` runner `tests/roundtrip.rs`
# runs on, natively and on wasm32-unknown-unknown alike. Path-only and
# unpublished, so it is stripped from the packaged manifest; wasm32-clean, so it
# needs no target gate.
purrdf-testkit.workspace = true

# The frozen corpus crossed through the production RDF codecs, on every target:
# `harness = false` on the shared runner, so `make wasm-test` runs the same named
# cases in Node through scripts/wasm-test-runner.sh that `cargo test` runs natively.
[[test]]
name = "roundtrip"
harness = false

[[bench]]
name = "ordered_json"
harness = false

[[bench]]
name = "ordered_json_alloc"
harness = false

[[bench]]
name = "ordered_json_corpus"
harness = false
