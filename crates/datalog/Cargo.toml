[package]
name = "purrdf-datalog"
description = "PurRDF native Datalog: deterministic wasm-clean semi-naive evaluation over a columnar relation store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/purrdf-datalog"
rust-version.workspace = true
readme = "README.md"
keywords = ["datalog", "rdf", "reasoning", "fixpoint", "entailment"]
categories = ["algorithms", "data-structures"]

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[lib]
crate-type = ["rlib"]
path = "src/lib.rs"

[dependencies]
# Content addressing for the plan cache: a plan's cache key is a BLAKE3 digest of
# the DL-clause IR. NOT ahash — ahash is explicitly not version-stable, so its
# output cannot address content. Only the sequential `Hasher::update` is used
# (never `update_rayon`), so the workspace's `rayon` feature on blake3 costs this
# crate no thread pool on any target, wasm32 included.
blake3 = { workspace = true }
# The arity-generic binding-pattern adornment lattice (backward magic-sets
# demand keying, forward evaluator query-plan index selection) lives in the
# shared kernel now that a second, non-Datalog consumer needs it too.
purrdf-core = { workspace = true }
# Fixed-key store-once interners and the arrangement's probe tables. Fixed-key
# (not RandomState) because getrandom is absent on wasm32 and because iteration
# order must never reach an output path.
ahash = { workspace = true }
hashbrown = { workspace = true }
# Rule-parallel semi-naive rounds. Used ONLY in indexed, order-stable form
# (`par_iter` over a rule-index slice, collected and reduced in program order);
# never `par_sort`/`par_bridge`. Degrades to inline-sequential on
# wasm32-unknown-unknown, so the wasm gate holds.
rayon = { workspace = true }
# The join's per-solution binding frame. Inline capacity 8 because 8 is the WIDEST
# frame the OWL 2 RL rule table and this workspace's own suites produce (measured,
# not assumed), and `Option<TermId>` is 4 bytes through `Id`'s `NonZeroU32` niche —
# so the whole frame is 32 inline bytes and never reaches the allocator. The same
# crate-local reasoning `purrdf-sparql-eval` applies to its solution rows.
smallvec = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
# Semi-naive join latency along the three axes a join's cost actually has: the
# fan-out of the intermediate relation, the WIDTH of one solution's binding frame
# at a fixed solution count, and the round count of a recursive fixpoint. The
# evaluator previously had no bench of its own — the nearest measured it through a
# regime's rule table. Report-only.
name = "seminaive"
harness = false
