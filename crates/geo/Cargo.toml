[package]
name = "purrdf-geo"
description = "PurRDF GeoSPARQL compatibility facade over shared geometry and evaluator adapters"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/purrdf-geo"
rust-version.workspace = true
keywords = ["geosparql", "rdf", "sparql", "wkt", "geojson"]
categories = ["science::geo", "parser-implementations", "data-structures"]

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[lib]
crate-type = ["rlib"]
path = "src/lib.rs"

[dependencies]
purrdf-geo-kernel = { workspace = true }
purrdf-sparql-eval = { workspace = true }

[dev-dependencies]
purrdf-hash = { workspace = true }
purrdf-core = { workspace = true }
purrdf-sparql-algebra = { workspace = true }
purrdf-rdf = { workspace = true }
purrdf-shapes = { workspace = true }
# The unpublished shared runner is wasm-clean and path-only.
purrdf-testkit = { workspace = true }

# The same corpus runs natively and through the shared wasm harness.
[[test]]
name = "determinism"
harness = false
