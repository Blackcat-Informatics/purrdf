# Inherited material: grants and byte-preserved notice evidence.
# Generated payloads are projections of this ledger and Cargo.lock, never hand edited.

# Exact SPDX offers for separately noticed prose and generated data. Every other
# first-party header must match workspace.package.license. The header gate
# checks these paths and refuses stale or unchecked registrations.
[header_offers]
# The book is prose under the documentation grant.
"docs/book/book.toml" = "CC-BY-4.0"
# Generated Unicode data carries Unicode-3.0 beside the first-party offer.
# Frozen UCD inputs and check-generated.sh establish every listed projection;
# LICENSING.md describes the combined grant.
"crates/lex/src/unicode_tables.rs" = "(MIT OR Apache-2.0 OR MulanPSL-2.0) AND Unicode-3.0"
"crates/iri/src/idna_tables.rs" = "(MIT OR Apache-2.0 OR MulanPSL-2.0) AND Unicode-3.0"
"crates/rdf-core/src/xsd_regex/blocks.rs" = "(MIT OR Apache-2.0 OR MulanPSL-2.0) AND Unicode-3.0"
"crates/rdf-core/src/xsd_regex/xpath/unicode_tables.rs" = "(MIT OR Apache-2.0 OR MulanPSL-2.0) AND Unicode-3.0"
"crates/text/src/unicode_tables.rs" = "(MIT OR Apache-2.0 OR MulanPSL-2.0) AND Unicode-3.0"
"crates/jsonschema/src/ecma/property_tables.rs" = "(MIT OR Apache-2.0 OR MulanPSL-2.0) AND Unicode-3.0"
"crates/jsonschema/src/ecma/unicode_ranges.rs" = "(MIT OR Apache-2.0 OR MulanPSL-2.0) AND Unicode-3.0"
# Verbatim WHATWG data, with frozen notice/input and verified native generation;
# the independently written resolver and generator keep the first-party offer.
"crates/lex/src/html/entities.rs" = "BSD-3-Clause"

