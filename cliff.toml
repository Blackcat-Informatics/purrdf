#
# git-cliff configuration for the PurRDF release changelog.
#
# Deterministic and offline: releases are grouped by the canonical `rust-v*`
# tags, entries come purely from conventional-commit subjects (no GitHub API,
# no author/PR links), and the preprocessors strip every `#NNN` issue/PR token
# so the committed CHANGELOG.md stays clean under the repo's issue-reference
# lint (scripts/check-issue-refs.py, which scans root *.md).
# Exact rendered scope/message pairs are emitted once per release group. Multiple
# implementation commits can legitimately share a conventional subject, but one
# repeated user-facing release-note bullet carries no additional information.
#
# A conventional `type(scope)!:` subject or a `BREAKING CHANGE:` footer renders a
# leading **BREAKING** marker on its bullet. From 1.0.0 a breaking change bumps
# the major version, and the marker still names each one so a consumer reading
# the changelog sees exactly what the bump carries — it must never be silent.
#
# The marker is resolved over the release's WHOLE commit set before any bullet is
# rendered, because the squash merge keeps the branch history as a second parent:
# the squash subject `feat(gts)!: X` and the branch commit `feat(gts): X` reduce
# to the same scope/message pair once the `(#NNN)` is preprocessed away, and the
# dedup above keeps whichever git-cliff sorts first — the NON-breaking one. A
# per-commit `commit.breaking` test on the surviving bullet therefore renders no
# marker at all on exactly the releases that need it most.

[changelog]
header = """
# Changelog

All notable changes to the PurRDF crate suite are recorded here. The suite
ships one lockstep version across crates.io, PyPI, and npm; from 1.0.0 a
breaking change bumps the major version, a minor bump is additive, and a patch
bump is bugfix-only. The C ABI (`purrdf.h`) is versioned separately and remains
0.x.

"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="rust-v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% set_global breaking_keys = [] -%}
{% for commit in commits -%}
{% if commit.breaking -%}
{% set breaking_message = commit.message | split(pat="\n") | first | upper_first | trim -%}
{% set breaking_scope = commit.scope | default(value="") -%}
{% set breaking_key = breaking_scope ~ "::" ~ breaking_message -%}
{% set_global breaking_keys = breaking_keys | concat(with=breaking_key) -%}
{% endif -%}
{% endfor -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}

{% set_global rendered_entries = [] -%}
{% for commit in commits -%}
{% set entry_message = commit.message | split(pat="\n") | first | upper_first | trim -%}
{% set entry_scope = commit.scope | default(value="") -%}
{% set entry_key = entry_scope ~ "::" ~ entry_message -%}
{% if entry_key not in rendered_entries -%}
{% set_global rendered_entries = rendered_entries | concat(with=entry_key) -%}
- {% if entry_key in breaking_keys %}**BREAKING** {% endif %}{% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | upper_first | trim }}
{% endif -%}
{% endfor %}

{% endfor %}
"""
footer = ""
trim = true
postprocessors = [
  # Collapse any run of 3+ blank lines the templating can leave behind.
  { pattern = '\n{3,}', replace = "\n\n" },
]

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false

# Strip issue/PR references before parsing so no `#NNN` reaches the changelog, and
# rewrite the decision core's two superseded fragment spellings to its one published
# name. A commit subject is immutable once pushed, so `scripts/check-doc-claims.py`'s
# stale-name ban — which reads the committed CHANGELOG.md along with the rest of the
# documented surface — has no prose to fix there. Rewriting the name on the way in is the
# only fix that survives `make changelog`, and it is the same shape as the `#NNN` rule
# directly above it: a string that must never reach the changelog, removed once, here.
commit_preprocessors = [
  { pattern = '\((?:closes?|fixes?|resolves?)\s+#\d+\)', replace = "" },
  { pattern = '\s*\(#\d+\)', replace = "" },
  { pattern = '#\d+', replace = "" },
  { pattern = '\(\s*\)', replace = "" },
  { pattern = '\bALCH?OIQ\b', replace = "SHOIQ(D)" },
  { pattern = ' {2,}', replace = " " },
  { pattern = '\s+$', replace = "" },
]

commit_parsers = [
  { message = "^Merge", skip = true },
  { message = "^chore", skip = true },
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactor" },
  { message = "^doc", group = "Documentation" },
  { message = "^test", group = "Testing" },
  { message = "^bench", group = "Benchmarks" },
  { message = "^ci", group = "CI & Build" },
  { message = "^build", group = "CI & Build" },
  { message = ".*", group = "Other" },
]

# A breaking commit is never dropped by a `skip = true` parser: from 1.0.0 a
# breaking change bumps the major version, and the marker must always reach the
# changelog so the bump's cause is named.
protect_breaking_commits = true
filter_commits = false
# Only the canonical crates.io release tags mark releases; the parallel
# `py-v*` / `npm-v*` tags carry the same version and are not release boundaries.
tag_pattern = "rust-v[0-9]*"
topo_order = false
sort_commits = "oldest"
