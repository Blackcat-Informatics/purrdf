name: Segmented storage focused tests

on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - .github/workflows/segmented-storage.yaml
      - crates/rdf-core/src/ir/segmented/**
      - crates/rdf-core/tests/segmented.rs
      - crates/rdf-core/tests/segmented_stack.rs

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: 8
  RUST_TEST_THREADS: 4
  CARGO_TERM_COLOR: always

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: nightly
      - name: Record exact source and compiler
        run: |
          git rev-parse HEAD 'HEAD^{tree}'
          rustc -vV
      - name: Execute dictionary, original ownership and persisted visibility controls
        run: |
          mkdir -p target
          cargo test --locked -p purrdf-core --test segmented -- --list > target/segmented-inventory.txt
          grep -Fq reverse_identifiers_resolve_the_single_stored_term_even_with_one_cache_slot target/segmented-inventory.txt
          cargo test --locked -p purrdf-core --lib ir::segmented::format::tests::
          cargo test --locked -p purrdf-core --lib ir::segmented::build::certification_tests::
          cargo test --locked -p purrdf-core --test segmented
          cargo test --locked -p purrdf-core --test segmented_stack
      - name: Execute public query and native refusal neighbors
        run: |
          cargo test --locked -p purrdf-sparql-eval --test segmented_query -- --exact \
            selective_join_matches_resident_and_actual_peak_stays_below_shared_ledger \
            bounded_virtual_streams_and_empty_graph_declarations_match_resident

  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: nightly
          targets: wasm32-unknown-unknown
      - uses: ./.github/actions/wasm-toolchain
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Record exact source and compiler
        run: |
          git rev-parse HEAD 'HEAD^{tree}'
          rustc -vV
      - name: Verify runner failure and host seal controls
        run: bash scripts/check-wasm-test-runner.sh
      - name: Execute actual portable dictionary and visibility controls
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: ${{ github.workspace }}/scripts/wasm-test-runner.sh
          PURRDF_TEST_REQUIRE_EXACT: 1
        run: |
          cargo test --locked --target wasm32-unknown-unknown -p purrdf-core --test segmented -- --exact \
            reverse_identifiers_resolve_the_single_stored_term_even_with_one_cache_slot \
            byte_packed_dictionaries_round_trip_with_sparse_high_id_reads \
            indexed_reopen_preserves_high_ids_and_bidirectional_batches \
            rdf12_references_empty_graphs_and_streamed_lines_survive \
            cache_eviction_preserves_exact_non_cache_owner_conservation
          cargo test --locked --target wasm32-unknown-unknown -p purrdf-core --test segmented_stack -- --exact \
            persisted_layer_row_orders_disagree_after_shared_identity_translation \
            chronological_view_removes_reinserts_and_preserves_explicit_empty_graphs \
            effective_annotation_classification_uses_original_chronology_and_first_occurrence
