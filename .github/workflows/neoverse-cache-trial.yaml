name: Neoverse cache trial

on:
  push:
    branches: [paudley/1469-qualify-compiled-assembly-cache-reuse]
    paths:
      - .github/workflows/neoverse-cache-trial.yaml
      - .github/neoverse-cache-trial.sh

permissions:
  contents: read
  actions: read

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-11-26
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: "true"
      CARGO_BUILD_FINGERPRINT: content
      MEASURED_SHA: a1b641b51b899ae64afa24fb88a9486dfa22aff0
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Keep the harness outside the measured checkout
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/neoverse-trial/evidence"
          cp .github/neoverse-cache-trial.sh "$RUNNER_TEMP/neoverse-trial/run.sh"
          date +%s%N > "$RUNNER_TEMP/neoverse-trial/evidence/job-start.ns"
          {
            echo "TRIAL=$RUNNER_TEMP/neoverse-trial"
            echo "CARGO_BUILD_BUILD_DIR=$GITHUB_WORKSPACE/target"
          } >> "$GITHUB_ENV"
      - name: Checkout the measured source at the same path for every arm
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.MEASURED_SHA }}
          persist-credentials: false
      - name: Install and identify the compiler and cross toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target aarch64-unknown-linux-gnu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm gcc-aarch64-linux-gnu libc6-dev-arm64-cross zstd
          bash "$TRIAL/run.sh" prepare
      - name: Admit the original baseline and retrieve its exact compiled seed
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash "$TRIAL/run.sh" download
      - name: Restore the compiled seed and run the unchanged and edited arms
        run: |
          set -euo pipefail
          bash "$TRIAL/run.sh" restore
          bash "$TRIAL/run.sh" compiled
          bash "$TRIAL/run.sh" edited
      - name: Record the final runner and trial time
        if: always()
        run: |
          set -euo pipefail
          if [[ -d "${TRIAL:-}" ]]; then
            date +%s%N > "$TRIAL/evidence/job-end.ns"
            df -B1 "$GITHUB_WORKSPACE" "$RUNNER_TEMP" > "$TRIAL/evidence/disk-final.txt"
          fi
      - name: Retain the paired measurements and any refusal evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: neoverse-trial-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/neoverse-trial/evidence
          retention-days: 7
          if-no-files-found: error
