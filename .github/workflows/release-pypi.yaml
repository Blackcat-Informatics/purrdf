name: Publish coordinated PurRDF Python distributions

# Publish the Python ``purrdf`` package via PyPI trusted publishing (OIDC).
# Required publisher configuration (separate entries for both projects):
#   Projects: purrdf and purrdf-rdflib (configure one publisher per project)
#   Publisher: GitHub
#   Repository: Blackcat-Informatics/purrdf
#   Workflow: release-pypi.yaml
#   Environment: none

permissions: {}

concurrency:
  # Rehearsals and rejected recovery requests cannot replace a pending publish.
  group: >-
    python-release-${{ github.event_name == 'workflow_dispatch' &&
      (inputs.publish && (!inputs.recover ||
        (github.repository == 'Blackcat-Informatics/purrdf' &&
         github.ref == 'refs/heads/main' && github.ref_protected)) &&
       'py-v5.0.1' || 'rehearsal-py-v5.0.1') || github.ref_name }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      recover:
        description: Reuse the retained qualification for 5.0.1 without rebuilding
        type: boolean
        default: false
      publish:
        description: Publish missing wheels for the existing 5.0.1 release
        type: boolean
        default: false
  push:
    tags:
      - "py-v*"

jobs:
  qualify:
    if: github.event_name != 'workflow_dispatch' || !inputs.recover
    uses: ./.github/workflows/qualify-python-release.yaml
    permissions:
      contents: read
      actions: write
      id-token: write
      attestations: write

  publish-main:
    needs: qualify
    if: github.event_name == 'push' || (inputs.publish && !inputs.recover)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      actions: read
      attestations: read
    env:
      RELEASE_VERSION: ${{ needs.qualify.outputs.version }}
      RELEASE_TAG: ${{ needs.qualify.outputs.release_tag }}
      RELEASE_SHA: ${{ needs.qualify.outputs.release_sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          architecture: x64
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: false
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: dist-pypi-native-release
          path: release-dist
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: dist-pypi-shadow-release
          path: release-shadow
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: evidence-pypi-release
          path: evidence
      - name: Recheck assembled native files and source evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify evidence/release-source.json --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/qualify-python-release.yaml" \
            --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA"
          jq -e --arg tag "$RELEASE_TAG" --arg sha "$RELEASE_SHA" \
            --rawfile checksums evidence/release.sha256 \
            '.tag == $tag and .commit == $sha and .checksums == $checksums' evidence/release-source.json
          sha256sum --strict --check evidence/release.sha256
      - name: Publish the main distribution with Trusted Publishing and attestations
        run: |
          publisher_env="$(mktemp -d "$RUNNER_TEMP/purrdf-python-publisher.XXXXXX")"
          uv venv --python 3.13 "$publisher_env"
          uv pip sync --python "$publisher_env/bin/python" --require-hashes --only-binary :all: \
            scripts/python-publisher-requirements.txt
          bash scripts/publish-python-release.sh purrdf "$RELEASE_VERSION" release-dist \
            "$publisher_env/bin/python"

  publish-shadow:
    needs: [qualify, publish-main]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      actions: read
      attestations: read
    env:
      RELEASE_VERSION: ${{ needs.qualify.outputs.version }}
      RELEASE_TAG: ${{ needs.qualify.outputs.release_tag }}
      RELEASE_SHA: ${{ needs.qualify.outputs.release_sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          architecture: x64
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: false
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: dist-pypi-shadow-release
          path: release-shadow
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: evidence-pypi-release
          path: evidence
      - name: Recheck assembled shadow files and source evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify evidence/release-source.json --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/qualify-python-release.yaml" \
            --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA"
          jq -e --arg tag "$RELEASE_TAG" --arg sha "$RELEASE_SHA" \
            --rawfile checksums evidence/release.sha256 \
            '.tag == $tag and .commit == $sha and .checksums == $checksums' evidence/release-source.json
          sed -n '/  release-shadow\//p' evidence/release.sha256 > expected.sha256
          sha256sum --strict --check expected.sha256
      - name: Publish the rdflib shadow with Trusted Publishing and attestations
        run: |
          publisher_env="$(mktemp -d "$RUNNER_TEMP/purrdf-python-publisher.XXXXXX")"
          uv venv --python 3.13 "$publisher_env"
          uv pip sync --python "$publisher_env/bin/python" --require-hashes --only-binary :all: \
            scripts/python-publisher-requirements.txt
          bash scripts/publish-python-release.sh purrdf-rdflib "$RELEASE_VERSION" release-shadow \
            "$publisher_env/bin/python"

  recover-preflight:
    # An invalid publish request also fails here, without signing permissions.
    if: github.event_name == 'workflow_dispatch' && inputs.recover && (!inputs.publish || github.repository != 'Blackcat-Informatics/purrdf' || github.ref != 'refs/heads/main' || !github.ref_protected)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      attestations: read
    steps:
      - name: Require protected main
        run: |
          if [[ "$GITHUB_REPOSITORY" != Blackcat-Informatics/purrdf ||
                "$GITHUB_REF" != refs/heads/main || "$GITHUB_REF_PROTECTED" != true ]]; then
            echo '::error::Recovery requires a dispatch from protected main'
            exit 1
          fi
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/recover-python-release

  publish-recovered-native:
    if: github.event_name == 'workflow_dispatch' && inputs.recover && inputs.publish && github.repository == 'Blackcat-Informatics/purrdf' && github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      attestations: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/recover-python-release
      - name: Publish only missing native wheels with Trusted Publishing
        run: |
          bash scripts/publish-python-release.sh purrdf 5.0.1 \
            "$RUNNER_TEMP/purrdf-recovered/release-dist" "$PURRDF_RECOVERY_PYTHON"
