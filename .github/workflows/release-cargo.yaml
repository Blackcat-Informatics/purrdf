name: Release Cargo purrdf workspace

# On a rust-v* tag, verify, package, attest, and publish the purrdf workspace
# crates to crates.io via crates.io Trusted Publishing (GitHub Actions OIDC).
# Requires one Trusted Publisher entry on crates.io for each published crate:
#   Publisher: GitHub Actions
#   Owner: Blackcat-Informatics
#   Repo: purrdf
#   Workflow: release-cargo.yaml
#   Environment: (none)

on:
  push:
    tags:
      - 'rust-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Rust release tag
        required: true
        type: string
      source_run:
        description: Original tagged Cargo workflow run ID
        required: true
        type: string
      toolchain:
        description: Stable Rust version used by the original run
        required: true
        type: string

concurrency:
  group: release-cargo-${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# Release artifacts are built on STABLE, not on the nightly channel that
# `rust-toolchain.toml` pins for development and CI gates. This env var is load
# bearing: the `dtolnay/rust-toolchain` action selects with `rustup default`,
# which ranks BELOW `rust-toolchain.toml` in rustup's precedence order, so
# without `RUSTUP_TOOLCHAIN` every cargo invocation here would silently use the
# nightly channel no matter what the install step says.
env:
  RUSTUP_TOOLCHAIN: stable
  # The publication wait checks this exact registry transport before dependents.
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  source:
    name: Resolve release source
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      sha: ${{ steps.source.outputs.sha }}
      artifact_run: ${{ steps.source.outputs.artifact_run }}
      toolchain: ${{ steps.source.outputs.toolchain }}
    steps:
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        if: github.event_name == 'push'
        with:
          toolchain: stable
      - name: Verify release source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          ARTIFACT_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run || github.run_id }}
          TOOLCHAIN: ${{ github.event_name == 'workflow_dispatch' && inputs.toolchain || 'stable' }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^rust-v[0-9]+\.[0-9]+\.[0-9]+$ || ! "$ARTIFACT_RUN" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Supply a rust-v release tag and an Actions run ID."
            exit 1
          fi
          release_sha=$GITHUB_SHA
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            if [[ ! "$TOOLCHAIN" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Supply the exact stable Rust version from the tagged run."
              exit 1
            fi
            release_sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN" |
              jq -er --arg tag "$TAG" --arg repo "$GITHUB_REPOSITORY" '
                select(.event == "push" and .head_branch == $tag and .status == "completed"
                  and (.conclusion == "cancelled" or .conclusion == "failure")
                  and .path == ".github/workflows/release-cargo.yaml"
                  and .head_repository.full_name == $repo) | .head_sha')
            [[ "$release_sha" =~ ^[a-f0-9]{40}$ ]]
            gh api "repos/$GITHUB_REPOSITORY/compare/$release_sha...$GITHUB_SHA" |
              jq -e --arg sha "$release_sha" '.merge_base_commit.sha == $sha'
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN/jobs?per_page=100" |
              jq -e '
                [.[].jobs[]] as $jobs |
                def passed($name): any($jobs[]; .name == $name and .conclusion == "success");
                (passed("Verify native workspace") and passed("Verify WebAssembly") and
                 passed("Prepare audited artifacts")) or
                any($jobs[]; .name == "publish" and
                  any(.steps[]; .name == "Authenticate to crates.io (trusted publishing / OIDC)"
                    and .conclusion == "success"))'
          else
            TOOLCHAIN=$(rustc -Vv | awk '$1 == "release:" {print $2}')
          fi
          ref="refs/tags/$TAG"
          refs=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "$ref" "$ref^{}")
          remote_sha=$(awk -v ref="$ref" '$2 == ref {direct=$1} $2 == ref "^{}" {peeled=$1}
            END {print peeled ? peeled : direct}' <<< "$refs")
          if [[ ! "$release_sha" =~ ^[a-f0-9]{40}$ || "$remote_sha" != "$release_sha" ||
            ! "$TOOLCHAIN" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The release tag differs from the tagged workflow source."
            exit 1
          fi
          printf 'tag=%s\nsha=%s\nartifact_run=%s\ntoolchain=%s\n' \
            "$TAG" "$release_sha" "$ARTIFACT_RUN" "$TOOLCHAIN" >> "$GITHUB_OUTPUT"

  native:
    name: Verify native workspace
    if: github.event_name == 'push'
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: ${{ needs.source.outputs.toolchain }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      # Compile and restore cache entries with this run's exact stable version.
      - name: Install resolved stable Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt
      - name: Cache native compilation
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: cargo-release-native

      - name: Verify tag matches workspace crate versions
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys

          expected = os.environ["GITHUB_REF_NAME"].removeprefix("rust-v")
          metadata = json.loads(
              subprocess.check_output(
                  ["cargo", "metadata", "--no-deps", "--format-version", "1"],
                  text=True,
              )
          )
          mismatches = []
          for package in metadata["packages"]:
              if package["version"] != expected:
                  mismatches.append(
                      f'{package["name"]}: {package["version"]} != {expected}'
                  )
          if mismatches:
              print("Tag version does not match every workspace crate:", file=sys.stderr)
              print("\n".join(mismatches), file=sys.stderr)
              sys.exit(1)
          PY

      - name: Validate reviewed GitHub Release summary before publication
        env:
          VERSION: ${{ github.ref_name }}
        run: python3 scripts/check-release-notes.py --version "${VERSION#rust-v}"

      - name: Verify workspace
        run: |
          cargo fmt --all --check
          cargo check --workspace --lib --tests --locked
          cargo run -q --locked -p helper-census -- --no-features
          bash scripts/check-generated.sh
          make check-sssom-corpus
          # Release-coherence gate at the point of no return: the tag-verify step
          # above checks each crate's OWN version, but not its internal dependency
          # requirements. This catches a partial bump (a stale ^x.y.z internal pin)
          # before any crate is irreversibly published.
          python3 scripts/check-versions.py
          # The publish order is re-proved at the point of no return: the set is
          # exactly the publishable members, and the order is a topological
          # order of normal AND dev-dependencies — the second being what lets
          # the publish loop below VERIFY each crate against the registry.
          python3 scripts/check-publish-order.py
          cargo test -p purrdf-gts --test transport --locked
          cargo test -p purrdf-slice --locked

  wasm:
    name: Verify WebAssembly
    if: github.event_name == 'push'
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: ${{ needs.source.outputs.toolchain }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install resolved stable Rust and WebAssembly target
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown
      - name: Cache WebAssembly compilation
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: cargo-release-wasm
      - name: Verify release crates on WebAssembly
        run: |
          # The wasm gate covers exactly the crates that get published — read
          # from the one release-set definition rather than a second copy.
          # shellcheck source=scripts/release-crates.sh
          source scripts/release-crates.sh
          wasm_args=()
          for crate in "${PURRDF_RELEASE_CRATES[@]}"; do
            wasm_args+=("-p" "$crate")
          done
          cargo check --locked --target wasm32-unknown-unknown --lib "${wasm_args[@]}"
          cargo build --locked --release --target wasm32-unknown-unknown \
            -p purrdf-wasm --lib
          test -s target/wasm32-unknown-unknown/release/purrdf_wasm.wasm

  prepare:
    name: Prepare audited artifacts
    if: github.event_name == 'push'
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RUSTUP_TOOLCHAIN: ${{ needs.source.outputs.toolchain }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install resolved stable Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Package release crates
        run: &package-release |
          set -euo pipefail

          # `--no-verify` is LOAD-BEARING here and only here: every crate is
          # packaged before ANY is published, so a verification build of crate N
          # would have to resolve crate N-1 at this version from crates.io, where
          # it does not exist yet. The `.crate` files are produced now so that a
          # packaging failure surfaces before the first irreversible upload.
          # cargo package --workspace also packages publish=false members;
          # several host-only helpers intentionally have path-only dependencies.
          # Package the exact release set, not the development workspace.
          source scripts/release-crates.sh
          package_args=()
          for crate in "${PURRDF_RELEASE_CRATES[@]}"; do
            package_args+=("-p" "$crate")
          done
          cargo package --locked --no-verify "${package_args[@]}"

      - name: Audit actual crate archives
        run: |
          python3 scripts/fetch-locked-deps.py
          python3 scripts/package-licenses.py --check
          python3 scripts/package-licenses.py --audit target/package/*.crate --require-cargo-set --receipt target/license-evidence-cargo.json

      - name: Build C distribution through the pinned cargo-c
        run: |
          cargo install cargo-c --version 0.10.23 --locked
          make capi-bundle
          python3 scripts/package-text-lexicons.py
          make w3c-earl W3C_EARL_DIR=target/dist

      - name: Build and audit the exact tagged source archive
        env:
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
          RELEASE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          version=${RELEASE_TAG#rust-v}
          bash scripts/package-release-source.sh build "$RELEASE_SHA" "$version" target/dist
          python3 scripts/check-release-notes.py --version "$version" --checksum-output target/dist/SHA256SUMS

      - name: Attest build provenance for release assets and the source license receipt
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            target/dist/purrdf-capi-*.tar.gz
            target/dist/purrdf-text-lexicons-*.tar.gz
            target/dist/purrdf-source-*.tar.gz
            target/dist/purrdf-source-*.license-receipt.json
            target/dist/purrdf-shacl-earl.ttl
            target/dist/purrdf-shacl12-earl.ttl

      - name: Upload artifact license evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: license-evidence-cargo-c
          if-no-files-found: error
          overwrite: true
          path: |
            target/license-evidence-cargo.json
            target/dist/purrdf-capi-*.tar.gz
            target/dist/purrdf-text-lexicons-*.tar.gz
            target/dist/purrdf-source-*.tar.gz
            target/dist/*.license-receipt.json
            target/dist/SHA256SUMS
            target/dist/purrdf-shacl-earl.ttl
            target/dist/purrdf-shacl12-earl.ttl

      - name: Attest build provenance for crates
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: target/package/*.crate

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: sbom-purrdf-crates.spdx.json
          upload-artifact: false

      - name: Attest SBOM for crates
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: target/package/*.crate
          sbom-path: sbom-purrdf-crates.spdx.json

      - name: Attest SBOM for C distribution
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: target/dist/purrdf-capi-*.tar.gz
          sbom-path: sbom-purrdf-crates.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-purrdf-crates
          path: sbom-purrdf-crates.spdx.json
          if-no-files-found: error
          overwrite: true

  publish:
    name: Publish audited release
    needs: [source, native, wasm, prepare]
    if: >-
      !cancelled() && needs.source.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
       (needs.native.result == 'success' && needs.wasm.result == 'success' &&
        needs.prepare.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      attestations: read
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.source.outputs.tag }}
      RELEASE_SHA: ${{ needs.source.outputs.sha }}
      RUSTUP_TOOLCHAIN: ${{ needs.source.outputs.toolchain }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ needs.source.outputs.sha }}
      - name: Install resolved stable Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Download and verify the audited distribution
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN: ${{ needs.source.outputs.artifact_run }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          metadata=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN/artifacts?name=license-evidence-cargo-c" |
            jq -er --arg run "$ARTIFACT_RUN" --arg tag "$RELEASE_TAG" --arg sha "$RELEASE_SHA" '
              [.artifacts[] | select(.expired == false and .name == "license-evidence-cargo-c"
                and (.workflow_run.id | tostring) == $run and .workflow_run.head_branch == $tag
                and .workflow_run.head_sha == $sha)] |
              if length == 1 then .[0] else error("Expected one audited release artifact") end |
              [.id, .digest] | @tsv')
          IFS=$'\t' read -r artifact_id digest <<< "$metadata"
          [[ "$artifact_id" =~ ^[1-9][0-9]*$ && "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          archive="$RUNNER_TEMP/audited-release.zip"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$archive"
          printf '%s  %s\n' "${digest#sha256:}" "$archive" | sha256sum --strict --check -

          version=${RELEASE_TAG#rust-v}
          sdk="dist/purrdf-capi-$version-x86_64-unknown-linux-gnu"
          lexicons="dist/purrdf-text-lexicons-$version.tar.gz"
          earl=(dist/purrdf-shacl-earl.ttl dist/purrdf-shacl12-earl.ttl)
          # Recovery consumes the exact bundle format used by the tagged workflow.
          source_assets=()
          if [[ -f scripts/package-release-source.sh ]]; then
            source_assets=("dist/purrdf-source-$version.tar.gz" "dist/purrdf-source-$version.license-receipt.json")
          fi
          members=(license-evidence-cargo.json dist/SHA256SUMS "$sdk.license-receipt.json"
            "$sdk.tar.gz" "$lexicons" "${earl[@]}" "${source_assets[@]}")
          actual=$(unzip -Z1 "$archive" | LC_ALL=C sort)
          expected=$(printf '%s\n' "${members[@]}" | LC_ALL=C sort)
          test "$actual" = "$expected"
          unzip -q "$archive" -d target
          python3 scripts/check-release-notes.py --version "$version" \
            --checksum-output "$RUNNER_TEMP/release-checksums"
          cmp target/dist/SHA256SUMS "$RUNNER_TEMP/release-checksums"
          for asset in "$sdk.tar.gz" "$lexicons" "${earl[@]}" "${source_assets[@]}"; do
            gh attestation verify "target/$asset" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-cargo.yaml" \
              --source-ref "refs/tags/$RELEASE_TAG" --source-digest "$RELEASE_SHA"
          done
          if [[ ${#source_assets[@]} -ne 0 ]]; then
            bash scripts/package-release-source.sh verify "$RELEASE_SHA" "$version" target/dist
          fi

      - name: Package release crates from the tagged source
        run: *package-release

      - name: Match crate archives to the retained audit
        run: |
          set -euo pipefail
          source scripts/release-crates.sh
          receipt=target/license-evidence-cargo.json
          expected=$(printf '%s\n' "${PURRDF_RELEASE_CRATES[@]}" | LC_ALL=C sort)
          actual=$(jq -er '.artifacts[].profile' "$receipt" | LC_ALL=C sort)
          test "$actual" = "$expected"
          jq -er --arg version "${RELEASE_TAG#rust-v}" '
            if .schema == 1 and all(.artifacts[];
              .status == "passed" and (.sha256 | test("^[a-f0-9]{64}$")) and
              .artifact == (.profile + "-" + $version + ".crate"))
            then .artifacts[] | "\(.sha256)  target/package/\(.artifact)"
            else error("The retained crate audit is invalid")
            end' "$receipt" | sha256sum --strict --check -

      - name: Confirm release crate publishing locks
        env:
          PURRDF_RELEASE_VERSION: ${{ needs.source.outputs.tag }}
        run: bash scripts/check-crates-io-records.sh --require-all

      - name: Verify already published crates against the retained audit
        env:
          ALLOW_MISSING: 'true'
        run: &verify-registry |
          set -euo pipefail
          source scripts/crates-io-api.sh
          trap 'rm -- "$CRATES_IO_BODY"' EXIT
          version=${RELEASE_TAG#rust-v}
          agent=$(crates_io_user_agent "$version")
          jq -er '.artifacts[] | [.profile, .sha256] | @tsv' target/license-evidence-cargo.json |
            while IFS=$'\t' read -r crate checksum; do
              state=$(crates_io_index_state "$crate" "$version" "$checksum" "$agent")
              case "$state" in
                present) ;;
                missing)
                  if [[ "${ALLOW_MISSING:-false}" != true ]]; then
                    echo "::error::$crate $version is missing from the sparse index."
                    exit 1
                  fi
                  ;;
                *) echo "::error::$state"; exit 1 ;;
              esac
            done

      - name: Recheck the remote tag before issuing a publication token
        run: |
          set -euo pipefail
          ref="refs/tags/$RELEASE_TAG"
          refs=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "$ref" "$ref^{}")
          resolved=$(awk -v ref="$ref" '$2 == ref {direct=$1} $2 == ref "^{}" {peeled=$1}
            END {print peeled ? peeled : direct}' <<< "$refs")
          test "$resolved" = "$RELEASE_SHA"

      - name: Authenticate to crates.io (trusted publishing / OIDC)
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      # The loop lives in scripts/publish-release-crates.sh so the one piece of
      # logic that decides what is published can be dry-run and self-tested
      # locally against a mock registry. Every record and its publishing lock
      # must exist before this lane starts. Per crate, in publish order:
      # already published -> wait for its index entry, then skip (re-runs resume);
      # otherwise cargo publish --locked, VERIFIED, then wait until both the
      # crates.io API and Cargo sparse index serve the exact unyanked version.
      #
      # Verification resolves the packaged crate's whole graph, dev-dependencies
      # included, which is resolvable because every packaged dependency is
      # already served at the functional version by an earlier upload.
      # This loop used to pass `--no-verify`, load-bearing until `purrdf-geo`
      # (dev-depending on two later crates) was reordered — see docs/RELEASE.md,
      # "Verification is on, and why it was off".
      #
      # Failure mode, stated honestly: the OIDC token above is scoped to the
      # crates whose Trusted Publisher entries matched this workflow. A crate
      # with no entry — including a record the token step created whose entry
      # was not added before this run was re-run — fails AT its own `cargo
      # publish` ("The provided access token is not valid for crate `<name>`"),
      # after every crate ahead of it has been published: a loud stop under
      # `set -e`, with a partial publish that re-running this run resumes. The
      # preflight cannot see entries (crates.io has no public API for them); its
      # lock check proves token publishing is disabled, independently of whether
      # a matching publisher entry exists. Both settings must be configured.
      #
      # Re-run only the failed jobs to reuse successful preparation. A
      # dispatch from main can also resume a completed run's audited tag.
      - name: Publish workspace crates to crates.io
        id: publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          # One definition of the release set, sourced by the script:
          # scripts/release-crates.sh (see also the wasm gate above).
          bash scripts/publish-release-crates.sh "${RELEASE_TAG#rust-v}"

      - name: Require complete crates.io publication before creating the release
        if: steps.publish.outputs.complete != 'true'
        run: |
          echo "::error::The publisher did not confirm the complete release set. No GitHub Release will be created; inspect the publication and registry preflight results before rerunning."
          exit 1

      - name: Verify the full registry release against the retained audit
        run: *verify-registry

      - name: Verify draft assets, then publish the immutable GitHub Release
        if: steps.publish.outputs.complete == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Publishing locks assets. The helper creates/reuses a draft, uploads
          # the complete tagged asset set, verifies it by download, then publishes.
          # Existing immutable releases are verified read-only against their
          # retained checksums, without comparing a different rebuild.
          python3 scripts/publish-github-release.py --version "${RELEASE_TAG#rust-v}" \
            --repository "$GITHUB_REPOSITORY" --sha "$RELEASE_SHA"
