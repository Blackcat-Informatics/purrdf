name: Release Cargo purrdf workspace

# On a rust-v* tag, verify, package, attest, and publish the purrdf workspace
# crates to crates.io via crates.io Trusted Publishing (GitHub Actions OIDC).
# Requires one Trusted Publisher entry on crates.io for each published crate:
#   Publisher: GitHub Actions
#   Owner: Blackcat-Informatics
#   Repo: purrdf
#   Workflow: release-cargo.yaml
#   Environment: (none)

on:
  push:
    tags:
      - 'rust-v*'

concurrency:
  group: release-cargo-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# Release artifacts are built on STABLE, not on the nightly channel that
# `rust-toolchain.toml` pins for development and CI gates. This env var is load
# bearing: the `dtolnay/rust-toolchain` action selects with `rustup default`,
# which ranks BELOW `rust-toolchain.toml` in rustup's precedence order, so
# without `RUSTUP_TOOLCHAIN` every cargo invocation here would silently use the
# nightly channel no matter what the install step says.
env:
  RUSTUP_TOOLCHAIN: stable

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Nightly is named in rust-toolchain.toml for its sharper lint surface;
      # that buys nothing for an artifact a consumer installs, and shipping one
      # compiled by an unreleased compiler is risk without upside. The workspace
      # uses no nightly features (the `msrv` CI job holds that floor at 1.98),
      # so stable always builds. See the workflow-level `env` above for why
      # RUSTUP_TOOLCHAIN, not this input, is what actually selects stable.
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Verify tag matches workspace crate versions
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys

          expected = os.environ["GITHUB_REF_NAME"].removeprefix("rust-v")
          metadata = json.loads(
              subprocess.check_output(
                  ["cargo", "metadata", "--no-deps", "--format-version", "1"],
                  text=True,
              )
          )
          mismatches = []
          for package in metadata["packages"]:
              if package["version"] != expected:
                  mismatches.append(
                      f'{package["name"]}: {package["version"]} != {expected}'
                  )
          if mismatches:
              print("Tag version does not match every workspace crate:", file=sys.stderr)
              print("\n".join(mismatches), file=sys.stderr)
              sys.exit(1)
          PY

      - name: Prepare reviewed GitHub Release summary before publication
        env:
          VERSION: ${{ github.ref_name }}
        run: python3 scripts/check-release-notes.py --version "${VERSION#rust-v}" --output target/release-notes.md

      # THE POINT OF NO RETURN IS THE PUBLISH LOOP, AND IT IS NOT ATOMIC.
      # `cargo publish` runs once per crate, in dependency order, and cannot be undone.
      # Every record must exist and be locked before the first irreversible
      # functional upload. Isolated empty 0.0.0 packages create new records in
      # advance; their Trusted Publisher entries are configured by the maintainer.
      # Public trustpub_only proves the lock, not publisher-entry configuration.
      - name: Preflight — every release crate already has a record locked to this lane
        env:
          PURRDF_RELEASE_VERSION: ${{ github.ref_name }}
        run: bash scripts/check-crates-io-records.sh --require-all

      - name: Verify workspace
        run: |
          cargo fmt --all --check
          cargo check --workspace --lib --tests --locked
          python3 scripts/check-no-features.py
          bash scripts/check-generated.sh
          # Release-coherence gate at the point of no return: the tag-verify step
          # above checks each crate's OWN version, but not its internal dependency
          # requirements. This catches a partial bump (a stale ^x.y.z internal pin)
          # before any crate is irreversibly published.
          python3 scripts/check-versions.py
          # The publish order is re-proved at the point of no return: the set is
          # exactly the publishable members, and the order is a topological
          # order of normal AND dev-dependencies — the second being what lets
          # the publish loop below VERIFY each crate against the registry.
          python3 scripts/check-publish-order.py
          # The wasm gate covers exactly the crates that get published — read
          # from the one release-set definition rather than a second copy.
          # shellcheck source=scripts/release-crates.sh
          source scripts/release-crates.sh
          wasm_args=()
          for crate in "${PURRDF_RELEASE_CRATES[@]}"; do
            wasm_args+=("-p" "$crate")
          done
          cargo check --locked --target wasm32-unknown-unknown --lib "${wasm_args[@]}"
          cargo build --locked --release --target wasm32-unknown-unknown \
            -p purrdf-wasm --lib
          test -s target/wasm32-unknown-unknown/release/purrdf_wasm.wasm
          cargo test -p purrdf-gts --test transport --locked
          cargo test -p purrdf-slice --locked

      - name: Package release crates
        run: |
          set -euo pipefail

          rm -rf target/package
          # `--no-verify` is LOAD-BEARING here and only here: every crate is
          # packaged before ANY is published, so a verification build of crate N
          # would have to resolve crate N-1 at this version from crates.io, where
          # it does not exist yet. The `.crate` files are produced now so that a
          # packaging failure surfaces before the first irreversible upload.
          # cargo package --workspace also packages publish=false members;
          # several host-only helpers intentionally have path-only dependencies.
          # Package the exact release set, not the development workspace.
          source scripts/release-crates.sh
          package_args=()
          for crate in "${PURRDF_RELEASE_CRATES[@]}"; do
            package_args+=("-p" "$crate")
          done
          cargo package --locked --no-verify "${package_args[@]}"

      - name: Audit actual crate archives
        run: |
          python3 scripts/fetch-locked-deps.py
          python3 scripts/package-licenses.py --check
          python3 scripts/package-licenses.py --audit target/package/*.crate --require-cargo-set --receipt target/license-evidence-cargo.json

      - name: Build C distribution through the pinned cargo-c
        run: |
          cargo install cargo-c --version 0.10.23 --locked
          make capi-bundle
          python3 scripts/check-release-notes.py --checksum-output target/dist/SHA256SUMS

      - name: Attest build provenance for C distribution
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: target/dist/purrdf-capi-*.tar.gz

      - name: Upload artifact license evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: license-evidence-cargo-c
          path: |
            target/license-evidence-cargo.json
            target/dist/*.license-receipt.json
            target/dist/SHA256SUMS

      - name: Attest build provenance for crates
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: target/package/*.crate

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: sbom-purrdf-crates.spdx.json
          upload-artifact: false

      - name: Attest SBOM for crates
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: target/package/*.crate
          sbom-path: sbom-purrdf-crates.spdx.json

      - name: Attest SBOM for C distribution
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: target/dist/purrdf-capi-*.tar.gz
          sbom-path: sbom-purrdf-crates.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-purrdf-crates
          path: sbom-purrdf-crates.spdx.json

      - name: Authenticate to crates.io (trusted publishing / OIDC)
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      # The loop lives in scripts/publish-release-crates.sh so the one piece of
      # logic that decides what is published can be dry-run and self-tested
      # locally against a mock registry. Every record and its publishing lock
      # must exist before this lane starts. Per crate, in publish order:
      # already published -> skip (re-runs resume); otherwise cargo publish
      # --locked, VERIFIED, then wait until crates.io serves the version.
      #
      # Verification resolves the packaged crate's whole graph, dev-dependencies
      # included, which is resolvable because every packaged dependency is
      # already served at the functional version by an earlier upload.
      # This loop used to pass `--no-verify`, load-bearing until `purrdf-geo`
      # (dev-depending on two later crates) was reordered — see docs/RELEASE.md,
      # "Verification is on, and why it was off".
      #
      # Failure mode, stated honestly: the OIDC token above is scoped to the
      # crates whose Trusted Publisher entries matched this workflow. A crate
      # with no entry — including a record the token step created whose entry
      # was not added before this run was re-run — fails AT its own `cargo
      # publish` ("The provided access token is not valid for crate `<name>`"),
      # after every crate ahead of it has been published: a loud stop under
      # `set -e`, with a partial publish that re-running this run resumes. The
      # preflight cannot see entries (crates.io has no public API for them); its
      # lock check proves token publishing is disabled, independently of whether
      # a matching publisher entry exists. Both settings must be configured.
      #
      # Re-running: this workflow is tag-triggered only, so a stopped run is
      # resumed with `gh run rerun <run-id>` (same tag, same SHA, same workflow
      # file), not by re-pushing the tag.
      - name: Publish workspace crates to crates.io
        id: publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # One definition of the release set, sourced by the script:
          # scripts/release-crates.sh (see also the wasm gate above).
          bash scripts/publish-release-crates.sh "${VERSION#rust-v}"

      - name: Require complete crates.io publication before creating the release
        if: steps.publish.outputs.complete != 'true'
        run: |
          echo "::error::The publisher did not confirm the complete release set. No GitHub Release will be created; inspect the publication and registry preflight results before rerunning."
          exit 1

      - name: Publish GitHub Release with reviewed summary
        if: steps.publish.outputs.complete == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          version="${VERSION#rust-v}"
          python3 scripts/check-release-notes.py --version "$version" --output target/release-notes.md

          # Rerun-safe: create the release once, update its notes on re-runs.
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" --title "PurRDF ${version}" --notes-file target/release-notes.md
          else
            gh release create "$VERSION" --verify-tag --title "PurRDF ${version}" --notes-file target/release-notes.md
          fi

      - name: Attach the C bundle and artifact license evidence to the GitHub release
        if: steps.publish.outputs.complete == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${VERSION#rust-v}"
          sdk="target/dist/purrdf-capi-${version}-x86_64-unknown-linux-gnu"
          python3 scripts/check-release-notes.py --version "$version" --checksum-output target/dist/SHA256SUMS
          gh release upload "$VERSION" "${sdk}.tar.gz" "${sdk}.license-receipt.json" target/license-evidence-cargo.json target/dist/SHA256SUMS --clobber
