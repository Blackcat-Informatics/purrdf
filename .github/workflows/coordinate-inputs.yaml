name: Coordinate input focused tests

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
    paths:
      - .github/workflows/coordinate-inputs.yaml
      - Cargo.toml
      - Cargo.lock
      - crates/sparql-eval/Cargo.toml
      - crates/sparql-eval/src/**
      - crates/sparql-eval/tests/query_coordinates.rs
      - crates/shapes/Cargo.toml
      - crates/shapes/src/**
      - crates/shapes/tests/rule_coordinates.rs
      - crates/xsd/Cargo.toml
      - crates/xsd/src/**
      - crates/xsd/tests/exact_governance.rs
      - scripts/wasm-test-runner.sh
      - scripts/check-wasm-test-runner.sh
      - .github/actions/wasm-toolchain/**

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: 8
  RUST_TEST_THREADS: 4
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: Native ${{ matrix.target }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.target }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: purrdf-xsd
            target: exact_governance
          - package: purrdf-sparql-eval
            target: query_coordinates
          - package: purrdf-shapes
            target: rule_coordinates
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: nightly
      - name: Capture source and compiler
        run: |
          git rev-parse HEAD 'HEAD^{tree}'
          rustc -vV
          cargo -vV
      - name: Execute the public integration target
        env:
          PURRDF_COORDINATE_PACKAGE: ${{ matrix.package }}
          PURRDF_COORDINATE_TARGET: ${{ matrix.target }}
        run: cargo test --locked -p "$PURRDF_COORDINATE_PACKAGE" --test "$PURRDF_COORDINATE_TARGET"

  wasm:
    name: WASM coordinate ownership and host isolation
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-wasm
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: nightly
          targets: wasm32-unknown-unknown
      - name: Set up the pinned WASM toolchain
        uses: ./.github/actions/wasm-toolchain
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Capture source and compiler
        run: |
          git rev-parse HEAD 'HEAD^{tree}'
          rustc -vV
          cargo -vV
          wasm-bindgen --version
          node --version
      - name: Verify the runner refuses failures and sealed host reads
        run: bash scripts/check-wasm-test-runner.sh
      - name: Execute the exact coordinate cases
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: ${{ github.workspace }}/scripts/wasm-test-runner.sh
          PURRDF_TEST_REQUIRE_EXACT: 1
        run: |
          cargo test --locked --target wasm32-unknown-unknown -p purrdf-sparql-eval --test query_coordinates -- --exact \
            supplied_inputs_repeat_complete_results_without_host_reads \
            supplied_large_fraction_and_timezone_survive_repeated_now \
            prepared_executions_select_fresh_inputs_without_changing_the_plan \
            bounded_coordinate_owners_price_real_allocations_and_release_after_last_output
          cargo test --locked --target wasm32-unknown-unknown -p purrdf-shapes --test rule_coordinates -- --exact \
            shacl_queries_keep_time_and_distinct_reproducible_seeds_across_focus_nodes \
            parsed_rl_keeps_coordinates_on_both_carriers_and_restores_after_refusal
