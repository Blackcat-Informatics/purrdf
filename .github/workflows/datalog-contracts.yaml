name: Datalog evaluation contracts

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
    paths:
      - .github/workflows/datalog-contracts.yaml
      - crates/datalog/**
      - crates/entail/src/engine.rs
      - crates/entail/src/explain.rs
      - crates/shapes/src/srl/eval.rs
      - crates/shapes/tests/rule_capacity_limits.rs
      - crates/cli/tests/shapes_tools_cli.rs

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: 4
  RUST_TEST_THREADS: 2
  CARGO_TERM_COLOR: always

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: nightly
      - name: Capture source and compiler
        run: |
          git rev-parse HEAD 'HEAD^{tree}'
          rustc -vV
      - name: Execute public evaluator contracts
        run: |
          cargo test --locked -p purrdf-datalog --test rules_runtime
          cargo test --locked -p purrdf-datalog --test structured_errors
          cargo test --locked -p purrdf-shapes --test rule_capacity_limits
          cargo test --locked -p purrdf-validate --test evaluation_limits
          cargo test --locked -p purrdf-cli --test shapes_tools_cli
          cargo test --locked -p purrdf-capi --lib capi_apply_rules_takes_the_capacity_limits
          cargo test --locked -p purrdf-capi --lib the_dl_proof_golden_vector_matches
      - name: Measure model-only allocation and factor growth
        run: cargo test --locked -p purrdf-datalog --test factor_allocation -- --nocapture
      - name: Check evaluator, proof, store and scheduling regressions
        run: cargo test --locked -p purrdf-datalog --lib
      - name: Compare physical work in the entailment oracle
        id: oracle
        run: cargo test --locked -p purrdf-entail --test oracle -- --exact goldens_match_the_current_engine
      - name: Render actual oracle reports for review after a mismatch
        id: regenerated_oracle
        if: failure() && steps.oracle.outcome == 'failure'
        run: cargo test --locked -p purrdf-entail --test oracle -- --ignored --exact regenerate_goldens
      - name: Retain complete source-bound oracle reports
        if: failure() && steps.regenerated_oracle.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: datalog-entail-oracle-${{ github.sha }}
          path: crates/entail/tests/goldens/*.golden
          if-no-files-found: error

  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: nightly
          targets: wasm32-unknown-unknown
      - uses: ./.github/actions/wasm-toolchain
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Capture source and compiler
        run: |
          git rev-parse HEAD 'HEAD^{tree}'
          rustc -vV
          wasm-bindgen --version
          node --version
      - name: Verify runner refusal controls
        run: bash scripts/check-wasm-test-runner.sh
      - name: Execute actual portable evaluator contracts
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: ${{ github.workspace }}/scripts/wasm-test-runner.sh
        run: cargo test --locked --target wasm32-unknown-unknown -p purrdf-datalog --test rules_runtime
