name: Entailment error focused tests

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
    paths:
      - .github/workflows/entail-errors.yaml
      - Cargo.toml
      - Cargo.lock
      - crates/entail/**
      - crates/rdf-core/src/collections.rs
      - crates/hash/src/error.rs
      - crates/lex/src/diagnostic.rs

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: 8
  RUST_TEST_THREADS: 4
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: Native role reasoning and refusal inspection
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-native
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: nightly
      - name: Capture source and compiler
        run: |
          git rev-parse HEAD 'HEAD^{tree}'
          rustc -vV
          cargo -vV
      - name: Execute production role reasoning and refusal controls
        run: |
          mkdir -p target
          cargo test --locked -p purrdf-entail --test regular_role_chains -- --list > target/role-error-test-inventory.txt
          grep -Fq role_refusals_keep_native_fields_after_the_source_drops target/role-error-test-inventory.txt
          grep -Fq entailment_inspection_keeps_native_reads_and_the_actual_inconsistent_run target/role-error-test-inventory.txt
          grep -Fq import_conflict_inspection_keeps_original_versions_and_default_graph target/role-error-test-inventory.txt
          grep -Fq actual_collection_refusals_keep_original_terms_and_the_ordered_prefix target/role-error-test-inventory.txt
          grep -Fq empty_collection_admission_checks_nil_structure target/role-error-test-inventory.txt
          cargo test --locked -p purrdf-entail --test regular_role_chains
      - name: Execute native collection indexing and existing structural refusal controls
        run: |
          cargo test --locked -p purrdf-entail --lib -- --list > target/collection-unit-test-inventory.txt
          grep -Fq lists::tests:: target/collection-unit-test-inventory.txt
          cargo test --locked -p purrdf-entail --lib lists::tests::
          cargo test --locked -p purrdf-entail --test reasoner -- --exact malformed_lists_and_cyclic_data_ranges_keep_their_structural_refusals

  wasm:
    name: WASM role refusal inspection
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-wasm
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: nightly
          targets: wasm32-unknown-unknown
      - name: Set up the pinned WASM toolchain
        uses: ./.github/actions/wasm-toolchain
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Capture source and compiler
        run: |
          git rev-parse HEAD 'HEAD^{tree}'
          rustc -vV
          cargo -vV
          wasm-bindgen --version
          node --version
      - name: Verify runner failure and host-seal controls
        run: bash scripts/check-wasm-test-runner.sh
      - name: Execute actual portable native refusal inspection
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: ${{ github.workspace }}/scripts/wasm-test-runner.sh
          PURRDF_TEST_REQUIRE_EXACT: 1
        run: |
          cargo test --locked --target wasm32-unknown-unknown -p purrdf-entail --test regular_role_chains -- --exact \
            role_refusals_keep_native_fields_after_the_source_drops \
            entailment_inspection_keeps_native_reads_and_the_actual_inconsistent_run \
            import_conflict_inspection_keeps_original_versions_and_default_graph \
            actual_collection_refusals_keep_original_terms_and_the_ordered_prefix \
            empty_collection_admission_checks_nil_structure \
            non_simple_characteristics_and_malformed_chain_lists_hard_refuse \
            class_expression_role_refusals_retain_original_source_terms
