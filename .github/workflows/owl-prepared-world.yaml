name: OWL prepared world focused tests

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
    paths:
      - .github/workflows/owl-prepared-world.yaml
      - Cargo.toml
      - Cargo.lock
      - crates/entail/**
      - crates/rdf-core/src/ir/pack/bits.rs

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: 8
  RUST_TEST_THREADS: 4
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: Native source membership and prepared proof controls
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-native
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: nightly
      - name: Capture source and compiler
        run: |
          git rev-parse HEAD 'HEAD^{tree}'
          rustc -vV
          cargo -vV
      - name: Check sparse bitmap mutation and refusal
        run: |
          mkdir -p target
          cargo test --locked -p purrdf-core --lib -- --list > target/core-unit-inventory.txt
          grep -Fq ir::pack::bits::tests::bit_vec_sparse_writes_preserve_holes_and_refuse_growth_before_mutation target/core-unit-inventory.txt
          cargo test --locked -p purrdf-core --lib -- --exact ir::pack::bits::tests::bit_vec_sparse_writes_preserve_holes_and_refuse_growth_before_mutation
      - name: Check source membership and original query symbols
        run: |
          cargo test --locked -p purrdf-entail --lib -- --list > target/entail-unit-inventory.txt
          grep -Fq owl_dl::source_terms::tests::source_membership_keeps_query_holes_and_promotes_original_ids target/entail-unit-inventory.txt
          grep -Fq owl_dl::source_terms::tests::cold_source_ingress_keeps_the_prefix_without_allocating_a_bitmap target/entail-unit-inventory.txt
          grep -Fq owl_dl::proof::source::tests::source_resolution_preserves_query_holes_and_original_promoted_terms target/entail-unit-inventory.txt
          grep -Fq reasoner::axiom::tests::refutation_symbols_do_not_alias_terms_added_after_preparation target/entail-unit-inventory.txt
          cargo test --locked -p purrdf-entail --lib owl_dl::source_terms::tests::
          cargo test --locked -p purrdf-entail --lib -- --exact owl_dl::proof::source::tests::source_resolution_preserves_query_holes_and_original_promoted_terms
          cargo test --locked -p purrdf-entail --lib -- --exact reasoner::axiom::tests::refutation_symbols_do_not_alias_terms_added_after_preparation
          cargo test --locked -p purrdf-entail --lib reasoner::proof::current::tests::
      - name: Check existing public consumer and causal proof paths
        run: cargo test --locked -p purrdf-entail --test current_clash_support

  wasm:
    name: WASM prepared consumer and causal proof controls
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-wasm
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: nightly
          targets: wasm32-unknown-unknown
      - name: Set up the pinned WASM toolchain
        uses: ./.github/actions/wasm-toolchain
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Capture source and compiler
        run: |
          git rev-parse HEAD 'HEAD^{tree}'
          rustc -vV
          cargo -vV
          wasm-bindgen --version
          node --version
      - name: Verify runner failure and host-seal controls
        run: bash scripts/check-wasm-test-runner.sh
      - name: Execute existing public consumer and causal proof controls
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: ${{ github.workspace }}/scripts/wasm-test-runner.sh
        run: cargo test --locked --target wasm32-unknown-unknown -p purrdf-entail --test current_clash_support
