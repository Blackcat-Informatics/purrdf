  native-profile-comparison:
    if: always() && github.event_name == 'workflow_dispatch' && inputs.native_profile
    needs: [native-profile-admission, native-profile]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 8
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: "nightly" # keep in sync with rust-toolchain.toml
      - name: Prepare the original retained-evidence absolute path
        run: |
          campaign="/opt/purrdf-native-profile/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          sudo mkdir -p "$campaign"
          sudo chown -R "$(id -u):$(id -g)" "$campaign"
      - name: Download failure-preserving arm evidence
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          pattern: native-profile-${{ github.run_id }}-${{ github.run_attempt }}-arm-*
          # Each artifact's case directory is restored explicitly below: upload's
          # common parent is the case, not the campaign.
          path: /opt/purrdf-native-profile/${{ github.run_id }}-${{ github.run_attempt }}/downloads
      - name: Build comparison controller outside arms
        run: |
          campaign="/opt/purrdf-native-profile/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          CARGO_TARGET_DIR="$campaign/comparison-target" CARGO_BUILD_BUILD_DIR="$campaign/comparison-build" \
            cargo build --locked -p purrdf-capi --example native_ci_profile --profile test --jobs 8
          echo "PURRDF_HOSTED_CONTROLLER=$campaign/comparison-target/debug/examples/native_ci_profile" >> "$GITHUB_ENV"
      - name: Require the exact current-attempt inventory before restoring any evidence
        run: |
          set -o pipefail
          campaign="/opt/purrdf-native-profile/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          "$PURRDF_HOSTED_CONTROLLER" hosted-restore "$campaign" 2>&1 | tee "$campaign/restore-refusals.txt"
      - name: Validate all matching inputs and complete coverage before comparing either cold or warm
        run: |
          set -o pipefail
          campaign="/opt/purrdf-native-profile/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          "$PURRDF_HOSTED_CONTROLLER" hosted-compare "$campaign" 2>&1 | tee "$campaign/comparison-refusals.txt"
      - name: Retain comparison policies and outputs even on refusal
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-profile-${{ github.run_id }}-${{ github.run_attempt }}-comparison
          path: |
            /opt/purrdf-native-profile/${{ github.run_id }}-${{ github.run_attempt }}/*-policy.json
            /opt/purrdf-native-profile/${{ github.run_id }}-${{ github.run_attempt }}/*-comparison.json
            /opt/purrdf-native-profile/${{ github.run_id }}-${{ github.run_attempt }}/comparison-refusals.txt
            /opt/purrdf-native-profile/${{ github.run_id }}-${{ github.run_attempt }}/restore-refusals.txt
          if-no-files-found: error
      - name: Require every actual arm to have finished successfully
        env:
          ARMS_RESULT: ${{ needs.native-profile.result }}
          ADMISSION_RESULT: ${{ needs.native-profile-admission.result }}
        run: test "$ARMS_RESULT" = success && test "$ADMISSION_RESULT" = success
