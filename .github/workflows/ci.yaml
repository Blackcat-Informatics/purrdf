# SPDX-License-Identifier: MIT OR Apache-2.0 OR MulanPSL-2.0
name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # Any branch can be run on demand, without opening a pull request for it.
  workflow_dispatch:

# A newer push to a pull request supersedes the run the previous one started, so that
# run is cancelled rather than left to hold runners for a result nobody reads. Runs on
# main (and on tags) are never cancelled: every commit there keeps its whole record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # Full history and every branch: the non-Rust ratchet compares against the
          # merge-base with the pull request's base branch, which a depth-1 clone lacks.
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: "nightly" # keep in sync with rust-toolchain.toml

      - name: Format
        run: cargo fmt --all --check

      - name: Format the preserve-order consumer
        run: cargo fmt --manifest-path crates/jsonschema/tests/preserve_order_consumer/Cargo.toml --check

      - name: Clippy the preserve-order consumer (deny warnings)
        run: cargo clippy --manifest-path crates/jsonschema/tests/preserve_order_consumer/Cargo.toml --all-targets --locked -- -D warnings

      - name: Check workspace
        run: cargo check --workspace --lib --tests --locked

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Enforce no Cargo features
        run: python3 scripts/check-no-features.py

      - name: Check every workflow installs the toolchain rust-toolchain.toml pins
        run: python3 scripts/check-toolchain-pin.py

      - name: Check the toolchain-pin gate can still fail
        run: python3 scripts/check-toolchain-pin.py --self-test

      - name: Check the gate-parity gate can still fail
        run: python3 scripts/check-gate-parity.py --self-test

      - name: Check `make check` and this workflow run the same hygiene gates
        run: python3 scripts/check-gate-parity.py

      - name: Check the stream-chunk gate can still fail
        run: python3 scripts/check-stream-chunk.py --self-test

      - name: Check every streamed read names its chunk size
        run: python3 scripts/check-stream-chunk.py

      - name: Check the build-profile gate can still fail
        run: python3 scripts/check-build-profiles.py --self-test

      - name: Check the gate compiles at opt-level 3 with the runtime checks on
        run: python3 scripts/check-build-profiles.py

      - name: Check RFC 3986 reference resolution is not re-implemented outside purrdf-iri
        run: python3 scripts/check-iri-resolver-singleton.py

      - name: Check the serializer-rewind gate can still fail
        run: python3 scripts/check-serializer-rewinds.py --self-test

      - name: Check no serializer takes back output it already produced
        run: python3 scripts/check-serializer-rewinds.py

      - name: Check the PyO3-extension test-module gate can still fail
        run: python3 scripts/check-python-binding-tests.py --self-test

      - name: Check no Rust test module hides in the PyO3 extension crate
        run: python3 scripts/check-python-binding-tests.py

      - name: Check the terminal-predicate gate can still fail
        run: python3 scripts/check-terminal-predicates.py --self-test

      - name: Check no terminal predicate is re-derived outside its owning surface
        run: python3 scripts/check-terminal-predicates.py

      - name: Check the thread-local ledger gate can still fail
        run: python3 scripts/check-thread-locals.py --self-test

      - name: Check every thread-local is in the interleaving ledger with its reason
        run: python3 scripts/check-thread-locals.py

      - name: Check the shapes-parser silent-drop gate can still fail
        run: python3 scripts/check-shapes-parser-drops.py --self-test

      - name: Check the shapes parser drops no shapes-graph value silently
        run: python3 scripts/check-shapes-parser-drops.py

      - name: Check the tracked-path gate can still fail
        run: python3 scripts/check-tracked-paths.py --self-test

      - name: Check no tracked path is unsafe to pass to a command
        run: python3 scripts/check-tracked-paths.py

      - name: Check the test-shard gate can still fail
        run: python3 scripts/check-test-shards.py --self-test

      - name: Check the CI test shards cover every workspace member exactly once
        run: python3 scripts/check-test-shards.py

      - name: Check the workload acquisition pins and refusals hold (offline)
        run: python3 scripts/benchmark-acquire.py --self-test

      - name: Check the WatDiv instantiator is deterministic and its cache is sound (offline)
        run: python3 scripts/watdiv-queries.py --offline-self-test

      - name: Check the LUBM query normalisation and its controls hold (offline)
        run: python3 scripts/lubm-queries.py --offline-self-test

      - name: Check the license gate can still fail
        run: python3 scripts/check-licenses.py --self-test

      - name: Check vendored-corpus license hygiene
        run: python3 scripts/check-licenses.py

      - name: Fetch all locked platform dependencies for the offline audit
        run: python3 scripts/fetch-locked-deps.py

      - name: Check the packaged-license audit can still fail
        run: python3 scripts/package-licenses.py --self-test

      - name: Check C artifact capture refuses stale and mismatched outputs
        run: python3 scripts/build-capi-bundle.py --self-test

      - name: Check WebAssembly capture refuses stale and ambiguous outputs
        run: python3 scripts/build-private-wasm.py --self-test

      - name: Check Python distribution license metadata and wheel integrity
        run: python3 bindings/python/purrdf_build_backend.py --self-test

      - name: Check all generated recipient notices against provenance and resolved inputs
        run: python3 scripts/package-licenses.py --check

      - name: Check the banned-dependency gate can still fail
        run: python3 scripts/check-banned-deps.py --self-test

      - name: Check no replaced dependency re-entered the lock
        run: python3 scripts/check-banned-deps.py

      - name: Check every external dependency carries a census verdict
        run: python3 scripts/check-banned-deps.py --ledger-complete

      - name: Check the layering gate can still fail
        run: python3 scripts/check-layers.py --self-test

      - name: Check every first-party crate edge is one layers.toml allows
        run: python3 scripts/check-layers.py

      - name: Check the helper census can still find a copy
        run: cargo run -q --locked -p helper-census -- --self-test

      # A pull request is compared with the merge-base of its merge commit and its base
      # branch; a push to main with the commit main held before the push.
      - name: Check no legacy Python/JS grew and every new file says why it is not Rust
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT_NAME" in
            pull_request) base="origin/$BASE_REF" ;;
            push) base="$BEFORE" ;;
            *) base="origin/main" ;;
          esac
          case "$base" in
            "" | 0000000000000000000000000000000000000000) base="HEAD^" ;;
          esac
          cargo run -q --locked -p helper-census -- --non-rust-ratchet \
            --merge-base-with "$base" --target rev:HEAD

      - name: Check the shared-helpers gate can still fail
        run: python3 scripts/check-shared-helpers.py --self-test

      - name: Check helpers-ledger.toml holds (one home per job, no stale exemption)
        run: python3 scripts/check-shared-helpers.py

      - name: Check the hash-domain gate can still fail
        run: python3 scripts/check-hash-domains.py --self-test

      - name: Check every hash domain is a unique, prefix-free purrdf_hash::Domain
        run: python3 scripts/check-hash-domains.py

      - name: Check vendored-corpus byte-freeze
        run: python3 scripts/check-corpus-frozen.py

      - name: Check generated artifacts
        run: bash scripts/check-generated.sh

      - name: Check for stale issue references in comments/docs
        run: python3 scripts/check-issue-refs.py

      - name: Check brand casing (PurRDF in prose, `purrdf` only in identifiers)
        run: python3 scripts/check-brand-casing.py

      - name: Check no first-party extension is attributed to a SPARQL specification
        run: python3 scripts/check-spec-attribution.py --self-test

      - name: Check hand-written numbers still agree with the artifacts they restate
        run: python3 scripts/check-doc-claims.py

      - name: Check the zh-Hans translation against its glossary
        run: python3 scripts/check-i18n-glossary.py

      - name: Check cross-registry release coherence
        run: python3 scripts/check-versions.py

      - name: Check reviewed release summary and checksum refusal cases (offline)
        run: python3 scripts/check-release-notes.py --self-test

      - name: Check the current release has a bounded reviewed summary
        run: python3 scripts/check-release-notes.py

      - name: Check the crates.io release order is publishable and verifiable (offline)
        run: python3 scripts/check-publish-order.py

      - name: Check the crates.io record preflight refuses every wrong registry state (offline)
        run: bash scripts/check-crates-io-records.sh --self-test

      - name: Check release publication guards and resumable decisions (offline)
        run: bash scripts/publish-release-crates.sh --self-test

      - name: Check exact npm tarball publication guards (offline)
        run: python3 scripts/publish-npm.py --self-test

      - name: Check draft publication and immutable release verification (offline)
        run: python3 scripts/publish-github-release.py --self-test

      - name: Check isolated empty bootstrap verification and registry refusals (offline)
        run: bash scripts/bootstrap-crates-io.sh --self-test

      - name: Check every wasm-bindgen free function is re-exported from the npm package root
        run: python3 scripts/check-wasm-js-exports.py

      - name: Check the conclusion-directed entailment surface reaches all four hosts
        run: python3 scripts/check-entailment-surface.py

      - name: Check every PyO3 member the extension exposes is declared in the shipped type stub
        run: python3 scripts/check-python-stub-parity.py

      - name: Check every scraped conformance row is RED without its scoreboard line
        run: python3 scripts/conformance-matrix.py --self-test

      - name: Check the SIMD asm evidence gate can still fail
        run: python3 scripts/check-simd-asm.py --self-test

      - name: Check the bench comparison selects bench-harness suites only
        run: python3 scripts/bench-suite-targets.py --self-test

      - name: Check the clean-room transcript audit rejects each forbidden access beside an allowed neighbour
        run: python3 scripts/cleanroom/transcript_audit.py --self-test

      - name: Check the clean-room guard hook blocks the forbidden tree and allows its neighbour
        run: python3 scripts/cleanroom/guard_hook.py --self-test

      - name: Check the clean-room deny settings spell every forbidden path and refuse a narrowed rule
        run: python3 scripts/cleanroom/deny_settings.py --self-test

      - name: Check the similarity check flags planted derivations, passes independent code, and needs its calibration
        run: python3 scripts/cleanroom/similarity.py --self-test

      - name: Check the clean-room provenance schema refuses an incomplete file and accepts a complete one
        run: python3 scripts/cleanroom/provenance.py --self-test

      - name: Verify BM25F goldens against the independent integer reference
        run: python3 crates/text/tests/reference/bm25f.py --check

      - name: Check the kernel ring-fence (no PyO3 in purrdf-core, zero-dep leaves)
        run: make rdf-core-hygiene

  # `cargo test --workspace --locked` (`make test`), as six parallel shards. As one
  # job it compiled for 25 minutes before running a test and was cancelled at its
  # timeout; nearly all of that is first-party test targets, so a dependency cache
  # alone could not bring it back under budget. `make test-shard` defines the
  # shards and carries the proof that together they are exactly the old command:
  # every shard selects `--workspace`, so dependency features resolve as they did,
  # and the lib / doc / four integration-test shards partition its default target
  # selection. The one test removed from this lane is c_abi_smoke, which the `capi`
  # job below already runs through `make capi-check`.
  test-shard:
    name: test (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One red shard must not cancel the others: each reports a disjoint slice of
      # the suite, and a cancelled slice is a slice nobody saw.
      fail-fast: false
      matrix:
        shard: [lib, doc, integration-1, integration-2, integration-3, integration-4]
    # Debug-info policy is not set here any more. `[profile.dev]` in Cargo.toml
    # owns it (line tables for our crates, none for dependencies), so this job
    # gets the artifact saving it used to buy with CARGO_PROFILE_TEST_DEBUG on
    # every other lane too -- and a second place to set one thing was exactly the
    # kind of manifest shadow `scripts/check-build-profiles.py` now reports.
    steps:
      # This lane links the workspace's test targets, which is the largest thing CI
      # builds -- one binary per integration-test file, each carrying the line
      # tables `[profile.dev]` asks for, plus the umbrella crate's doctests, whose
      # link line pulls in every member crate at once.
      #
      # A hosted runner ships ~30 GB of preinstalled toolchains this repository
      # never uses, and running out of disk here does NOT surface as a disk error:
      # the linker writes through a memory mapping, so a truncated write arrives as
      # `rust-lld` dying on SIGBUS with an LLVM crash backtrace, which reads exactly
      # like a compiler bug. Reclaiming the space up front is what keeps that
      # failure from being diagnosed as one.
      #
      # `hostedtoolcache` is deliberately NOT removed: `setup-node` below reads it,
      # and deleting it trades disk for a re-download on every run.
      - name: Reclaim runner disk before the largest link in CI
        run: |
          echo "before:"
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/share/swift
          echo "after:"
          df -h /

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: "nightly" # keep in sync with rust-toolchain.toml

      # One cache for all six shards. Every shard resolves features over the whole
      # workspace, so each compiles its dependencies identically and one saved set
      # serves them all; the lib shard, which builds every package's dev-dependencies,
      # is the one that saves it. First-party crates are never cached (the action
      # cleans them), so every shard still compiles the code under test.
      - name: Cache the dependency build (shared by every shard)
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: workspace-test
          save-if: ${{ matrix.shard == 'lib' }}

      - name: Install Node for the Unicode ECMAScript oracle
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Install the pinned Binaryen validator for wasm-link tests
        if: matrix.shard == 'lib'
        uses: ./.github/actions/binaryen-toolchain

      - name: Run workspace tests (this shard; the six include the doc tests)
        # A hosted x86_64 runner guarantees only the SSE2 baseline, so SSE2 is the one
        # vector path of each family this job requires; the distance, kNN and HNSW
        # tests still assert they executed every path the runner reports, and every
        # other family's differentials run every path it detects. `avx512-sde` below
        # requires the rest.
        env:
          PURRDF_REQUIRE_SIMD_PATHS: distance:portable,distance:sse2,blake3:sse2,deflate:sse2,csv:sse2
        run: make test-shard SHARD=${{ matrix.shard }}

      - name: Test downstream preserve-order feature unification
        if: matrix.shard == 'lib'
        run: cargo test --manifest-path crates/jsonschema/tests/preserve_order_consumer/Cargo.toml --locked

  # The stable name for the sharded workspace tests: it succeeds only when every
  # shard did.
  test:
    needs: test-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require every shard to succeed
        env:
          MATRIX_RESULT: ${{ needs.test-shard.result }}
        run: test "$MATRIX_RESULT" = success

  projection-oracles:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: "nightly" # keep in sync with rust-toolchain.toml

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: W3C CSVW and independent projection oracles
        run: make projection-oracles

  # The C-ABI header crates/rdf-capi/include/purrdf.h is a committed,
  # SemVer-frozen contract that MUST stay a byte-exact projection of the crate's
  # exported ABI. Nothing gated it before this job existed, so it silently
  # drifted for three minor releases (missing the SHACL entry points).
  # `make capi-check` regenerates the header with the pinned cargo-c and fails on
  # any drift, then compiles + links + runs the C smoke test against it.
  capi:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: "nightly" # keep in sync with rust-toolchain.toml

      - name: Install cargo-c (the pinned header-contract generator)
        # Pinned to the exact cargo-c whose bundled cbindgen the committed
        # purrdf.h contract expects (see crates/rdf-capi/cbindgen.toml). A
        # different cargo-c would emit spurious enum-ordering/formatting drift.
        run: cargo install cargo-c --version 0.10.23 --locked

      - name: Verify purrdf.h is current + the C smoke links and runs
        run: make capi-check

  doc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: "nightly" # keep in sync with rust-toolchain.toml

      # Document exactly the 31 publishable crates with rustdoc lints promoted
      # to errors. The four publish=false crates are excluded
      # because purrdf-capi's `[lib] name = "purrdf"` collides with the umbrella
      # crate's output filename in a single --workspace doc run.
      - name: Doc (deny warnings)
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --exclude purrdf-capi --exclude purrdf-python --exclude purrdf-sparql-conformance --exclude purrdf-cli

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install MSRV Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: "1.98"

      # RUSTUP_TOOLCHAIN is mandatory here, not belt-and-braces. The action
      # selects a toolchain with `rustup default`, which sits at the BOTTOM of
      # rustup's precedence order — below `rust-toolchain.toml`. So the install
      # step above alone does not make cargo use 1.98 inside this repo; the
      # repo pin wins and the job silently measures the dev toolchain instead.
      # `RUSTUP_TOOLCHAIN` outranks the file, so this is what actually holds the
      # floor at 1.98 and proves no nightly-only feature has crept in.
      - name: Check workspace on MSRV
        run: cargo check --workspace --lib --locked
        env:
          RUSTUP_TOOLCHAIN: "1.98"

      # Prove the guard is live: if the toolchain selection above ever regresses
      # to the repo pin, this fails loudly instead of the job quietly passing on
      # a compiler that is not the MSRV.
      - name: Assert the MSRV job really ran on 1.98
        run: |
          set -euo pipefail
          version=$(rustc --version)
          echo "$version"
          case "$version" in
            "rustc 1.98."*) ;;
            *) echo "::error::MSRV job resolved '$version', expected rustc 1.98.x" >&2; exit 1 ;;
          esac
        env:
          RUSTUP_TOOLCHAIN: "1.98"

  # Release builds, package host interfaces, focused WASM execution and native
  # schema oracles run separately. Complete semantic corpora remain native.
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: "nightly" # keep in sync with rust-toolchain.toml
          targets: wasm32-unknown-unknown

      - name: Set up the pinned wasm toolchain (wasm-bindgen + binaryen) and cache
        uses: ./.github/actions/wasm-toolchain

      - name: Build release crates on wasm32
        # `purrdf-bench` is unpublished tooling, and it is on this list because
        # its library half documents itself as portable. Only the library is
        # built (`--lib`); the `bench-corpus` binary is std-only and stays out.
        # This list mirrors the `wasm` target in the Makefile.
        run: |
          cargo build --locked --release --target wasm32-unknown-unknown --lib \
            -p purrdf-events \
            -p purrdf-lex \
            -p purrdf-iri \
            -p purrdf-xsd \
            -p purrdf-cdt \
            -p purrdf-jsonschema \
            -p purrdf-hash \
            -p purrdf-deflate \
            -p purrdf-stack \
            -p purrdf-ed25519 \
            -p purrdf-gts \
            -p purrdf-core \
            -p purrdf-columnar \
            -p purrdf-datalog \
            -p purrdf-sparql-algebra \
            -p purrdf-sparql-results \
            -p purrdf-sparql-eval \
            -p purrdf-hnsw \
            -p purrdf-rdf \
            -p purrdf-markdown \
            -p purrdf-json \
            -p purrdf-slice \
            -p purrdf-shapes \
            -p purrdf-shex \
            -p purrdf-entail \
            -p purrdf-geo \
            -p purrdf-text \
            -p purrdf-retrieval \
            -p purrdf-validate \
            -p purrdf \
            -p purrdf-wasm \
            -p purrdf-bench

  wasm-package:
    runs-on: ubuntu-latest
    # Main 9febd07c measured 19m10s including 12m21s of async tests.
    # Thirty minutes gives 1.5x headroom; schema oracles run independently below.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: "nightly" # keep in sync with rust-toolchain.toml
          targets: wasm32-unknown-unknown

      - name: Set up the pinned wasm toolchain (wasm-bindgen + binaryen) and cache
        uses: ./.github/actions/wasm-toolchain

      - name: Build the optimized wasm package
        # Builds the +simd128 release artifact, runs wasm-bindgen + wasm-opt -Oz,
        # and verifies SIMD codegen.
        run: make wasm-pkg

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Run npm package gates
        working-directory: crates/rdf-wasm/js
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check

      - name: Verify exact Dataset and exchange identity ABIs
        # Reuse the existing >2^53 Node/TypeScript fixture and private Cargo
        # artifact guard; native corpus execution cannot prove this host ABI.
        run: ./scripts/check-wasm-dataset-identity.sh

      - name: Run the Worker recipe under workerd
        # The README's Worker recipe and the Cloudflare adapter, served from the package
        # built above by real workerd through Miniflare: a joined SERVICE, SERVICE SILENT
        # over a failing endpoint, a catalog denial (403), an upstream 500 (502), and a
        # request served while a long query runs. The upstream is answered in process;
        # no request leaves the runner. Miniflare is installed exactly pinned into a
        # scratch directory, never into the package's devDependencies, so a local
        # `npm ci` does not download workerd; the driver refuses to run without it.
        working-directory: crates/rdf-wasm/js
        timeout-minutes: 8
        env:
          PURRDF_MINIFLARE_DIR: ${{ github.workspace }}/.ci-workerd-harness
        run: |
          mkdir -p "$PURRDF_MINIFLARE_DIR"
          npm install --prefix "$PURRDF_MINIFLARE_DIR" --no-save --no-package-lock \
            --ignore-scripts --no-audit --no-fund miniflare@4.20260730.0
          node tests/workerd/run-worker-recipe.mjs

  # Only actual WASM dispatch, SIMD kernels, shadow-stack floors and host
  # interfaces execute here; docs/WASM_TESTING.md lists every exact selection.
  wasm-exec:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: "nightly" # keep in sync with rust-toolchain.toml
          targets: wasm32-unknown-unknown

      - name: Set up the pinned wasm toolchain (wasm-bindgen + binaryen) and cache
        uses: ./.github/actions/wasm-toolchain

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Execute WASM dispatch, SIMD kernels, stack and host-interface probes (Node)
        # Native workspace tests own complete semantic/conformance corpora.
        # docs/WASM_TESTING.md records every retained named target obligation.
        # Existing exact filters select the retained cases; runner preflight
        # observes panic, refused flags and sealed host reads.
        # SIMD kernels execute only in the +simd128 build; target-path admission
        # uses both builds, and shadow-stack/host-clock probes use the baseline.
        run: make wasm-test

  # Native schema oracles need no wasm package and run in parallel.
  wasm-schema-oracles:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: "nightly" # keep in sync with rust-toolchain.toml

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Install npm dependencies for the emitter schema oracles
        # Only `npm ci` -- the oracles resolve `typescript`/`graphql` out of
        # this directory's node_modules directly; they do not need the built
        # wasm package (`npm run check` and its `pkg/` dependency stay in the
        # `wasm-package` job above).
        working-directory: crates/rdf-wasm/js
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: TypeScript emitter schema oracle
        run: node crates/shapes/tests/typescript_oracle.mjs

      - name: GraphQL emitter schema oracle
        run: node crates/shapes/tests/graphql_oracle.mjs


  # One configuration per runner; the stable aggregate requires every shard.
  simd-asm-config:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        config: [x86_64, x86_64-v3, x86_64-v4, aarch64, aarch64-neoverse-v1, wasm32, wasm32-simd128]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: "nightly" # keep in sync with rust-toolchain.toml
          targets: wasm32-unknown-unknown, aarch64-unknown-linux-gnu
      - name: Identify the actual compiler
        id: compiler
        run: echo "identity=$(rustc -vV | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Restore assembly build contexts and evidence
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target/simd-asm
          key: simd-asm-v1-${{ runner.os }}-${{ matrix.config }}-${{ steps.compiler.outputs.identity }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            simd-asm-v1-${{ runner.os }}-${{ matrix.config }}-${{ steps.compiler.outputs.identity }}-${{ hashFiles('Cargo.lock') }}-
      - name: Install the C cross toolchain
        if: startsWith(matrix.config, 'aarch64') || startsWith(matrix.config, 'wasm32')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang llvm gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - name: Measure and check this configuration
        run: |
          # Bound scalar WASM compilation through the existing Cargo job budget.
          # Other configurations keep their current scheduling.
          if [ "${{ matrix.config }}" = wasm32 ]; then
            export CARGO_BUILD_JOBS=1
          fi
          make simd-asm SIMD_ASM_ARGS="--config ${{ matrix.config }} --jobs 1 --report target/asm-reports/${{ matrix.config }}.json"
      - name: Upload checked evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: simd-asm-${{ matrix.config }}
          path: target/asm-reports/*.json
          if-no-files-found: error

  simd-asm:
    needs: simd-asm-config
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require every configuration to succeed
        env:
          MATRIX_RESULT: ${{ needs.simd-asm-config.result }}
        run: test "$MATRIX_RESULT" = success
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: "nightly" # keep in sync with rust-toolchain.toml
      - name: Download all configuration reports
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          pattern: simd-asm-*
          merge-multiple: true
          path: target/asm-reports
      - name: Check complete matrix and document parity
        run: make simd-asm SIMD_ASM_ARGS="--merge-reports target/asm-reports"

  # The third ISA the distance arithmetic's bit-identity claim is EXECUTED on. The
  # exact law pins one summation order in source, so its results must be the same
  # bits on x86_64, wasm32 and aarch64; the asm gate above can only show NEON code
  # exists, and this job runs it. The pinned goldens these tests compare against are
  # the ones x86_64 and wasm32 already hold, so a divergent aarch64 fold fails here.
  # The reassociated arithmetic runs its NEON path too, against its error bound, and
  # the CSV field scanner runs its NEON kernel against its portable one.
  aarch64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: "nightly" # keep in sync with rust-toolchain.toml

      - name: Run the distance arithmetic's path and reference-model tests on NEON
        env:
          PURRDF_REQUIRE_SIMD_PATHS: distance:portable,distance:neon
        run: cargo test --locked -p purrdf-core --lib distance

      - name: Run the kNN kernels and their pinned cross-target answers on aarch64
        env:
          PURRDF_REQUIRE_SIMD_PATHS: distance:portable,distance:neon
        run: |
          cargo test --locked -p purrdf-sparql-eval --lib knn
          cargo test --locked -p purrdf-sparql-eval --test knn_wasm_determinism
          cargo test --locked -p purrdf-sparql-eval --test knn_wasm_reassociated

      - name: Compare the HNSW image digests with the pinned goldens and run the reassociated index on aarch64
        env:
          PURRDF_REQUIRE_SIMD_PATHS: distance:portable,distance:neon
        run: |
          cargo test --locked -p purrdf-hnsw --lib --test determinism --test conformance \
            --test wasm_reassociated

      - name: Run the SHA-1, CRC-32, base16 and BLAKE3 Arm kernels against frozen vectors
        # The hash crate's own path requirement: the Armv8 SHA1 and CRC32 kernels
        # must be detected, selected and executed here, beside the portable path,
        # and reproduce every frozen vector bit for bit. No other job runs them.
        env:
          PURRDF_REQUIRE_SIMD_PATHS: sha1:portable,sha1:aarch64-sha1,crc32:portable,crc32:aarch64-crc32,hex:aarch64-neon,blake3:portable,blake3:neon
        run: cargo test --locked -p purrdf-hash -p purrdf-hash-conformance

      - name: Run the AES-round FixedHasher path on Arm
        # The fixed-key table hasher's AES function exists only in builds whose
        # target enables AES; this is the job that compiles and runs it on
        # AArch64, against its own frozen vectors.
        env:
          RUSTFLAGS: "-C target-feature=+aes"
        run: cargo test --locked -p purrdf-hash-conformance --test fixed_hasher

      - name: Run the DEFLATE NEON kernels against the portable ones on aarch64
        # purrdf-deflate's match copy, match-length compare and window hashing
        # have NEON kernels that only an aarch64 runner executes: the kernel
        # differentials and the encoder/decoder agreement cases must run on the
        # NEON path here, beside the portable one.
        env:
          PURRDF_REQUIRE_SIMD_PATHS: deflate:portable,deflate:neon
        run: cargo test --locked -p purrdf-deflate


      # The CSV field scanner's explicit NEON kernel against the portable kernel and
      # the per-byte scan at every alignment and length (the test asserts the NEON
      # kernel is among those compared), then the reader, writer and frozen-vector
      # replay on the kernel aarch64 dispatches to.
      - name: Run the CSV field scanner's NEON kernel and the CSV reader and writer on aarch64
        env:
          PURRDF_REQUIRE_SIMD_PATHS: csv:portable,csv:neon
        run: |
          cargo test --locked -p purrdf-core --lib csv::
          cargo test --locked -p purrdf-core --test csv_differential


  # The architectures whose float control register this build does not read. On them the
  # float environment is proven by the behavioural probe alone, so a kernel that computes
  # on x86_64, aarch64 and wasm32 must compute here too rather than refuse an environment
  # that was never shown to be wrong. Six targets are type-checked; two of them execute
  # the distance, kNN and HNSW suites: i686 natively through the multilib C library, and
  # riscv64 under user-mode emulation, which also sets the RISC-V rounding field and
  # proves the probe refuses every non-default mode on a target with no register reader.
  # Neither has a named reassociated path, so both execute the reassociated arithmetic
  # along its portable one, against its error bound, and i686 runs the HNSW unit tests
  # that decode and refuse an image recorded on that path.
  cross-arch:
    runs-on: ubuntu-latest
    # Six cold check graphs, the i686 test build and the i586 (x87) test build.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: "nightly" # keep in sync with rust-toolchain.toml
          targets: i686-unknown-linux-gnu, i586-unknown-linux-gnu, armv7-unknown-linux-gnueabihf, riscv64gc-unknown-linux-gnu, powerpc64le-unknown-linux-gnu, s390x-unknown-linux-gnu, loongarch64-unknown-linux-gnu, x86_64-pc-windows-gnu

      - name: Install the i686 C library
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-multilib

      - name: Type-check the distance kernels and their consumers on six architectures
        run: |
          for target in \
            i686-unknown-linux-gnu \
            armv7-unknown-linux-gnueabihf \
            riscv64gc-unknown-linux-gnu \
            powerpc64le-unknown-linux-gnu \
            s390x-unknown-linux-gnu \
            loongarch64-unknown-linux-gnu
          do
            cargo check --locked --target "$target" \
              -p purrdf-core -p purrdf-sparql-eval -p purrdf-hnsw
          done

      - name: Type-check gts and cli for Windows
        run: |
          cargo check --locked --target x86_64-pc-windows-gnu -p purrdf-gts -p purrdf-cli

      - name: Run BLAKE3, distance, kNN and HNSW suites on i686
        env:
          PURRDF_REQUIRE_SIMD_PATHS: distance:portable,blake3:portable,blake3:sse2
        run: |
          cargo test --locked --target i686-unknown-linux-gnu -p purrdf-hash-conformance --test blake3
          cargo test --locked --target i686-unknown-linux-gnu -p purrdf-core --lib distance
          cargo test --locked --target i686-unknown-linux-gnu -p purrdf-sparql-eval --lib knn
          cargo test --locked --target i686-unknown-linux-gnu -p purrdf-sparql-eval \
            --test knn_wasm_determinism --test knn_wasm_reassociated
          cargo test --locked --target i686-unknown-linux-gnu -p purrdf-hnsw \
            --lib --test determinism --test conformance --test float_environment \
            --test float_environment_rayon --test wasm_reassociated
          cargo test --locked --target i686-unknown-linux-gnu -p purrdf-sparql-eval \
            --test binary_arithmetic

      # i586 has no SSE2, so every binary64 and binary32 operation runs on the x87,
      # which rounds to its register precision and again on every store. Every
      # result-affecting operation in the workspace computes through `purrdf_xsd::ieee`,
      # under a guard that sets the format's precision and with the subnormal range of
      # products and quotients scaled; these suites prove the operations, the SPARQL
      # `xsd:double`/`xsd:float` arithmetic and aggregates, and the distance kernels
      # equal the integer software reference bit for bit, that the probe refuses a
      # thread where the guard did not take hold, and that a thread (or rayon worker)
      # with a directed rounding control is refused by name. The i586 target links
      # against the same 32-bit C library as i686.
      - name: Run BLAKE3, arithmetic, distance, kNN and HNSW suites on i586 (x87)
        env:
          PURRDF_REQUIRE_SIMD_PATHS: distance:portable,blake3:portable
        run: |
          cargo test --locked --target i586-unknown-linux-gnu -p purrdf-hash-conformance --test blake3
          cargo test --locked --target i586-unknown-linux-gnu -p purrdf-xsd --lib
          cargo test --locked --target i586-unknown-linux-gnu -p purrdf-core --lib distance
          cargo test --locked --target i586-unknown-linux-gnu -p purrdf-core --lib ir::embedding
          cargo test --locked --target i586-unknown-linux-gnu -p purrdf-sparql-eval --lib knn
          cargo test --locked --target i586-unknown-linux-gnu -p purrdf-sparql-eval --lib bgp::tests
          cargo test --locked --target i586-unknown-linux-gnu -p purrdf-sparql-eval \
            --test binary_arithmetic
          cargo test --locked --target i586-unknown-linux-gnu -p purrdf-hnsw --lib \
            --test float_environment_x87 --test float_environment_x87_rayon

  # Type-checking the Windows path cannot verify CreateFileW access rights or
  # timestamp resolution. Exercise file, directory, hardlink, and read-only
  # restoration on the target operating system.
  windows-mtime:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: "nightly" # keep in sync with rust-toolchain.toml

      - name: Restore file and directory mtimes on Windows
        run: cargo test --locked -p purrdf-gts --test unpack_mtime

  # riscv64 runs apart from i686 because the distribution's multilib and riscv64
  # cross compilers cannot be installed together. Under emulation one HNSW digest
  # takes minutes, so the suites run on four runners. The `determinism-*` parts each
  # run the determinism tests they name, and fail unless every named test ran; the
  # `suites` part runs everything else, the rest of the determinism file included
  # (it skips exactly the names the other parts own), so a test added to the file
  # later runs there without being listed anywhere.
  cross-arch-riscv64:
    name: cross-arch-riscv64 (${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [suites, determinism-serial, determinism-one-worker, determinism-more-workers]
    env:
      CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER: riscv64-linux-gnu-gcc
      CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_RUNNER: qemu-riscv64 -L /usr/riscv64-linux-gnu
      DETERMINISM_SERIAL: a_serial_insert_builds_a_different_graph
      DETERMINISM_ONE_WORKER: the_digest_is_identical_under_one_worker
      DETERMINISM_MORE_WORKERS: the_digest_is_identical_under_two_workers the_digest_is_identical_under_four_workers the_digest_is_identical_under_eight_workers
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: "nightly" # keep in sync with rust-toolchain.toml
          targets: riscv64gc-unknown-linux-gnu

      - name: Install the riscv64 cross linker and user-mode emulation
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-riscv64-linux-gnu libc6-dev-riscv64-cross qemu-user

      - name: Run BLAKE3, distance, kNN and HNSW suites on riscv64 under emulation (this part)
        env:
          PURRDF_REQUIRE_SIMD_PATHS: distance:portable,blake3:portable
          PART: ${{ matrix.part }}
        shell: bash
        run: |
          set -euo pipefail
          target=riscv64gc-unknown-linux-gnu
          # Run the named determinism tests, then require each to have run and passed:
          # an `--exact` filter that matches nothing runs zero tests and exits 0.
          determinism() {
            log="$RUNNER_TEMP/determinism-$PART.log"
            cargo test --locked --target "$target" -p purrdf-hnsw --test determinism \
              -- --color never --exact "$@" 2>&1 | tee "$log"
            for name in "$@"; do
              grep -qx "test $name ... ok" "$log" || { echo "::error::$name did not run on this part"; exit 1; }
            done
          }
          # Word splitting of the DETERMINISM_* lists is intended: each is a list of
          # test names.
          # shellcheck disable=SC2086
          case "$PART" in
          suites)
            cargo test --locked --target "$target" -p purrdf-hash-conformance --test blake3
            cargo test --locked --target "$target" -p purrdf-core --lib distance
            cargo test --locked --target "$target" -p purrdf-sparql-eval --lib knn
            cargo test --locked --target "$target" -p purrdf-sparql-eval \
              --test knn_wasm_determinism --test knn_wasm_reassociated
            cargo test --locked --target "$target" -p purrdf-hnsw \
              --test conformance --test wasm_reassociated
            skips=()
            for name in $DETERMINISM_SERIAL $DETERMINISM_ONE_WORKER $DETERMINISM_MORE_WORKERS; do
              skips+=(--skip "$name")
            done
            cargo test --locked --target "$target" -p purrdf-hnsw --test determinism \
              -- --exact "${skips[@]}"
            ;;
          determinism-serial) determinism $DETERMINISM_SERIAL ;;
          determinism-one-worker) determinism $DETERMINISM_ONE_WORKER ;;
          determinism-more-workers) determinism $DETERMINISM_MORE_WORKERS ;;
          *) echo "::error::unknown part $PART"; exit 1 ;;
          esac

  # The x86_64 dispatch paths a hosted runner does not guarantee, EXECUTED. GitHub's
  # x86_64 runners promise neither AVX2+FMA nor AVX-512F, so without this job the
  # reassociated avx512f compilation would ship having run only on whichever runner
  # happened to have it. Intel's Software Development Emulator runs the test binaries
  # as a Sapphire Rapids processor, which reports AVX2, FMA and AVX-512F, and
  # PURRDF_REQUIRE_SIMD_PATHS makes every x86_64 path a requirement: a path the
  # emulated processor does not report, or a test that did not execute it, fails the
  # job. The binaries are built natively first; only running them is emulated. The
  # HNSW digest suites stay on the native lanes: their worker-count sweep is minutes
  # natively, and the unit tests already build, search and verify an index on every
  # path the emulated processor reports.
  avx512-sde:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: "nightly" # keep in sync with rust-toolchain.toml

      - name: Install Intel SDE
        # The action verifies the archive against the SHA-256 it pins per SDE version.
        uses: petarpetrovt/setup-sde@6d2773bc0ef3005fd52e0ae0bb91782321793aec # v6.0
        with:
          environmentVariableName: SDE_PATH
          sdeVersion: 10.13.1

      - name: Build BLAKE3, distance, kNN and HNSW test binaries
        run: |
          cargo test --locked --no-run -p purrdf-hash-conformance --test blake3
          cargo test --locked --no-run -p purrdf-core --lib
          cargo test --locked --no-run -p purrdf-sparql-eval --lib \
            --test knn_wasm_determinism --test knn_wasm_reassociated
          cargo test --locked --no-run -p purrdf-hnsw --lib

      - name: Run them on an emulated AVX-512F processor, requiring every x86_64 path
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: ${{ env.SDE_PATH }}/sde64 -spr --
          PURRDF_REQUIRE_SIMD_PATHS: distance:portable,distance:avx2,distance:sse2,distance:avx2+fma,distance:avx512f,blake3:portable,blake3:sse2,blake3:ssse3,blake3:avx2,blake3:avx512
        run: |
          cargo test --locked -p purrdf-hash-conformance --test blake3
          cargo test --locked -p purrdf-core --lib distance
          cargo test --locked -p purrdf-sparql-eval --lib knn
          cargo test --locked -p purrdf-sparql-eval \
            --test knn_wasm_determinism --test knn_wasm_reassociated
          cargo test --locked -p purrdf-hnsw --lib

  # The Python binding gate — separate from the Rust `workspace`/`test` jobs above
  # (AGENTS.md §3: `make check` stays a pure-Rust gate). Builds the native module
  # with maturin and runs the pytest suite (compat parity + the rdflib/xfail-ledger
  # gate). The REAL rdflib is installed here as the differential oracle; the
  # opt-in top-level `rdflib` shadow package is never installed in this env.
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: "nightly" # keep in sync with rust-toolchain.toml

      # The test lane's `lib` shard dependency build, restored and never re-saved: the
      # module build and the emitter oracle's cargo run share most dependency units
      # with it, and no new cache entry competes for the repository's quota.
      - name: Restore the workspace test lane's dependency build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: workspace-test
          save-if: false

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Python binding tests (maturin build + pytest)
        working-directory: bindings/python
        run: |
          uv sync --locked --group dev
          uv run --locked pytest tests -q

      - name: Pydantic emitter schema oracle
        run: make pydantic-oracle

      - name: LinkML emitter schema oracle
        run: make linkml-oracle

  # Publisher tooling has its own Python/platform lock and never needs release
  # credentials to run its regressions. Every identity/signing/HTTP path in
  # these tests is mocked; a network request from a test fails immediately.
  python-publisher:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          architecture: x64

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: false

      - name: Verify the locked tooling and offline publisher regressions
        run: |
          publisher_env="$(mktemp -d "$RUNNER_TEMP/purrdf-python-publisher.XXXXXX")"
          uv venv --python 3.13 "$publisher_env"
          uv pip sync --python "$publisher_env/bin/python" --require-hashes --only-binary :all: \
            scripts/python-publisher-requirements.txt
          "$publisher_env/bin/python" -I scripts/publish-python.py --self-test

  # The small vector's inline storage is uninitialised memory moved with raw
  # pointer copies, so its tests run under Miri on every push: Stacked and Tree
  # Borrows, strict provenance, and a 32-bit target (`make miri`).
  miri:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: "nightly" # keep in sync with rust-toolchain.toml
          components: miri, rust-src

      - name: Miri (SmallVec unsafe storage)
        run: make miri

  # The single conformance matrix: runs the native Rust W3C
  # harnesses (RDFC-1.0, IRI, syntax codecs, SPARQL-eval subset, SHACL, shexTest)
  # AND the Python rdflib drop-in gate together, printing ONE scoreboard with
  # per-suite pass / xfail(skip) / fail counts. Exits non-zero on any unexpected
  # failure (a red run, an XPASS, or a stale ledger key). The matrix is also
  # published to the job summary via $GITHUB_STEP_SUMMARY. The REAL rdflib is the
  # differential oracle (installed by uv), never the top-level rdflib shadow.
  #
  # The suites run on four runners, one per shard of scripts/conformance-matrix.py's
  # SHARDS (suites that compile the same crates share one), and each writes its rows
  # unjudged. The `conformance` job reassembles every shard's rows in matrix order
  # and judges the whole matrix -- the ratchet and its orphan check, the scoreboard,
  # the job summary and the docs/CONFORMANCE.md drift check -- exactly as a single
  # `make conformance` run does; a missing or incomplete shard is a failure there.
  conformance-shard:
    name: conformance (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [core, sparql, shapes, python]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: "nightly" # keep in sync with rust-toolchain.toml

      # The dependency build the test lane's `lib` shard saves, restored and never re-saved:
      # Cargo fingerprints each unit, so only matching feature/profile builds
      # are reused, and no new cache entry competes for the repository's quota.
      - name: Restore the workspace test lane's dependency build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: workspace-test
          save-if: false

      - name: Install uv
        if: matrix.shard == 'python'
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Conformance matrix (this shard's suites)
        env:
          SHARD: ${{ matrix.shard }}
        run: make conformance CONFORMANCE_ARGS="--shard $SHARD --emit-results target/conformance-results/$SHARD.json"

      - name: Upload this shard's rows
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: conformance-results-${{ matrix.shard }}
          path: target/conformance-results/${{ matrix.shard }}.json
          if-no-files-found: error

  conformance:
    needs: conformance-shard
    # Runs whatever the shards concluded, so a red suite is still reported in the one
    # scoreboard; a shard that wrote no rows fails here by name.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download every shard's rows
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          pattern: conformance-results-*
          merge-multiple: true
          path: target/conformance-results

      - name: Conformance matrix (native Rust suites + rdflib gate)
        run: make conformance CONFORMANCE_ARGS="--from-results target/conformance-results"

      - name: Require every shard job to have succeeded
        env:
          SHARDS_RESULT: ${{ needs.conformance-shard.result }}
        run: test "$SHARDS_RESULT" = success
