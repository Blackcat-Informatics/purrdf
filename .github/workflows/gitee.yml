name: Sync to Gitee

on:
  pull_request:
    paths:
      - .github/workflows/gitee.yml
      - scripts/sync-git-refs.py
      - scripts/test_git_sync.py
  push:
    branches:
      - main
    tags:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Git sync regressions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - run: python3 scripts/test_git_sync.py

  sync:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 100
    concurrency:
      group: purrdf-gitee-sync
      cancel-in-progress: false
    steps:
      - name: Checkout current main and all tags
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Push and verify main and tags
        shell: bash
        env:
          GITEE_USERNAME: ${{ secrets.GITEE_USERNAME }}
          GITEE_PASSWORD: ${{ secrets.GITEE_PASSWORD }}
          LC_ALL: C
        run: |
          set -euo pipefail
          test -n "$GITEE_USERNAME" || { echo 'Missing GITEE_USERNAME secret' >&2; exit 1; }
          test -n "$GITEE_PASSWORD" || { echo 'Missing GITEE_PASSWORD secret' >&2; exit 1; }
          askpass=$(mktemp)
          trap 'rm -f "$askpass"' EXIT
          cat > "$askpass" <<'ASKPASS'
          #!/usr/bin/env bash
          set -euo pipefail
          case "$1" in
            "Username for 'https://gitee.com': "*) printf '%s\n' "$GITEE_USERNAME" ;;
            "Password for 'https://"*"@gitee.com': "*) printf '%s\n' "$GITEE_PASSWORD" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0
          export GIT_CONFIG_COUNT=4 GIT_CONFIG_KEY_0=credential.helper GIT_CONFIG_VALUE_0=''
          # Avoid chunked encoding for the initial pack on this mirror endpoint.
          export GIT_CONFIG_KEY_1=http.https://gitee.com/blackcat-informatics/purrdf.git.postBuffer
          export GIT_CONFIG_VALUE_1=134217728
          export GIT_CONFIG_KEY_2=http.https://gitee.com/blackcat-informatics/purrdf.git.lowSpeedLimit
          export GIT_CONFIG_VALUE_2=1
          export GIT_CONFIG_KEY_3=http.https://gitee.com/blackcat-informatics/purrdf.git.lowSpeedTime
          export GIT_CONFIG_VALUE_3=300
          # The empty mirror needs a full-history upload; keep reads at 45s.
          python3 - <<'PY'
          import importlib.util

          spec = importlib.util.spec_from_file_location("git_sync", "scripts/sync-git-refs.py")
          git_sync = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(git_sync)
          original_git = git_sync.git

          def bootstrap_git(arguments, deadline):
              if arguments[0] == "push":
                  print("Workflow push deadline: 1800 seconds.", flush=True)
              return original_git(arguments, 1800 if arguments[0] == "push" else deadline)

          git_sync.git = bootstrap_git
          git_sync.sync("https://gitee.com/blackcat-informatics/purrdf.git")
          PY
