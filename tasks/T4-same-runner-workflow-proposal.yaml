# PROPOSAL ONLY: replaces native-profile job, requires owning Rust changes in T4-same-runner-source-protocol.md. Not deployed or qualified.
  native-profile:
    if: github.event_name == 'workflow_dispatch' && inputs.native_profile
    needs: native-profile-admission
    runs-on: ubuntu-latest
    # The monolithic counterfactual must finish. Cancellation is not evidence.
    timeout-minutes: 360
    env:
      CARGO_BUILD_JOBS: 8
      PURRDF_REQUIRE_SIMD_PATHS: distance:portable,distance:sse2,blake3:sse2,deflate:sse2,csv:sse2
    steps:
      - name: Start task-owned disk setup evidence
        run: |
          campaign="/opt/purrdf-native-profile/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          sudo mkdir -p "$campaign"
          sudo chown -R "$(id -u):$(id -g)" "$campaign"
          date +%s%N > "$campaign/setup-start.txt"
          mkdir -p "$campaign/resources"
          cp "$campaign/setup-start.txt" "$campaign/resources/setup-start.txt"
          df -h /opt > "$campaign/resources/setup-disk-before.txt"
      - name: Reclaim unused runner toolchains before native links
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/share/swift
          df -h /opt > "/opt/purrdf-native-profile/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/resources/setup-disk-after.txt"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: "nightly" # keep in sync with rust-toolchain.toml
      # No artifact/dependency/compiler cache action runs in the experiment.
      # Registry/download and OS page caches are separately declared, not flushed.
      - name: Download exact compiler admission
        id: native-profile-admission-download
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: native-profile-${{ github.run_id }}-${{ github.run_attempt }}-admission
          path: /opt/purrdf-native-profile/${{ github.run_id }}-${{ github.run_attempt }}
      - name: Refuse a partial rerun without current-attempt admission
        if: failure() && steps.native-profile-admission-download.outcome == 'failure'
        run: |
          echo "::error::Current-attempt compiler admission is missing. Rerun ALL jobs in the profiling workflow; failed-jobs-only reruns cannot borrow evidence from older attempts."
          exit 1
      - name: Require the admitted compiler and Cargo before building the controller
        run: |
          campaign="/opt/purrdf-native-profile/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          rustc -vV > "$campaign/resources/actual-rustc.txt"
          cargo -Vv > "$campaign/resources/actual-cargo.txt"
          diff -u "$campaign/admitted-rustc.txt" "$campaign/resources/actual-rustc.txt"
          diff -u "$campaign/admitted-cargo.txt" "$campaign/resources/actual-cargo.txt"
      - name: Install Node for the actual native ECMAScript oracle
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Install the pinned Binaryen validator
        uses: ./.github/actions/binaryen-toolchain
      - name: Install the pinned header-contract generator outside measured targets
        run: cargo install cargo-c --version 0.10.23 --locked
      - name: Build the original Rust controller outside cold target AND build directories
        id: profile-setup
        run: |
          campaign="/opt/purrdf-native-profile/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          CARGO_TARGET_DIR="$campaign/controller-target" CARGO_BUILD_BUILD_DIR="$campaign/controller-build" \
            cargo build --locked -p purrdf-capi --example native_ci_profile --profile test --jobs 8
          echo "PURRDF_HOSTED_CONTROLLER=$campaign/controller-target/debug/examples/native_ci_profile" >> "$GITHUB_ENV"
          echo "PURRDF_HOSTED_REAL_CARGO=$(command -v cargo)" >> "$GITHUB_ENV"
      - name: Execute validated cold and unchanged warm before-monolithic
        env:
          PROFILE_CASE: before-monolithic
        run: |
          set -o pipefail
          campaign="/opt/purrdf-native-profile/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$campaign/$PROFILE_CASE"
          cp "$campaign/setup-start.txt" "$campaign/$PROFILE_CASE/setup-start.txt"
          cp "$campaign/resources/setup-disk-before.txt" "$campaign/$PROFILE_CASE/setup-disk-before.txt"
          cp "$campaign/resources/setup-disk-after.txt" "$campaign/$PROFILE_CASE/setup-disk-after.txt"
          cp "$campaign/resources/actual-rustc.txt" "$campaign/$PROFILE_CASE/actual-rustc.txt"
          cp "$campaign/resources/actual-cargo.txt" "$campaign/$PROFILE_CASE/actual-cargo.txt"
          "$PURRDF_HOSTED_CONTROLLER" hosted-run "$PROFILE_CASE" 2>&1 | tee "$campaign/$PROFILE_CASE/hosted-run.txt"
      - name: Retain before-monolithic source-bound evidence even on failure
        id: upload_before_monolithic
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-profile-${{ github.run_id }}-${{ github.run_attempt }}-arm-before-monolithic
          path: |
            /opt/purrdf-native-profile/${{ github.run_id }}-${{ github.run_attempt }}/before-monolithic/*.json
            /opt/purrdf-native-profile/${{ github.run_id }}-${{ github.run_attempt }}/before-monolithic/*.txt
            /opt/purrdf-native-profile/${{ github.run_id }}-${{ github.run_attempt }}/before-monolithic/*.diff
            /opt/purrdf-native-profile/${{ github.run_id }}-${{ github.run_attempt }}/before-monolithic/*-cargo/*.json
            /opt/purrdf-native-profile/${{ github.run_id }}-${{ github.run_attempt }}/before-monolithic/*-cargo/*.html
          if-no-files-found: error
          retention-days: 30
      - name: Revalidate uploaded before-monolithic evidence and reclaim only private build trees
        env:
          PROFILE_CASE: before-monolithic
          PURRDF_HOSTED_UPLOAD_ID: ${{ steps.upload_before_monolithic.outputs.artifact-id }}
          PURRDF_HOSTED_UPLOAD_DIGEST: ${{ steps.upload_before_monolithic.outputs.artifact-digest }}
        run: '"$PURRDF_HOSTED_CONTROLLER" hosted-reclaim "$PROFILE_CASE"'
      - name: Execute validated cold and unchanged warm before-capi
        env:
          PROFILE_CASE: before-capi
        run: |
