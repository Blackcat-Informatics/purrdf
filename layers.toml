# The crate layering: which first-party crate may depend on which, read by
# scripts/check-layers.py (in `make check`).
#
# Only NORMAL dependency edges between workspace members are governed here;
# dev- and build-dependencies are not layering (a test may reach any crate).
#
# root = the zero-dependency crate every crate may depend on. An edge to it is
#     never a layering breach and needs no planned entry, but a present one is
#     listed like any other so the table records the graph exactly.
#
# [[crate]] — one row per workspace member, and per planned member.
#   name    = the package name.
#   pending = true marks a crate that is planned but not yet a member. It is
#             allowed to be absent; once the member exists the key must go.
#   deps    = every first-party crate it may depend on. An entry is the package
#             name, or `{ name = "…", pending = true }` for a planned edge that
#             is allowed but not yet present.
#   external = present on a ring-fenced crate (the kernel ring-fence, checked
#             by `make rdf-core-hygiene` through `check-layers.py --ring-fence`):
#             every external package it may depend on, on any target. A
#             ring-fenced crate's runtime dependencies are exactly its `deps`
#             and its `external`; an empty `external` allows none. The root is
#             always ring-fenced to nothing and takes no `external`.
#
# The gate fails on:
#   * a first-party normal edge that no row allows, or an unlisted root edge;
#   * a member with no row, or a row (not pending) naming no member;
#   * a listed edge (not pending) the resolved graph no longer has, and a
#     pending edge or crate that now exists — flip it to present;
#   * a cycle in the declared graph, pending edges included.
#
# `python3 scripts/check-layers.py --home-for A B …` prints the crate closest to
# A, B, … that every one of them reaches over the declared graph (pending edges
# included): the lowest place one implementation shared by all of them can live.

root = "purrdf-hash"

[[crate]]
name = "purrdf-alloc-probe"
deps = []

[[crate]]
name = "purrdf-bench"
deps = ["purrdf-hash", "purrdf-iri", "purrdf-xsd"]

[[crate]]
name = "purrdf-hash"
