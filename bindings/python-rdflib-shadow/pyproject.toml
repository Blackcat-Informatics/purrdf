[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "purrdf-rdflib"
version = "3.0.0"
description = "Opt-in top-level `import rdflib` shadow that resolves to purrdf's rdflib compatibility surface"
readme = "README.md"
requires-python = ">=3.13"
license = "(MIT OR Apache-2.0 OR MulanPSL-2.0) AND CC-BY-4.0"
license-files = ["licenses/*", "licenses/**/*"]
authors = [
  { name = "Blackcat Informatics Inc.", email = "paudley@blackcatinformatics.ca" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = ["purrdf==3.0.0"]

[project.urls]
Homepage = "https://blackcatinformatics.ca/purrdf/"
Repository = "https://github.com/Blackcat-Informatics/purrdf"

[tool.hatch.build.targets.wheel]
packages = ["rdflib"]
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = ["rdflib/**", "README.md", "pyproject.toml", "licenses/**"]
