[package]
name = "purrdf-geo-private-qualification"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

# Match the shipping workspace so this host reuses its compiled dependencies.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"

[[bin]]
name = "geo-private-qualification"
path = "main.rs.txt"

[dependencies]
purrdf-geo-kernel = { path = "../../../crates/geo-kernel" }
purrdf-hash = { path = "../../../crates/hash" }
purrdf-deflate = { path = "../../../crates/deflate" }
sha2 = { version = "0.11", default-features = false }

