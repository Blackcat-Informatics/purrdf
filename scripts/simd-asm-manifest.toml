id = "hnsw.search-build"
summary = "HNSW `search::search_layer` and `builder::build_graph`, the distance-bound graph walk and build, each compiled in `purrdf_hnsw` once per arithmetic"

  # The exact index. The distance work is the `distance.exact.*` kernels these call; the
