[[site]]
id = "core.xsd-regex-scan"
summary = "the compiled XSD regex's literal prefilter (`regex_automata` `Memchr::find`) behind `is_match`"

  # x86_64: the prefilter calls memchr, which dispatches at run time. Measured v21.
  [[site.measure]]
  label = "sse2"
  configs = ["x86_64"]
  crate = "memchr"
  symbol = "memchr::arch::x86_64::memchr::memchr_raw::find_sse2"
  min_vector_ops = 10
  require_mnemonics = ["pcmpeqb", "pmovmskb"]
  max_fma = 0
  forbid_relaxed = true

  # Measured v24 on both.
  [[site.measure]]
  label = "avx2"
  configs = ["x86_64", "x86_64-v3"]
  crate = "memchr"
  symbol = "memchr::arch::x86_64::memchr::memchr_raw::find_avx2"
  min_vector_ops = 12
  require_mnemonics = ["vpcmpeqb", "vpmovmskb"]
  max_fma = 0
  forbid_relaxed = true

  # Mask-register compares. Measured v10.
  [[site.measure]]
  label = "avx2 (avx512 masks)"
  configs = ["x86_64-v4"]
  crate = "memchr"
  symbol = "memchr::arch::x86_64::memchr::memchr_raw::find_avx2"
  min_vector_ops = 5
  require_mnemonics = ["vpcmpeqb %k"]
  max_fma = 0
  forbid_relaxed = true

  # memchr's NEON kernel inlined into the prefilter. Measured v18 on both.
  [[site.measure]]
  label = "neon"
  configs = ["aarch64", "aarch64-neoverse-v1"]
  crate = "regex_automata"
  symbol = "<regex_automata::util::prefilter::memchr::Memchr as regex_automata::util::prefilter::PrefilterI>::find"
  min_vector_ops = 9
  require_mnemonics = ["cmeq .16b", "shrn", "umaxp"]
  max_fma = 0
  forbid_relaxed = true

  # Measured v18.
  [[site.measure]]
  label = "simd128"
  configs = ["wasm32-simd128"]
  crate = "regex_automata"
  symbol = "<regex_automata::util::prefilter::memchr::Memchr as regex_automata::util::prefilter::PrefilterI>::find"
  min_vector_ops = 9
  require_mnemonics = ["i8x16.eq", "i8x16.bitmask"]
  max_fma = 0
  forbid_relaxed = true

  # memchr's SWAR fallback. Measured v0.
  [[site.measure]]
  label = "swar"
  configs = ["wasm32"]
  crate = "regex_automata"
  symbol = "<regex_automata::util::prefilter::memchr::Memchr as regex_automata::util::prefilter::PrefilterI>::find"
  min_vector_ops = 0
  max_fma = 0
  forbid_relaxed = true

