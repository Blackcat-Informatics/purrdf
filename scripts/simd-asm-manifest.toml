  crate = "purrdf_core"
  symbol = "purrdf_core::iri_escape::find_first_candidate"
  min_vector_ops = 11
  require_mnemonics = ["vpcmpeqb", "vpmovmskb"]
  max_fma = 0
  forbid_relaxed = true

  # With AVX-512 in the build the compares write mask registers (`%k`). Measured v10.
  [[site.measure]]
  label = "iri scan avx512 masks"
  configs = ["x86_64-v4"]
  crate = "purrdf_core"
  symbol = "purrdf_core::iri_escape::find_first_candidate"
  min_vector_ops = 5
  require_mnemonics = ["vpcmpeqb %k"]
  max_fma = 0
  forbid_relaxed = true

  # NEON byte compares; `addp` folds the lanes. Measured v20.
  [[site.measure]]
  label = "iri scan neon"
  configs = ["aarch64"]
  crate = "purrdf_core"
  symbol = "purrdf_core::iri_escape::find_first_candidate"
  min_vector_ops = 10
  require_mnemonics = ["cmeq .16b", "cmhi .16b"]
  max_fma = 0
