[[site]]
id = "columnar.plain-codec"
summary = "PLAIN `INT64`: `encode_int64_plain` (from `ColumnValues::encode_plain`) and `decode_int64_plain` (from `decode_plain`), each out of line over the split column layout (a presence bitmap beside a dense `Vec<i64>` of the present values): the body is the value vector in little-endian bytes, so each direction is one contiguous copy"

  # With the values dense, the copy is a plain word copy on every little-endian target, and
  # LLVM's loop-idiom pass replaces it with one `memcpy` call (`memory.copy` on wasm32): the
  # library routine is the vector body, so the function itself holds no vector work and the
  # floor is 0. The required call is the proof of shape; losing it (a per-word loop back in
  # the function) reddens the gate even where a scalar loop would pass a floor of 0.
  # Measured v0 with one `memcpy` call on each x86_64 configuration.
  [[site.measure]]
  label = "encode"
  configs = ["x86_64", "x86_64-v3", "x86_64-v4"]
  crate = "purrdf_columnar"
  symbol = "purrdf_columnar::parquet::encode_int64_plain"
  min_vector_ops = 0
  require_mnemonics = ["callq memcpy"]
  max_fma = 0
  forbid_relaxed = true

  # The same single call, `bl memcpy`. Measured v0.
  [[site.measure]]
  label = "encode"
  configs = ["aarch64", "aarch64-neoverse-v1"]
  crate = "purrdf_columnar"
  symbol = "purrdf_columnar::parquet::encode_int64_plain"
  min_vector_ops = 0
  require_mnemonics = ["bl memcpy"]
  max_fma = 0
  forbid_relaxed = true

  # wasm32 lowers the copy to the bulk-memory `memory.copy`, with and without `simd128`.
  # Measured v0.
  [[site.measure]]
  label = "encode"
  configs = ["wasm32", "wasm32-simd128"]
  crate = "purrdf_columnar"
  symbol = "purrdf_columnar::parquet::encode_int64_plain"
  min_vector_ops = 0
  require_mnemonics = ["memory.copy"]
  max_fma = 0
  forbid_relaxed = true

  # Decode: the two length checks against the counted present rows (the popcount runs in
  # `decode_page`, before the page's null count is checked), then the same single copy.
  # Measured v0 with one `memcpy` call on each x86_64 configuration.
  [[site.measure]]
  label = "decode"
  configs = ["x86_64", "x86_64-v3", "x86_64-v4"]
  crate = "purrdf_columnar"
  symbol = "purrdf_columnar::parquet::decode_int64_plain"
  min_vector_ops = 0
  require_mnemonics = ["callq memcpy"]
  max_fma = 0
  forbid_relaxed = true

  # The same single call, `bl memcpy`. Measured v0.
  [[site.measure]]
  label = "decode"
  configs = ["aarch64", "aarch64-neoverse-v1"]
  crate = "purrdf_columnar"
  symbol = "purrdf_columnar::parquet::decode_int64_plain"
  min_vector_ops = 0
  require_mnemonics = ["bl memcpy"]
  max_fma = 0
  forbid_relaxed = true

  # `memory.copy`, with and without `simd128`. Measured v0.
  [[site.measure]]
  label = "decode"
  configs = ["wasm32", "wasm32-simd128"]
  crate = "purrdf_columnar"
  symbol = "purrdf_columnar::parquet::decode_int64_plain"
  min_vector_ops = 0
  require_mnemonics = ["memory.copy"]
  max_fma = 0
