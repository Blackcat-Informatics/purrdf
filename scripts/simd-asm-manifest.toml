# The sites `scripts/check-simd-asm.py` measures in emitted asm, one `[[site]]` each.
# The script's docstring defines every key; this header states how the numbers here
# were chosen.
#
# Every floor was set from a measurement of this tree's emitted asm, never guessed.
# `min_vector_ops` is half the smallest count measured across the configurations a
# measure covers, rounded down: a scheduling change in a new nightly moves a count by a
# few instructions and must not redden the gate, while losing the vector body takes it
# to zero or near it and must. `require_mnemonics` carries the proof of shape, and it is
# what a floor alone cannot express. A floor of 0 is a measured statement that the
# configuration runs a scalar or SWAR path, and the measure still requires the symbol to
# exist, so the statement stays attached to real code.
#
# A private or inlined site is measured in the function it is compiled into, which the
# measure names. memchr is the example: on x86_64 it dispatches at run time to its own
# `find_sse2` / `find_avx2` functions, so those are measured in crate `memchr`; on aarch64
# and wasm32 its kernels are `#[inline]`, and they are measured inside the purrdf
# function that inlined them.
#
# Every function row of the audit document has an entry here, whatever its verdict. A
# `leave` entry sets `min_vector_ops = 0` and requires no mnemonic: it records what the
# site compiles to (the document's generated cells), and still fails when the symbol it
# names disappears. A `rewrite` entry carries the floors and proof mnemonics of its
# reformulated shape; a rewritten site with nothing vector-shaped in it (a cursor, a
# table load) keeps 0 and says why. A `covered` entry carries the floors and the proof
# mnemonics that hold on each configuration. The site ids are the document's row ids.

[build]
packages = [
  "purrdf-core", "purrdf-iri", "purrdf-xsd", "purrdf-json", "purrdf-rdf", "purrdf-sparql-algebra",
  "purrdf-sparql-eval", "purrdf-sparql-results", "purrdf-datalog", "purrdf-entail", "purrdf-shapes",
  "purrdf-shex", "purrdf-markdown", "purrdf-hnsw", "purrdf-text", "purrdf-retrieval",
  "purrdf-columnar", "purrdf-geo", "purrdf-gts", "purrdf-slice",
]
# purrdf-wasm is also a cdylib, and linking one needs a linker for the target, which the
# cross configurations do not have and the asm does not need: it is built as an rlib.
rlib_packages = ["purrdf-wasm"]

[[site]]
id = "memchr.sparql-lex-string"
summary = "memchr2 kernels behind the SPARQL lexer's string clean-run skip (`Lexer::lex_string`, inlined into `Lexer::lex_one`)"

  # x86_64 baseline: memchr's SSE2 kernel. Measured v30.
  [[site.measure]]
  label = "sse2"
  configs = ["x86_64"]
  crate = "memchr"
  symbol = "memchr::arch::x86_64::memchr::memchr2_raw::find_sse2"
  min_vector_ops = 15
  require_mnemonics = ["pcmpeqb", "pmovmskb"]
  max_fma = 0
  forbid_relaxed = true

  # memchr's AVX2 kernel, selected at run time on the baseline build and the only kernel
  # emitted when the build already assumes AVX2. Measured v36 (x86_64), v38 (x86_64-v3).
  [[site.measure]]
  label = "avx2"
  configs = ["x86_64", "x86_64-v3"]
  crate = "memchr"
  symbol = "memchr::arch::x86_64::memchr::memchr2_raw::find_avx2"
  min_vector_ops = 18
  require_mnemonics = ["vpcmpeqb", "vpmovmskb"]
  max_fma = 0
  forbid_relaxed = true

  # With AVX-512 in the build the same kernel compares into mask registers
  # (`vpcmpeqb ..., %k0`, then `kord`/`kortestd`), so `vpmovmskb` is gone and the
  # mask-register compare is the proof. Measured v16.
  [[site.measure]]
  label = "avx2 (avx512 masks)"
  configs = ["x86_64-v4"]
  crate = "memchr"
  symbol = "memchr::arch::x86_64::memchr::memchr2_raw::find_avx2"
  min_vector_ops = 8
  require_mnemonics = ["vpcmpeqb %k"]
  max_fma = 0
  forbid_relaxed = true

  # NEON: memchr's kernel is inlined into the lexer; `shrn` + `umaxp` are its movemask.
  # Measured v150 on both aarch64 configurations.
  [[site.measure]]
  label = "neon"
  configs = ["aarch64", "aarch64-neoverse-v1"]
  crate = "purrdf_sparql_algebra"
  symbol = "purrdf_sparql_algebra::lexer::Lexer>::lex_one"
  min_vector_ops = 75
  require_mnemonics = ["cmeq .16b", "shrn", "umaxp"]
  max_fma = 0
  forbid_relaxed = true

  # simd128: memchr's wasm kernel inlined into the lexer. Measured v204.
  [[site.measure]]
  label = "simd128"
  configs = ["wasm32-simd128"]
  crate = "purrdf_sparql_algebra"
  symbol = "purrdf_sparql_algebra::lexer::Lexer>::lex_one"
  min_vector_ops = 102
  require_mnemonics = ["i8x16.eq", "i8x16.bitmask"]
  max_fma = 0
  forbid_relaxed = true

  # Baseline wasm32 has no vector instructions: memchr runs its word-at-a-time (SWAR)
  # fallback, and without the vector kernels `lex_one` is small enough to be inlined
  # into `Lexer::run`, which is where it is measured. Measured v0.
  [[site.measure]]
  label = "swar"
  configs = ["wasm32"]
  crate = "purrdf_sparql_algebra"
  symbol = "purrdf_sparql_algebra::lexer::Lexer>::run"
  min_vector_ops = 0
  max_fma = 0
  forbid_relaxed = true

[[site]]
id = "memchr.rdf-line-split"
summary = "memchr2 kernels behind the line-oriented codecs' line split (`split_line_chunks` / `count_line_terminators`, inlined into `parse_lines_parallel`)"

  # x86_64: the same memchr kernels the lexer reaches, by the same run-time dispatch.
  [[site.measure]]
  label = "sse2"
  configs = ["x86_64"]
  crate = "memchr"
  symbol = "memchr::arch::x86_64::memchr::memchr2_raw::find_sse2"
  min_vector_ops = 15
  require_mnemonics = ["pcmpeqb", "pmovmskb"]
  max_fma = 0
  forbid_relaxed = true

  [[site.measure]]
  label = "avx2"
  configs = ["x86_64", "x86_64-v3"]
  crate = "memchr"
  symbol = "memchr::arch::x86_64::memchr::memchr2_raw::find_avx2"
  min_vector_ops = 18
  require_mnemonics = ["vpcmpeqb", "vpmovmskb"]
  max_fma = 0
  forbid_relaxed = true

  [[site.measure]]
  label = "avx2 (avx512 masks)"
  configs = ["x86_64-v4"]
  crate = "memchr"
  symbol = "memchr::arch::x86_64::memchr::memchr2_raw::find_avx2"
  min_vector_ops = 8
  require_mnemonics = ["vpcmpeqb %k"]
  max_fma = 0
  forbid_relaxed = true

  # NEON: inlined into the parallel line parser. Measured v44 on both configurations.
  [[site.measure]]
  label = "neon"
  configs = ["aarch64", "aarch64-neoverse-v1"]
  crate = "purrdf_rdf"
  symbol = "purrdf_rdf::native_codecs::text_parse::parse_lines_parallel"
  min_vector_ops = 22
  require_mnemonics = ["cmeq .16b", "shrn", "umaxp"]
  max_fma = 0
  forbid_relaxed = true

  # simd128: measured v67.
  [[site.measure]]
  label = "simd128"
  configs = ["wasm32-simd128"]
  crate = "purrdf_rdf"
  symbol = "purrdf_rdf::native_codecs::text_parse::parse_lines_parallel"
  min_vector_ops = 33
  require_mnemonics = ["i8x16.eq", "i8x16.bitmask"]
  max_fma = 0
  forbid_relaxed = true

  # Baseline wasm32: memchr's SWAR fallback. Measured v0.
  [[site.measure]]
  label = "swar"
  configs = ["wasm32"]
  crate = "purrdf_rdf"
  symbol = "purrdf_rdf::native_codecs::text_parse::parse_lines_parallel"
  min_vector_ops = 0
  max_fma = 0
  forbid_relaxed = true

  # `PhysicalLines::next`, the serial line iterator, reaches the same memchr kernel: on
  # x86_64 through the dispatched `find_sse2` / `find_avx2` measured above, on aarch64 and
  # wasm32 inlined into the iterator. Measured v22 (both aarch64), v30 (simd128), v0
  # (wasm32).
  [[site.measure]]
  label = "neon (lines)"
  configs = ["aarch64", "aarch64-neoverse-v1"]
  crate = "purrdf_rdf"
  symbol = "<purrdf_rdf::native_codecs::text_parse::PhysicalLines as core::iter::traits::iterator::Iterator>::next"
  min_vector_ops = 11
  require_mnemonics = ["cmeq .16b", "shrn", "umaxp"]
  max_fma = 0
  forbid_relaxed = true

  [[site.measure]]
  label = "simd128 (lines)"
  configs = ["wasm32-simd128"]
  crate = "purrdf_rdf"
  symbol = "<purrdf_rdf::native_codecs::text_parse::PhysicalLines as core::iter::traits::iterator::Iterator>::next"
  min_vector_ops = 15
  require_mnemonics = ["i8x16.eq", "i8x16.bitmask"]
  max_fma = 0
  forbid_relaxed = true

  [[site.measure]]
  label = "swar (lines)"
  configs = ["wasm32"]
  crate = "purrdf_rdf"
  symbol = "<purrdf_rdf::native_codecs::text_parse::PhysicalLines as core::iter::traits::iterator::Iterator>::next"
  min_vector_ops = 0
  max_fma = 0
  forbid_relaxed = true

[[site]]
id = "sha2.sha256-compress"
summary = "SHA-256 block compression (content digests): sha2's SHA-NI kernel on x86_64, its portable code elsewhere"

  # sha2 dispatches at run time (cpufeatures) to its SHA-NI kernel; no x86-64 level
  # implies the SHA extensions, so all three builds keep it out of line.
  # Measured v126 (x86_64, x86_64-v3), v122 (x86_64-v4).
  [[site.measure]]
  label = "sha-ni"
  configs = ["x86_64", "x86_64-v3", "x86_64-v4"]
  crate = "sha2"
  symbol = "sha2::sha256::x86::digest_blocks"
  min_vector_ops = 61
  require_mnemonics = ["sha256rnds2", "sha256msg1", "sha256msg2"]
  max_fma = 0
  forbid_relaxed = true

  # sha2 0.10 compiles its ARMv8 crypto-extension backend only under its `asm` Cargo
  # feature, which this workspace does not enable, so aarch64 runs the portable
  # compression: general-register code with no vector work. wasm32 has only the
  # portable code. Measured v0 on all four configurations.
  [[site.measure]]
  label = "portable"
  configs = ["aarch64", "aarch64-neoverse-v1", "wasm32", "wasm32-simd128"]
  crate = "sha2"
  symbol = "sha2::sha256::compress256"
  min_vector_ops = 0
  max_fma = 0
  forbid_relaxed = true

[[site]]
id = "blake3.hash-many-dispatch"
summary = "BLAKE3 multi-chunk hashing (GTS content identity): run-time dispatch into blake3's own SIMD kernels"

  # blake3's x86_64 kernels are hand-written assembly its build script assembles, not
  # rustc output, so there is no vector body in rustc's asm to count. What rustc's asm
  # does prove is that the dispatch reaches them: every width is called from the
  # chunk-parallel path. Measured v0, all four calls present, on all three builds.
  [[site.measure]]
  label = "asm kernels"
  configs = ["x86_64", "x86_64-v3", "x86_64-v4"]
  crate = "blake3"
  symbol = "blake3::compress_chunks_parallel"
  min_vector_ops = 0
  require_mnemonics = [
    "callq blake3_hash_many_sse2",
    "callq blake3_hash_many_sse41",
    "callq blake3_hash_many_avx2",
    "callq blake3_hash_many_avx512",
  ]
  max_fma = 0
  forbid_relaxed = true

  # aarch64: blake3's NEON kernel is C its build script compiles; the chunk-parallel
  # path calls it. Measured v0 with the call present on both configurations.
  [[site.measure]]
  label = "neon (C)"
  configs = ["aarch64", "aarch64-neoverse-v1"]
  crate = "blake3"
  symbol = "blake3::compress_chunks_parallel"
  min_vector_ops = 0
  require_mnemonics = ["bl blake3_hash_many_neon"]
  max_fma = 0
  forbid_relaxed = true

  # wasm32: blake3's simd128 backend is compiled only under its `wasm32_simd` Cargo
  # feature, which this workspace does not enable, so both wasm builds run the portable
  # compression, and LLVM does not vectorize it. Measured v0 on both.
  [[site.measure]]
  label = "portable"
  configs = ["wasm32", "wasm32-simd128"]
  crate = "blake3"
  symbol = "blake3::portable::compress_in_place"
  min_vector_ops = 0
  max_fma = 0
  forbid_relaxed = true

[[site]]
id = "sparql.lexer-trivia"
summary = "`Lexer::skip_trivia`: one `terminals::find_first_trivia` call per `WS` run, `memchr` per comment tail"

  # The whitespace run is skipped by the out-of-line scanner, one copy in `purrdf_iri`
  # that the lexer calls; its vector work is measured there.
  # Packed byte compares, `pmovmskb` extracts the lane mask. Measured v10.
  [[site.measure]]
  label = "scan sse2"
  configs = ["x86_64"]
  crate = "purrdf_iri"
  symbol = "purrdf_iri::scan::find_first_trivia"
  min_vector_ops = 5
  require_mnemonics = ["pcmpeqb", "pmovmskb"]
  max_fma = 0
  forbid_relaxed = true

  # The same shape, VEX-encoded. Measured v22.
  [[site.measure]]
  label = "scan avx2"
  configs = ["x86_64-v3"]
  crate = "purrdf_iri"
  symbol = "purrdf_iri::scan::find_first_trivia"
  min_vector_ops = 11
  require_mnemonics = ["vpcmpeqb", "vpmovmskb"]
  max_fma = 0
  forbid_relaxed = true

  # With AVX-512 in the build the compares write mask registers (`%k`) rather than
  # vector lanes, as in memchr's kernel. Measured v18.
  [[site.measure]]
  label = "scan avx512 masks"
  configs = ["x86_64-v4"]
  crate = "purrdf_iri"
  symbol = "purrdf_iri::scan::find_first_trivia"
  min_vector_ops = 9
  require_mnemonics = ["vpcmpltub %k"]
  max_fma = 0
  forbid_relaxed = true

  # NEON byte compares; `addp` folds the lanes. Measured v8 (aarch64), v8
  # (aarch64-neoverse-v1).
  [[site.measure]]
  label = "scan neon"
  configs = ["aarch64", "aarch64-neoverse-v1"]
  crate = "purrdf_iri"
  symbol = "purrdf_iri::scan::find_first_trivia"
  min_vector_ops = 4
  require_mnemonics = ["cmeq .16b", "cmhi .16b"]
  max_fma = 0
  forbid_relaxed = true

  # Baseline wasm32 has no vector instructions: the lane loop is straight-line scalar
  # code, same result. Measured v0.
  [[site.measure]]
  label = "scan scalar"
  configs = ["wasm32"]
  crate = "purrdf_iri"
  symbol = "purrdf_iri::scan::find_first_trivia"
  min_vector_ops = 0
  max_fma = 0
  forbid_relaxed = true

  # Packed byte compares. Measured v8.
  [[site.measure]]
  label = "scan simd128"
  configs = ["wasm32-simd128"]
  crate = "purrdf_iri"
  symbol = "purrdf_iri::scan::find_first_trivia"
  min_vector_ops = 4
  require_mnemonics = ["i8x16.lt_u"]
  max_fma = 0
  forbid_relaxed = true

  # The call site, inlined into `Lexer::run`; its count includes the inlined
  # comment-tail `memchr`.
  [[site.measure]]
  label = "call site (in run)"
  configs = ["x86_64", "x86_64-v3", "x86_64-v4", "aarch64", "aarch64-neoverse-v1", "wasm32", "wasm32-simd128"]
  crate = "purrdf_sparql_algebra"
  symbol = "purrdf_sparql_algebra::lexer::Lexer>::run"
  min_vector_ops = 0
  max_fma = 0
  forbid_relaxed = true

[[site]]
id = "sparql.lexer-iri"
summary = "`Lexer::lex_lt_or_iri`, a single `terminals::find_first_iri_body_special` pass over the `IRIREF` body"

  # The body scan is the out-of-line scanner in `purrdf_iri`; its vector work is
  # measured there.
  # Packed byte compares, `pmovmskb` extracts the lane mask. Measured v17.
  [[site.measure]]
  label = "scan sse2"
  configs = ["x86_64"]
  crate = "purrdf_iri"
  symbol = "purrdf_iri::scan::find_first_iri_body_special"
  min_vector_ops = 8
  require_mnemonics = ["pcmpeqb", "pmovmskb"]
  max_fma = 0
  forbid_relaxed = true

  # The same shape, VEX-encoded. Measured v16.
  [[site.measure]]
  label = "scan avx2"
  configs = ["x86_64-v3"]
  crate = "purrdf_iri"
  symbol = "purrdf_iri::scan::find_first_iri_body_special"
  min_vector_ops = 8
  require_mnemonics = ["vpcmpeqb", "vpmovmskb"]
  max_fma = 0
  forbid_relaxed = true

  # With AVX-512 in the build the compares write mask registers (`%k`) rather than
  # vector lanes, as in memchr's kernel. Measured v8.
  [[site.measure]]
  label = "scan avx512 masks"
  configs = ["x86_64-v4"]
  crate = "purrdf_iri"
  symbol = "purrdf_iri::scan::find_first_iri_body_special"
  min_vector_ops = 4
  require_mnemonics = ["vpcmpeqb %k"]
  max_fma = 0
  forbid_relaxed = true

  # NEON byte compares; `addp` folds the lanes. Measured v14.
  [[site.measure]]
  label = "scan neon"
  configs = ["aarch64"]
  crate = "purrdf_iri"
  symbol = "purrdf_iri::scan::find_first_iri_body_special"
  min_vector_ops = 7
  require_mnemonics = ["cmeq .16b", "cmhi .16b"]
  max_fma = 0
  forbid_relaxed = true

  # With SVE in the build LLVM compares into predicate registers (`cmpeq`, `cmplo`).
  # Measured v11.
  [[site.measure]]
  label = "scan sve"
  configs = ["aarch64-neoverse-v1"]
  crate = "purrdf_iri"
  symbol = "purrdf_iri::scan::find_first_iri_body_special"
  min_vector_ops = 5
  require_mnemonics = ["cmpeq"]
  max_fma = 0
  forbid_relaxed = true

  # Baseline wasm32 has no vector instructions: the lane loop is straight-line scalar
  # code, same result. Measured v0.
  [[site.measure]]
  label = "scan scalar"
  configs = ["wasm32"]
  crate = "purrdf_iri"
  symbol = "purrdf_iri::scan::find_first_iri_body_special"
  min_vector_ops = 0
  max_fma = 0
  forbid_relaxed = true

  # Packed byte compares. Measured v13.
  [[site.measure]]
  label = "scan simd128"
  configs = ["wasm32-simd128"]
  crate = "purrdf_iri"
  symbol = "purrdf_iri::scan::find_first_iri_body_special"
  min_vector_ops = 6
  require_mnemonics = ["i8x16.eq", "i8x16.lt_u"]
  max_fma = 0
  forbid_relaxed = true

  # The call site, inlined through `lex_one` into `run` where `lex_one` is itself inlined.
  [[site.measure]]
  label = "call site (in run)"
  configs = ["x86_64", "x86_64-v3", "x86_64-v4", "wasm32"]
  crate = "purrdf_sparql_algebra"
  symbol = "purrdf_sparql_algebra::lexer::Lexer>::run"
  min_vector_ops = 0
  max_fma = 0
  forbid_relaxed = true

  # The call site, in the out-of-line `lex_one`.
  [[site.measure]]
  label = "call site (in lex_one)"
  configs = ["aarch64", "aarch64-neoverse-v1", "wasm32-simd128"]
  crate = "purrdf_sparql_algebra"
  symbol = "purrdf_sparql_algebra::lexer::Lexer>::lex_one"
  min_vector_ops = 0
  max_fma = 0
  forbid_relaxed = true

[[site]]
id = "sparql.lexer-cursor"
summary = "`Lexer::cur` / `Lexer::peek`, an ASCII fast path that decodes only a non-ASCII lead"

  # The ASCII window test of `peek` is `<[u8]>::is_ascii`; it is scalar or std's own
  # word test, and the entry records it. Measured v4 (x86_64, x86_64-v3), v3
  # (x86_64-v4), v5 (aarch64, aarch64-neoverse-v1), v0 (wasm32, wasm32-simd128).
  [[site.measure]]
  label = "peek"
  configs = ["x86_64", "x86_64-v3", "x86_64-v4", "aarch64", "aarch64-neoverse-v1", "wasm32", "wasm32-simd128"]
  crate = "purrdf_sparql_algebra"
  symbol = "purrdf_sparql_algebra::lexer::Lexer>::peek"
  min_vector_ops = 0
  max_fma = 0
  forbid_relaxed = true

  # `cur` is one byte load and a compare, inlined into `Lexer::run`.
  [[site.measure]]
  label = "cur (in run)"
  configs = ["x86_64", "x86_64-v3", "x86_64-v4", "aarch64", "aarch64-neoverse-v1", "wasm32", "wasm32-simd128"]
  crate = "purrdf_sparql_algebra"
  symbol = "purrdf_sparql_algebra::lexer::Lexer>::run"
  min_vector_ops = 0
  max_fma = 0
  forbid_relaxed = true

