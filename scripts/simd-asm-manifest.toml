[[site]]
id = "distance.exact.dot"
summary = "`exact::dot`, the sixteen-lane exact dot fold, in the batch kernels the kNN scan (`distances`) and the HNSW beam (`distances_indexed`) call"

  # Baseline SSE2: the portable compilation packs the sixteen lanes into xmm pairs.
  # Measured v169.
  [[site.measure]]
  label = "batch f64×f64"
  configs = ["x86_64"]
  crate = "purrdf_core"
  symbol = "purrdf_core::distance::dispatch::portable::distances::<f64, f64>"
  min_vector_ops = 84
  require_mnemonics = ["addpd", "mulpd"]
  max_fma = 0
  forbid_relaxed = true

  # The `#[target_feature(enable = "avx2")]` compilation of the same body, selected at
  # run time. Measured v157. On x86-64-v3 the callers already have AVX2, so LLVM
  # inlines it into the dispatch wrapper and the portable symbol below is itself the
  # AVX2 code; on x86-64-v4 it is the AVX-512F code.
  [[site.measure]]
  label = "batch f64×f64 avx2"
  configs = ["x86_64"]
  crate = "purrdf_core"
  symbol = "purrdf_core::distance::dispatch::avx2::distances::<f64, f64>"
  min_vector_ops = 78
  require_mnemonics = ["vaddpd", "vmulpd"]
  max_fma = 0
  forbid_relaxed = true

  # The `#[target_feature(enable = "avx512f")]` compilation of the same body, selected at
  # run time ahead of AVX2. The sixteen lanes are two `zmm` registers, so each
  # sixteen-element block issues half the packed arithmetic of the AVX2 compilation's
  # four `ymm`, with no FMA, and the `%zmm` operand is required as the proof of width.
  # Out of line in a baseline and an x86-64-v3 build; in an x86-64-v4 build the callers
  # already have AVX-512F, so it is inlined into the portable symbol, measured below.
  # Measured v117 (x86_64), v133 (x86_64-v3); AVX2 v157 (x86_64).
  [[site.measure]]
  label = "batch f64×f64 avx512f"
  configs = ["x86_64", "x86_64-v3"]
  crate = "purrdf_core"
  symbol = "purrdf_core::distance::dispatch::avx512f::distances::<f64, f64>"
  min_vector_ops = 58
  require_mnemonics = ["vaddpd %zmm", "vmulpd %zmm"]
  max_fma = 0
  forbid_relaxed = true

  # A consumer build with AVX2 (and FMA, which the exact fold never uses): the AVX2
  # compilation is inlined into the portable symbol. Measured v157 (x86_64-v3).
  [[site.measure]]
  label = "batch f64×f64"
  configs = ["x86_64-v3"]
  crate = "purrdf_core"
  symbol = "purrdf_core::distance::dispatch::portable::distances::<f64, f64>"
  min_vector_ops = 78
  require_mnemonics = ["vaddpd", "vmulpd"]
  max_fma = 0
  forbid_relaxed = true

  # A consumer build with AVX-512F: the AVX-512F compilation is inlined into the portable
  # symbol, and it keeps the two `zmm` lanes under this CPU's tuning. Measured v133.
  [[site.measure]]
  label = "batch f64×f64"
  configs = ["x86_64-v4"]
  crate = "purrdf_core"
  symbol = "purrdf_core::distance::dispatch::portable::distances::<f64, f64>"
  min_vector_ops = 66
  require_mnemonics = ["vaddpd %zmm", "vmulpd %zmm"]
  max_fma = 0
  forbid_relaxed = true

  # NEON `v.2d` lanes; neoverse-v1 adds only strictly ordered SVE `fadda` reductions.
  # Measured v160 (aarch64), v167 (neoverse-v1).
  [[site.measure]]
  label = "batch f64×f64"
  configs = ["aarch64", "aarch64-neoverse-v1"]
  crate = "purrdf_core"
  symbol = "purrdf_core::distance::dispatch::portable::distances::<f64, f64>"
  min_vector_ops = 80
  require_mnemonics = ["fadd .2d", "fmul .2d"]
