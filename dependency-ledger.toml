# The ledger of removed third-party dependencies.
#
# [inhouse_names]
# ---------------
# A removed package's name is checked for in the prose and source a reader
# meets — AGENTS.md, README.md, docs/, every crate's README.md and src/ (never
# a PROVENANCE.md or a frozen differential-vector file) — with
#
#     rg -n -w '<pkg>' AGENTS.md README.md docs crates/*/README.md crates/*/src \
#         --glob '!**/PROVENANCE.md' --glob '!**/*differential_vectors*'
#
# and every line it prints must be matched by one of the regular expressions
# listed here under that package's name. Each entry is an in-house identifier or
# an unrelated word that legitimately shares the token, with the reason it is
# not the removed package. A line no entry matches is a leftover reference to
# the removed package and fails.

[inhouse_names]
rand = [
    # SPARQL's RAND() function: the evaluator's parallel-safety test binds the
    # call expression to a local named after it.
    '\blet rand = call\(Function::Rand, vec!\[\]\);',
    '\brand\.clone\(\)',
    'call\(Function::Concat, vec!\[safe, rand\]\)',
    # SPARQL's RAND() function, detected by name in captured query text.
    'lower\.contains\("rand\("\)',
    # SPARQL's RAND() function in the evaluator's own test messages.
    '"(first|second) rand \{f[12]\} not in \[0,1\)"',
    '"rand should differ across calls"',
    # A CSV test string: a carriage return (`\r`) followed by the word "and".
    'line\\rand second',
    # The GTS ULID generator's statement that it depends on no RNG crate.
    '`uuid`, `ulid`, `rand`, or `getrandom`',
]
url = [
    # `url` is an ordinary word and an identifier throughout the tree: the
    # CSVW `url` property and every `table.url`, the SVG `url(#…)` paint
    # reference, the JavaScript `URL`/`import.meta.url` of the playground and
    # the book, and local variables named `url`. A reference to the removed
    # crate takes one of three shapes — a `url::` path, a manifest entry
    # `url = "…"` / `url = { … }`, or the crate named as a crate or
    # dependency — and a line holding any of them is not matched here.
    '^(?!.*(?<![\w.-])url::)(?!.*(?<![\w.-])url\s*=\s*[{"])(?!.*`url` (?:crate|dependency)).*\burl\b',
]
sha1 = [
    # `purrdf_hash::sha1`, the in-house SHA-1 module, in a path or a grouped
    # import (`crate::sha1` inside purrdf-hash), and its declaration and
    # documentation in purrdf-hash itself.
    '\b(?:purrdf_hash|crate)::(?:\{[^}]*\bsha1::|sha1::)',
    '^pub mod sha1;$',
    '\[`sha1`\] \| SHA-1 \|',
    '^\| `sha1` \| SHA-1 \|',
    # The name of purrdf-hash's Armv8 SHA1-instruction execution path.
    '"aarch64-sha1"',
    # A local variable named after the digest it holds.
    '\blet mut sha1 = (?:Self|Sha1)::new\(\);',
    '\bsha1\.(?:update|finalize)\(',
    # The published derivation-identity recipe, written as a function of SHA-1.
    'sha1\(rule_identity \+\+',
]
sha3 = [
    # `purrdf_hash::sha3`, the in-house SHA-3 module, in a path or a grouped
    # import, and its declaration and documentation in purrdf-hash itself.
    '\bpurrdf_hash::(?:\{[^}]*\bsha3::|sha3::)',
    '^pub mod sha3;$',
    '\[`sha3`\] \| SHA3-224',
    '^\| `sha3` \| SHA3-224',
    # SPARQL's SHA3-224 … SHA3-512 built-ins spelled in query text, and a
    # lexer test's variable `?sha3` that must not absorb the hyphen.
    '`sha3-256` is the same',
    '"\?sha3-224"',
    'var\("sha3"\)',
    'BIND\(sha3-512\(',
]
smallvec = [
    # `purrdf_core::smallvec!`, the in-house small-vector constructor macro:
    # its definition, its documentation, and every call site (qualified or
    # imported) in the crates that build `SmallVec` rows.
    'macro_rules! smallvec \{',
    '`smallvec!\[',
    '\bsmallvec!\[',
    # Imports and re-exports of that macro alongside other purrdf_core items.
    '^use purrdf_core::\{SmallVec, smallvec\};$',
    '^use ::purrdf::\{[^}]*\bsmallvec\};$',
    '^\s+research_object_to_rdf_loss_ledger, rule_iri, skolemize, smallvec, try_canonicalize,$',
]
csv = [
    # File names and extensions: every `nodes.csv`, `data/train.csv`,
    # `{token}.csv` artifact path and `.csv` suffix test.
    '\.csv\b',
    # Hyphenated format and profile names (`lpg-csv`, `neo4j-csv`,
    # `purrdf-lpg-neo4j-admin-csv`) and the W3C SPARQL CSV/TSV spec slug.
    '\b(?:lpg|neo4j|admin|results)-csv\b',
    '\bcsv-tsv\b',
    # `purrdf_core::csv`, the in-house CSVW dialect module, and the modules
    # named after the CSV format in purrdf-rdf's LPG projection and in
    # purrdf-sparql-results, by path, declaration and re-export.
    '\b(?:purrdf_core|crate|super)::csv\b',
    '^\s*(?:pub )?mod csv;$',
    '^\s*pub use csv::(?:to_csv;|\{)$',
    '\bcsv::write_csv\(',
    # The CSV results format keyword on the command line, in match arms and
    # in documentation.
    '"csv"',
    '`csv`',
    'json/xml/csv/tsv',
    '--results-format csv\b',
    # A local variable holding serialized CSV results.
    '\blet csv = ',
    '\bcsv\.bytes\b',
]
