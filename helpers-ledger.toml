# The helpers ledger: one row per job — a piece of functionality the workspace
# implements exactly once — naming its single home, what it replaces, and the
# sanctioned second implementations. Read by crates/helper-census and by
# scripts/check-shared-helpers.py (in `make check`); the IRI resolver gate
# (scripts/check-iri-resolver-singleton.py) reads its exemptions from here too.
#
# [[job]] — every key is required; an empty array states "none".
#   id                = the row id, used by `--census <id>` and `--count <id>`.
#   summary           = what the job is, in one line.
#   home              = the single implementation, `crate::path::item`; it must
#                       resolve (through re-exports) to a defined item. The home
#                       CRATE is the job's home: a forbidden match elsewhere is a
#                       copy, and copies inside the home crate are the isomorphic
#                       group rule's business.
#   entry_points      = further public paths to the same implementation (aliases,
#                       re-exports, thin shims); each must resolve.
#   spec              = the specification or contract the home implements.
#   vectors           = repo-relative frozen vector files; each must exist.
#   bench             = `package:bench-target` ids; each must be a bench target.
#   sites             = scripts/simd-asm-manifest.toml site ids; every symbol a
#                       site measures must lie in the home crate.
#   replaces_external = external packages the home replaces; each must be banned
#                       in scripts/check-banned-deps.py.
#   enforced          = true: a forbidden match outside the home fails the gate.
#                       false: the job still has copies; --census and --count
#                       report them. A job with no copies left must be enforced.
#
# [job.forbidden] — what may not appear outside the home crate.
#   constants    = integer literals, any spelling, compared by value
#                  (`0xcbf2_9ce4_8422_2325` is its decimal spelling too).
#   fingerprints = helper-census ids: `body:<hex>` (a structural body shape),
#                  `shim:<hex>` (a forwarder shape), `table:hex-lower` or
#                  `table:hex-upper` (a hex-digit table in shipping code), or a
#                  census rule over every first-party file, tests and benches
#                  included (`rule:std-default-hasher`: a std HashMap/HashSet
#                  left on its random default hasher; `rule:hex-format-loop`: a
#                  `{:02x}`/`{:02X}` format inside a loop or closure;
#                  `rule:hex-pair-radix`: `u8::from_str_radix(_, 16)`;
#                  `rule:hex-table`: a hex-digit table, exempt inside the home
#                  package), or a rule another gate computes
#                  over shipping code (from scripts/check-hash-domains.py:
#                  `rule:raw-hash-domain`, a domain-shaped literal handed to a
#                  hasher without a purrdf_hash::Domain; `rule:shared-hash-domain`,
#                  one domain opening hashers in two functions of its file), or
#                  a literal rule over shipping code (`rule:vocabulary-literal`:
#                  a string literal equal to or starting with a namespace
#                  constant — a `NS` or `*_NS` const — declared under the job's
#                  home and entry-point modules, outside those modules, an
#                  embedded Turtle/SPARQL document excepted; `rule:home-literal`:
#                  a string literal equal to one the home item's own bodies
#                  spell, outside the home item). A body or shim fingerprint
#                  must still match some unit.
#   names        = regular expressions over function names.
#
# [[job.variant]] — a sanctioned second implementation; each is re-checked on
# every run, and one that no longer matches anything is STALE and fails.
#   symbol    = the variant, `crate::path::item`; must resolve, in `file`.
#   file      = the repo-relative file that defines it.
#   detector  = what it is exempt from: `isomorphic` (it may share a body shape
#               with the home), `forbidden` (it may hold a forbidden pattern),
#               a rule id of the IRI resolver gate, or a rule of
#               scripts/check-hash-domains.py: `shared-hash-domain` (the named
#               domain may open two constructions) or `undomained-digest` (the
#               named function may compute a digest with no domain).
#   criterion = why it may exist: `a` (a specification or conformance suite
#               requires the difference), `b` (a tangible benefit its
#               documentation states), `c` (a measured, significant speedup that
#               cannot be centralised), or `layering` (its callers cannot reach
#               the home).
#   anchor    = the documented item that states the reason; it must resolve and
#               carry documentation.
#   reason    = the reason, in one or two sentences.

[[job]]
id = "iri-reference-resolution"
summary = "RFC 3986 reference resolution: the base-precedence chain and the reference arithmetic"
home = "purrdf_iri::BaseScope"
entry_points = ["purrdf_iri::Iri::resolve", "purrdf_core::BaseIri", "purrdf_core::parse_iri"]
spec = "RFC 3986 section 5.1 (establishing a base) and section 5.2 (relative resolution), over RFC 3987 IRIs"
vectors = []
bench = ["purrdf-iri:parse"]
sites = []
replaces_external = ["fluent-uri", "oxiri", "url"]
enforced = true

[job.forbidden]
constants = []
fingerprints = []
names = ['remove_dot_segments$', 'merge_paths?$']

[[job.variant]]
symbol = "purrdf_gts::files::validate_symlink_target"
file = "crates/gts/src/files.rs"
detector = "dot-segment-loop"
criterion = "b"
anchor = "purrdf_gts::files::validate_symlink_target"
reason = "Archive symlink targets are member paths, not IRI references: an escape above the extraction root must be refused, where RFC 3986 dot-segment removal clamps at the root and would turn a rejected zip-slip into a silently rewritten path."

[[job.variant]]
symbol = "purrdf_rdf::native_codecs::okf::reader::resolve_link_path"
file = "crates/rdf/src/native_codecs/okf/reader.rs"
detector = "dot-segment-loop"
criterion = "b"
anchor = "purrdf_rdf::native_codecs::okf::reader::resolve_link_path"
reason = "OKF bundle-relative Markdown link targets are member paths inside the bundle's file tree; a link that climbs above the bundle root is refused, which RFC 3986 dot-segment removal would clamp instead."

[[job.variant]]
symbol = "purrdf_rdf::projections::research_object::config::ResearchObjectIdentity::resolve_relative"
file = "crates/rdf/src/projections/research_object/config.rs"
detector = "resolver-fn"
criterion = "b"
anchor = "purrdf_rdf::projections::research_object::config::ResearchObjectIdentity::resolve_relative"
reason = "Not a resolver: it first refuses every input a resolver would have to reason about (absolute, dot-segment, query, fragment, backslash) and then concatenates under a caller-owned base, so nothing of RFC 3986 section 5.2 is re-implemented."

