[[job.variant]]
symbol = "purrdf_datalog::cache::CONTRACT_DIGEST_TAG"
file = "crates/datalog/src/cache.rs"
detector = "shared-hash-domain"
criterion = "a"
anchor = "purrdf_datalog::cache::CONTRACT_DIGEST_TAG"
reason = "One ContractHash kind at two refinement levels: the guarded re-fold hashes a 32-byte BLAKE3 contract digest where the other layout frames the calculus version, so a cross-layout collision is computationally infeasible, and a new domain would move every guarded program's published contract hash."

[[job.variant]]
symbol = "purrdf_text::term_bytes::fingerprint_terms"
file = "crates/text/src/term_bytes.rs"
detector = "undomained-digest"
criterion = "a"
anchor = "purrdf_text::term_bytes::fingerprint_terms"
reason = "A term-sequence fingerprint is its own kind, compared only with another fingerprint, and a published identity callers record; a domain prefix would change every recorded value."

[[job.variant]]
symbol = "purrdf_text::index::TextIndex::analyzer_fingerprint"
file = "crates/text/src/index.rs"
detector = "undomained-digest"
criterion = "a"
anchor = "purrdf_text::index::TextIndex::analyzer_fingerprint"
reason = "The analyzer profile id is absorbed first and already names the family; the fingerprint is its own kind and a published identity, so a registered domain would change every recorded value."

[[job.variant]]
symbol = "purrdf_core::artifact::identity::Identity::refresh"
file = "crates/rdf-core/src/artifact/identity.rs"
detector = "undomained-digest"
criterion = "a"
anchor = "purrdf_core::artifact::identity::Identity::refresh"
reason = "An artifact identity digest is its own kind, compared only with another identity digest, and is sealed into every artifact header; a domain would break every artifact already written."

