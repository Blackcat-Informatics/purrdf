[[job.variant]]
symbol = "purrdf_xsd::numeric::Decimal::cmp_exact"
file = "crates/xsd/src/numeric.rs"
detector = "forbidden"
criterion = "a"
anchor = "purrdf_xsd::numeric::Decimal"
reason = "The xsd:decimal value space this crate models is an i128 mantissa at a scale of at most 18 digits, which XSD 1.1 permits a processor to bound; a literal past it is refused, so its comparison is fixed-width integer arithmetic, not a big integer."

[[job.variant]]
symbol = "purrdf_jsonschema::number::Decimal::is_multiple_of"
file = "crates/jsonschema/src/number.rs"
detector = "forbidden"
criterion = "a"
anchor = "purrdf_jsonschema::number::Decimal"
reason = "JSON Schema compares and divides numbers whose exponent no machine word holds; the decimal keeps its exponent in a word until it overflows and computes on BigInt only then, so 1e999999999999999999999 is never expanded into digits."

[[job.variant]]
symbol = "purrdf_shapes::json_schema::numeric_order::Decimal::from_binary"
file = "crates/shapes/src/json_schema/numeric_order.rs"
detector = "forbidden"
criterion = "b"
anchor = "purrdf_shapes::json_schema::numeric_order::Decimal"
reason = "The numeric-order patterns are written digit by digit, so a range bound is kept as its integer and fraction digit strings; the dyadic expansion itself is BigInt::from_binary, which this converts to those strings."

[[job.variant]]
symbol = "purrdf_geo::exact::Int::pow10"
file = "crates/geo/src/exact.rs"
detector = "forbidden"
criterion = "c"
anchor = "purrdf_geo::exact::Int"
reason = "The geometry kernel's integers are binary 64-bit limbs with an inline small-vector, whose adds, multiplies and shifts are the pinned site geo.exact-limbs; base-10^9 limbs would put a division by 10^9 into every carry of the predicates' inner loops."

